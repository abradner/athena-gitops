---
# Intel GPU device plugin, vendored from upstream v0.37.1:
#   https://github.com/intel/intel-device-plugins-for-kubernetes/blob/v0.37.1/deployments/gpu_plugin/base/intel-gpu-plugin.yaml
#
# Advertises gpu.intel.com/i915 on the GPU workers (the amd64 boxes that run
# the spritz video transcoder; bootstrap/talos/worker-gpu.patch.yaml) and
# hands a pod that requests it /dev/dri/card0 + renderD128.
#
# Plain DaemonSet, not the Intel device-plugins operator: the operator adds a
# controller, CRDs and a webhook (and wants cert-manager wiring) to manage
# what is, here, one DaemonSet on one kind of node. Vendored rather than a
# kustomize remote base so the exact bytes are reviewable and no new
# sourceRepo is needed in the `core` AppProject. Same pattern as
# cluster/core/storage/local-path-provisioner.yaml (applied directly by the
# cluster-core Application; no Application of its own).
#
# CHANGES FROM UPSTREAM:
#   1. namespace: kube-system. The pod bind-mounts host paths, so it needs a
#      namespace PSA does not enforce on; Talos exempts kube-system.
#   2. Image pinned by digest (single-arch amd64 manifest).
#   3. nodeSelector spritz.dev/gpu=intel (upstream: any amd64 node) plus a
#      toleration for the GPU workers' NoSchedule taint.
#   4. -shared-dev-num=100: each iGPU is advertised as 100 x
#      gpu.intel.com/i915, so a request reads as a percentage of one iGPU.
#      A share is a SCHEDULING WEIGHT, NOT A QUOTA: nothing meters or caps
#      use, and every holder sees the whole iGPU (the media engine
#      time-slices concurrent work). The count only decides how many pods
#      fit on a node.
#      Budget per iGPU: each spritz transcoder asks for 20, and it needs
#      room for a second copy during a rollout, because its long
#      terminationGracePeriodSeconds keeps the old pod holding its share
#      while the new one starts. Two environments rolling at once is
#      therefore 80. A light consumer asks for 1 (atmosphere's gpurenderd,
#      per instance). Keep the light consumers to about 15 shares in total:
#      20 would fill the iGPU exactly at the worst moment, leaving nothing
#      for a pod stuck Terminating or a GPU node being replaced. A
#      transcoder left Pending is a silent outage.
#      A pod may ask for more than 1 share. On a one-iGPU node every share
#      maps to the same card, and kubelet drops the repeated device, mount
#      and CDI entries, so the container sees one card and one render node
#      exactly as with 1. That was checked by a canary pod before the switch.
#      With two GPUs on one node the default allocation policy would spread
#      one request across both cards; revisit it before such a node joins.
#      History: 2 until 2026-10-18 (production joined), then 4, then 100
#      on 2026-11-06 so that light consumers can ask for less than a
#      transcoder.
#      ORDER when changing the count: change it here first, and confirm the
#      node's allocatable gpu.intel.com/i915 shows the new value, BEFORE
#      raising any consumer's request in a later change. Consumer
#      Applications (spritz-staging, spritz-production, ...) auto-sync on
#      their own, so a request landing in the same commit can race ahead
#      of the plugin. Production's transcoder (maxSurge 0) would then stop
#      its old pod and leave the new one Pending.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: intel-gpu-plugin
  namespace: kube-system
  labels:
    app: intel-gpu-plugin
spec:
  selector:
    matchLabels:
      app: intel-gpu-plugin
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: intel-gpu-plugin
    spec:
      automountServiceAccountToken: false
      containers:
      - name: intel-gpu-plugin
        args:
          - -shared-dev-num=100
        env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: HOST_IP
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP
        image: intel/intel-gpu-plugin:0.37.1@sha256:004641b2547d58f1eadce58473fa160ad71377de1eb588cf1f82832387bf3e33
        imagePullPolicy: IfNotPresent
        securityContext:
          seLinuxOptions:
            type: "container_device_plugin_t"
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            memory: "45Mi"
            cpu: 40m
          limits:
            memory: "115Mi"
            cpu: 100m
        volumeMounts:
        - name: devfs
          mountPath: /dev/dri
          readOnly: true
        - name: sysfsdrm
          mountPath: /sys/class/drm
          readOnly: true
        - name: kubeletsockets
          mountPath: /var/lib/kubelet/device-plugins
        - name: cdipath
          mountPath: /var/run/cdi
      volumes:
      - name: devfs
        hostPath:
          path: /dev/dri
      - name: sysfsdrm
        hostPath:
          path: /sys/class/drm
      - name: kubeletsockets
        hostPath:
          path: /var/lib/kubelet/device-plugins
      - name: cdipath
        hostPath:
          path: /var/run/cdi
          type: DirectoryOrCreate
      nodeSelector:
        kubernetes.io/arch: amd64
        spritz.dev/gpu: intel
      tolerations:
      - key: spritz.dev/gpu
        operator: Equal
        value: intel
        effect: NoSchedule
