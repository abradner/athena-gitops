---
# Tunnel credentials, one item per Cloudflare account. A tunnel belongs to an
# account, and the served zones are split across two of them — the same split
# that gives letsencrypt-issuers.yaml its second DNS-01 solver.
#
# Each 1Password item holds two fields, both produced by `cloudflared tunnel
# create` on a workstation logged into that account:
#   credentials-json — the contents of ~/.cloudflared/<uuid>.json
#   tunnel-id        — the tunnel UUID (also the DNS target, <uuid>.cfargotunnel.com)
#
# The UUID lives in the Secret rather than in this repo only so that one place
# describes a tunnel. It is not sensitive: it is the public CNAME target.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-personal
  namespace: cloudflared
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: cloudflared-personal
  data:
    - secretKey: credentials.json
      remoteRef:
        key: "cloudflare-tunnel-personal/credentials-json"
    - secretKey: tunnel-id
      remoteRef:
        key: "cloudflare-tunnel-personal/tunnel-id"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-simplytics
  namespace: cloudflared
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: cloudflared-simplytics
  data:
    - secretKey: credentials.json
      remoteRef:
        key: "cloudflare-tunnel-simplytics/credentials-json"
    - secretKey: tunnel-id
      remoteRef:
        key: "cloudflare-tunnel-simplytics/tunnel-id"
