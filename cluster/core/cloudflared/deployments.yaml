---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudflared-personal
  namespace: cloudflared
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cloudflared
      tunnel: personal
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudflared-simplytics
  namespace: cloudflared
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cloudflared
      tunnel: simplytics
