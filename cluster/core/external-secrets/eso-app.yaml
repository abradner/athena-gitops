apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-operator
  namespace: argocd
spec:
  project: core
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.9.0
    helm:
      # NOTE: spec.source.helm.kubeVersion is deliberately absent.
      #
      # It once caused a permanent sync loop: the field was not in the v2.x
      # Application CRD schema, so the API server silently PRUNED it on write.
      # git carried the field, the live object never could, so every comparison
      # found drift, synced, and found the same drift again. cluster-core sat
      # OutOfSync indefinitely on this one resource while the child app itself
      # reported Synced and Healthy.
      #
      # The pruning half of that is no longer true. The CRDs were briefly
      # rewritten with the v2.12 schema and restored to v3 on 2026-08-25 (see
      # cluster/core/argocd/argocd-app.yaml), and v3 DOES accept kubeVersion —
      # it would now persist rather than vanish.
      #
      # It stays absent anyway, on the original judgement: if a chart here ever
      # genuinely needs a kubeVersion override, it belongs in the chart values,
      # not in the Application spec.
      parameters:
        - name: installCRDs
          value: 'true'
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
