apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp-ui
  namespace: headlamp
spec:
  parentRefs:
  # Detached from the shared gateway 2026-11-14. Internal hosts move to their own
  # internal-only Gateway (athena-internal); until it exists this route is unattached.
  - name: athena-internal
    namespace: default
    # HTTPS only — plaintext hits the catch-all redirect route instead
    sectionName: https-athena
  hostnames:
  - headlamp.athena.asn.casa
  rules:
  - backendRefs:
    - name: headlamp
      port: 80
