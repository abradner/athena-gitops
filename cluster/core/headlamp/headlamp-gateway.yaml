apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp-ui
  namespace: headlamp
spec:
  parentRefs:
  - name: homelab-gateway
    namespace: default
    # HTTPS only — plaintext hits the catch-all redirect route instead
    sectionName: https-athena
  hostnames:
  - headlamp.athena.asn.casa
  rules:
  - backendRefs:
    - name: headlamp
      port: 80
