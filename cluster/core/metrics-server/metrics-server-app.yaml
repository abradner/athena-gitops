apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
spec:
  project: core
  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server/
    chart: metrics-server
    # --kubelet-insecure-tls dropped: kubelets now serve real certs
    # (serverTLSBootstrap in the Talos templates + kubelet-csr-approver).
    # Takes effect on nodes provisioned with the updated machine config.
    targetRevision: 3.14.0
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
