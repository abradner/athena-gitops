---
# Where to send the heartbeat, and the header that proves it is ours. Both
# come from the 1Password item `deimos-power`, written by hand after the
# power stack is deployed (asn-infra: deimos/lambda/README.md). Until that
# item exists this ExternalSecret stays unsynced and the CronJob's pods fail
# to start — visibly, which is the right way for "not configured yet" to look.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: deimos-heartbeat
  namespace: deimos-heartbeat
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: deimos-heartbeat
  data:
    - secretKey: url
      remoteRef:
        key: "deimos-power/heartbeat-url"
    - secretKey: secret
      remoteRef:
        key: "deimos-power/heartbeat-secret"
