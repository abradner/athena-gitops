---
# Node-local persistent storage. Required before anything can keep state —
# the cluster previously had no StorageClass, CSI driver or PVC at all.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-path-storage
  namespace: argocd
  annotations:
    # Wave -1: before the workloads that will claim volumes from it.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: core
  source:
    repoURL: 'https://github.com/abradner/athena-gitops.git'
    targetRevision: main
    path: cluster/core/storage
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: local-path-storage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
