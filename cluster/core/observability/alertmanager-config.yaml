---
# Alertmanager's whole config, rendered by ESO so the Telegram bot token
# never appears in git. The VM operator points VMAlertmanager at this Secret
# via `configSecret` in vm-stack-app.yaml; the key name alertmanager.yaml is
# what the operator expects.
#
# Bot: @asn_web_bot (1P item "Telegram Bot", Tooling - Athena).
#
# TWO CHANNELS, DELIBERATELY SEPARATE — the same bot serves both, but which
# chat each posts to is configured in a different place, so they cannot
# drift into one another:
#
#   ALERTS (this file)      -> the operator's DM with the bot.
#                              chat id: the `chat-id` field on the 1P item.
#                              Infrastructure. Things that should page.
#
#   NOTIFICATIONS (not here) -> the "AsN Web" group.
#                              chat id: per-Property NotificationChannel rows
#                              in crm's own database.
#                              App events, e.g. contact-form submissions.
#
# The split exists so app notifications can be muted without also muting
# "the cluster is down". Do not consolidate them without deciding that
# trade-off deliberately. To move alerts to a dedicated group: create it, add
# the bot, /start@asn_web_bot, then update ONLY the 1P chat-id field — no
# manifest change is needed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vmalertmanager-athena-config
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: vmalertmanager-athena-config
    template:
      data:
        alertmanager.yaml: |
          route:
            receiver: telegram
            group_by: [alertname, namespace]
            group_wait: 30s
            group_interval: 5m
            # Re-notify on still-firing alerts every 12h.
            #
            # Was 4h. Overnight on 2026-08-22 that turned a single unresolved
            # problem — metrics-server's second ReplicaSet — into six messages
            # between 01:34 and 10:29, because it produces two alerts and each
            # was repeated three times. Nothing new was learned after the first
            # pair, and that is exactly how a chat gets muted.
            #
            # Critical keeps its own 1h below: for those, being pestered IS the
            # point. This is the interval for warnings, where the first message
            # has already told you everything.
            repeat_interval: 12h
            routes:
              # Watchdog fires ALWAYS, by design — it proves the pipeline is
              # alive. It must never reach Telegram (permanent noise) but must
              # not be dropped at the source either: the external dead-man's
              # switch on pi400 is what notices when it STOPS firing.
              - receiver: blackhole
                matchers:
                  - alertname = "Watchdog"

              # InfoInhibitor exists to be matched by an inhibit_rule below,
              # never to be read by a human. Its own description says it
              # "should be routed to a null receiver" — it was not, so a
              # paragraph of documentation about alert inhibition was arriving
              # in Telegram as though it were an incident.
              - receiver: blackhole
                matchers:
                  - alertname = "InfoInhibitor"

              # Nothing at info severity is worth a phone buzz. It is still
              # collected, still visible in Alertmanager and Grafana, and
              # still available to the inhibit rules — it just does not
              # interrupt anyone.
              - receiver: blackhole
                matchers:
                  - severity = "info"

              # Criticals repeat sooner. Everything else keeps the 4h default
              # inherited from the root route.
              - receiver: telegram
                matchers:
                  - severity = "critical"
                group_wait: 15s
                repeat_interval: 1h

          # --- inhibition ------------------------------------------------
          #
          # One underlying fault produces many alerts. A control-plane node
          # running out of memory fires KubePodCrashLooping, KubePodNotReady,
          # KubeDeploymentReplicasMismatch, KubeDeploymentRolloutStuck and
          # TargetDown — five names for one problem, each with its own
          # firing and resolved message, from each of three nodes.
          #
          # These rules keep the most specific, most actionable alert and
          # suppress the ones that are merely consequences of it. Suppressed
          # alerts are still recorded; they just do not each get their own
          # notification.
          inhibit_rules:
            # Severity ladder: a critical about a thing suppresses the
            # warning about the same thing, and a warning suppresses the info.
            - source_matchers: [severity = "critical"]
              target_matchers: [severity = "warning"]
              equal: [alertname, namespace]
            - source_matchers: [severity = "warning"]
              target_matchers: [severity = "info"]
              equal: [alertname, namespace]

            # The standard kube-prometheus pattern, which only works if
            # InfoInhibitor is actually wired up: any warning or critical in a
            # namespace suppresses the info-level chatter from that namespace.
            - source_matchers: [alertname = "InfoInhibitor"]
              target_matchers: [severity = "info"]
              equal: [namespace]

            # A node that is gone explains every pod on it. Without this, one
            # node going away pages once per workload it was hosting.
            - source_matchers: [alertname = "KubeNodeNotReady"]
              target_matchers: [alertname =~ "KubePod.*|KubeDeployment.*|KubeStatefulSet.*|TargetDown"]
              equal: [node]

            # A crash-looping pod is by definition also a not-ready pod, and
            # its Deployment is by definition also short of replicas and
            # stuck rolling out. Report the cause, not the three symptoms.
            - source_matchers: [alertname = "KubePodCrashLooping"]
              target_matchers: [alertname =~ "KubePodNotReady|KubeDeploymentReplicasMismatch|KubeDeploymentRolloutStuck|TargetDown"]
              equal: [namespace]

          receivers:
            - name: telegram
              telegram_configs:
                - bot_token: "{{ .token }}"
                  chat_id: {{ .chatid }}
                  api_url: https://api.telegram.org
                  parse_mode: HTML
                  # Subject line prefers deployment/statefulset/daemonset
                  # over pod. Workload alerts carry BOTH: `deployment` is what
                  # the alert is about, while `pod` is whichever kube-state-
                  # metrics pod exported the series. Leading with `pod` sent
                  # KubeDeploymentRolloutStuck out titled
                  # "kube-system/victoria-metrics-stack-kube-state-metrics-..."
                  # for a problem in metrics-server — the wrong place to start
                  # looking at 2am.
                  #
                  # summary is one line; description is often several
                  # paragraphs of upstream prose. Previously both were
                  # concatenated with no separator, which is why alerts
                  # arrived as walls of text. Lead with what and where, then
                  # a clipped description for context.
                  #
                  # reReplaceAll, not truncate: Alertmanager's template engine
                  # exposes only its own small function set, and truncate is
                  # a sprig function that is not in it. (?s) is required or
                  # the match stops at the first newline.
                  message: |
                    {{ "{{" }} range .Alerts {{ "}}" }}<b>{{ "{{" }} .Status | toUpper {{ "}}" }}</b> {{ "{{" }} .Labels.alertname {{ "}}" }}
                    {{ "{{" }} if .Labels.namespace {{ "}}" }}<code>{{ "{{" }} .Labels.namespace {{ "}}" }}{{ "{{" }} if .Labels.deployment {{ "}}" }}/{{ "{{" }} .Labels.deployment {{ "}}" }}{{ "{{" }} else if .Labels.statefulset {{ "}}" }}/{{ "{{" }} .Labels.statefulset {{ "}}" }}{{ "{{" }} else if .Labels.daemonset {{ "}}" }}/{{ "{{" }} .Labels.daemonset {{ "}}" }}{{ "{{" }} else if .Labels.pod {{ "}}" }}/{{ "{{" }} .Labels.pod {{ "}}" }}{{ "{{" }} else if .Labels.node {{ "}}" }} on {{ "{{" }} .Labels.node {{ "}}" }}{{ "{{" }} end {{ "}}" }}</code>
                    {{ "{{" }} end {{ "}}" }}{{ "{{" }} .Annotations.summary {{ "}}" }}
                    {{ "{{" }} if .Annotations.description {{ "}}" }}<i>{{ "{{" }} .Annotations.description | reReplaceAll "(?s)^(.{0,280}).*$" "$1" {{ "}}" }}</i>{{ "{{" }} end {{ "}}" }}
                    {{ "{{" }} end {{ "}}" }}
            - name: blackhole
  data:
    - secretKey: token
      remoteRef:
        key: "Telegram Bot/credential"
    - secretKey: chatid
      remoteRef:
        key: "Telegram Bot/chat-id"
