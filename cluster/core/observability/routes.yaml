---
# Grafana — the single pane. Reachable only from the LAN: the
# *.athena.asn.casa listener is src-gated at HAProxy, which is the only thing
# in front of these UIs (none of them authenticate to the outside world, and
# Grafana's own login is the last line rather than the first).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-ui
  namespace: observability
  annotations:
    # Wave 3, AFTER the victoria Applications (wave 0): a route is only
    # healthy once its backend Service exists, and Argo will not advance
    # past an unhealthy wave. With routes ahead of the Applications the sync
    # deadlocks — routes wait for Services, Services wait for Applications,
    # Applications wait for the routes' wave. Same class of bug as the
    # Gateway/certificates ordering fixed in #11.
    argocd.argoproj.io/sync-wave: "3"
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: default
      sectionName: https-athena
  hostnames:
    - "grafana.athena.asn.casa"
  rules:
    - backendRefs:
        - name: victoria-metrics-stack-grafana
          port: 80
---
# VictoriaLogs' own UI. Grafana can query it as a datasource, but vlogs'
# native UI is faster for open-ended searching, which is what it is for.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: victoria-logs-ui
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: default
      sectionName: https-athena
  hostnames:
    - "logs.athena.asn.casa"
  rules:
    - backendRefs:
        - name: victoria-logs-single-server
          port: 9428
