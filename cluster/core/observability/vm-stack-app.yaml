---
# Metrics, dashboards and alert rules: victoria-metrics-k8s-stack.
#
# This is the VictoriaMetrics equivalent of kube-prometheus-stack — vmsingle
# (storage), vmagent (scraping), vmalert (rules), Alertmanager, Grafana and a
# set of Kubernetes dashboards, from one chart.
#
# Chosen over Prometheus for the hardware: roughly a third of the RAM and
# disk for the same data on Pi 5 workers. It costs nothing in ecosystem —
# VictoriaMetrics speaks PromQL (MetricsQL is a superset) and scrapes
# Prometheus-format targets, so existing exporters and Grafana dashboards
# work unchanged.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-metrics-stack
  namespace: argocd
spec:
  project: core
  source:
    repoURL: 'https://victoriametrics.github.io/helm-charts/'
    chart: victoria-metrics-k8s-stack
    targetRevision: 0.91.2
    helm:
      values: |
        # Short name, and load-bearing: the operator generates resources named
        # vmalertmanager-<release>-<chart>, and with the default
        # victoria-metrics-stack release that is 65 characters — over the
        # Kubernetes 63-char name limit. Alertmanager silently failed to
        # deploy at all (Service rejected, operator retrying forever).
        # Applies only to the VM operator's own resources; the Grafana
        # subchart kept its victoria-metrics-stack-grafana name (its
        # HTTPRoute is gone now — Grafana runs out of cluster).
        fullnameOverride: vmk8s
        # --- storage ---------------------------------------------------
        #
        # vmsingle, vmalert, alertmanager and grafana now run OUTSIDE the
        # cluster, as LXC containers on the hypervisor tier. They are disabled
        # here rather than deleted so the sizing and reasoning stay readable,
        # and so re-enabling is a one-line change if those hosts ever have to
        # be rebuilt.
        #
        # What stays in-cluster is only what must be: vmagent (scrapes and
        # remote-writes out), the exporters it scrapes, and the operator that
        # reconciles the VMAgent CR.
        vmsingle:
          enabled: false
          spec:
            # 30 days is a deliberate ceiling, not a default: this writes to
            # a node-local volume, and the node has finite disk.
            retentionPeriod: "30d"
            storage:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 20Gi
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi

        # --- scraping --------------------------------------------------
        vmagent:
          spec:
            # Every series from this cluster carries cluster=athena. deimos has
            # carried cluster=deimos since it was built, and until this landed
            # the primary's series had NO cluster label at all — so the
            # vendored rules rendered "on cluster " with nothing after it, the
            # reference dashboards' cluster variable was empty for the primary,
            # and Alertmanager could neither group nor inhibit per cluster.
            #
            # One-time cost: every series is relabelled at the moment this
            # syncs, so graphs show a break here and staleness-based alerts
            # may blip once. Checked before landing: every hand-written join
            # in asn-infra's rules uses an explicit on(node), so none of them
            # match on the full label set and none break.
            externalLabels:
              cluster: athena
            # Single write target: the out-of-cluster store on pve
            # (obs-metrics). The dual-write parallel-run phase is
            # over; the in-cluster vmsingle target was removed with the
            # rest of the in-cluster stateful stack below.
            remoteWrite:
              - url: http://obs-metrics.infra.asn.casa:8428/api/v1/write
            # Survive the remote target being briefly away (CT reboot):
            # buffer to disk instead of dropping samples.
            statefulMode: true
            statefulStorage:
              volumeClaimTemplate:
                spec:
                  resources:
                    requests:
                      storage: 2Gi
            resources:
              requests:
                cpu: 50m
                memory: 192Mi
              limits:
                memory: 512Mi

        # --- node-exporter: boot facts for the node health record -----
        #
        # The long-lived node health record (kept outside the cluster, in
        # the private infra repo) keeps, per node: boot time, uptime,
        # readiness and WHY the node last started. Boot time is already here
        # (node_boot_time_seconds). The reset cause mostly is not:
        # node_watchdog_bootstatus is always 0 on iTCO (the driver
        # hard-codes it), and on the Raspberry Pi watchdog it says nothing.
        # The Raspberry Pi firmware's own reset status does: it is how a
        # power loss is told from a reboot on the CM5s (0x1000 = power-on
        # reset, as a CM5 worker showed after a power loss on 2026-10-20).
        # This sidecar reads it from the device tree and hands it to the
        # textfile collector.
        #
        # The sidecar reuses node-exporter's own image (quay.io/prometheus
        # images are busybox-based), so no new image is pulled. It reads
        # /sys read-only and writes only to an in-memory emptyDir. It never
        # exits on error: a crash-looping sidecar would make the whole pod
        # NotReady and drop the node's metrics, so a failed read is reported
        # as athena_bootfacts_ok 0 instead.
        prometheus-node-exporter:
          extraArgs:
            # The first two are the k8s-stack chart's defaults, restated: a
            # list in these values REPLACES the chart's list rather than
            # appending to it (gotcha #1's cousin). Check the rendered
            # DaemonSet after any change here.
            - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
            - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|erofs|sysfs|tracefs)$
            - --collector.textfile.directory=/run/node-health
          # The chart makes this an emptyDir (medium: Memory), read-write in
          # the sidecars and read-only in node-exporter.
          sidecarVolumeMount:
            - name: node-health-textfiles
              mountPath: /run/node-health
              readOnly: false
          sidecars:
            - name: bootfacts
              volumeMounts:
                # The chart's own hostPath /sys volume.
                - name: sys
                  mountPath: /host/sys
                  readOnly: true
              resources:
                requests:
                  cpu: 1m
                  memory: 4Mi
                limits:
                  memory: 16Mi
              command:
                - /bin/sh
                - -c
                - |
                  dt=/host/sys/firmware/devicetree/base/chosen/bootloader
                  out=/run/node-health/bootfacts.prom
                  # A devicetree cell is a big-endian u32; od reads bytes.
                  be32() {
                    set -- $(od -An -tu1 "$1" 2>/dev/null)
                    [ "$#" -eq 4 ] || return 1
                    echo $(( ($1 << 24) | ($2 << 16) | ($3 << 8) | $4 ))
                  }
                  emit() {
                    ok=1
                    if [ -d "$dt" ]; then
                      echo '# HELP athena_bootloader_rsts Raspberry Pi firmware PM_RSTS at boot. 0x1000 = power-on reset (cold start, e.g. after a power loss); 0x20 = watchdog-driven reset (a software reboot, a panic reboot or a watchdog expiry: the SoC does not tell them apart).'
                      echo '# TYPE athena_bootloader_rsts gauge'
                      if v=$(be32 "$dt/rsts"); then echo "athena_bootloader_rsts $v"; else ok=0; fi
                      echo '# HELP athena_bootloader_boot_count Boots the Raspberry Pi firmware counted since its last power-on reset.'
                      echo '# TYPE athena_bootloader_boot_count gauge'
                      if v=$(be32 "$dt/count"); then echo "athena_bootloader_boot_count $v"; else ok=0; fi
                    fi
                    echo '# HELP athena_bootfacts_ok 1 when every boot fact this node has was read; 0 means a read failed.'
                    echo '# TYPE athena_bootfacts_ok gauge'
                    echo "athena_bootfacts_ok $ok"
                  }
                  # Exit at once on TERM, so a pod roll never waits out
                  # the 30 s grace period on the background sleep.
                  trap 'exit 0' TERM INT
                  # The facts are fixed for a boot; re-writing them every
                  # five minutes only covers a lost emptyDir.
                  while :; do
                    emit > "$out.tmp" && mv "$out.tmp" "$out"
                    sleep 300 & wait $!
                  done

        # --- rules + alerting ------------------------------------------
        vmalert:
          # rules are evaluated by the vmalert on obs-metrics, from files
          # in asn-infra/observability/rules. Outside the cluster it can still
          # evaluate absent() rules when the cluster is gone — the whole point.
          enabled: false
          spec:
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 384Mi

        alertmanager:
          # obs-alerts delivers alerts now. It is deliberately placed on a
          # different hypervisor node from obs-metrics, so losing one node
          # cannot take both the detector and the notifier.
          enabled: false
          spec:
            # Full config comes from the ESO-rendered Secret
            # (alertmanager-config.yaml) so the Telegram token stays out of
            # git. The operator expects the key alertmanager.yaml inside it.
            configSecret: vmalertmanager-athena-config
            resources:
              requests:
                cpu: 25m
                memory: 96Mi
              limits:
                memory: 256Mi

        # --- Grafana ---------------------------------------------------
        grafana:
          # obs-grafana serves the UI now, with the same 41 dashboards
          # provisioned from files and the same 1Password admin credential.
          enabled: false
          # Credentials come from 1Password via ESO. The chart's default is a
          # well-known password; leaving that on an admin UI reachable from
          # the LAN would be the weakest link in the whole cluster.
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          persistence:
            enabled: true
            size: 2Gi
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
          # VictoriaLogs is deployed separately (victoria-logs-app.yaml); wire
          # it in here so one Grafana covers both metrics and logs.
          plugins:
            - victoriametrics-logs-datasource
          additionalDataSources:
            - name: VictoriaLogs
              type: victoriametrics-logs-datasource
              url: http://victoria-logs-single-server.observability.svc.cluster.local:9428
              access: proxy

        # --- Talos: these control-plane components are not scrapable -----
        # Talos does not expose kube-controller-manager, kube-scheduler or
        # etcd metrics on the addresses these jobs assume, and it runs no
        # kube-proxy at all (Cilium replaces it). Left enabled they produce
        # permanently-firing "target down" alerts, which trains you to ignore
        # alerts — the opposite of the point.
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false

        # --- rules that cannot be true here ----------------------------
        #
        # Disabling the scrape jobs above was only half the fix. The chart
        # ships the *alerting rules* independently of the jobs, and those
        # rules alert on the target being absent — so turning the job off is
        # precisely what makes them fire. The result was two permanent
        # CRITICALs claiming the scheduler and controller-manager were down
        # while both were demonstrably running and holding their leases.
        #
        # Two false criticals are worse than no alerting at all: they are the
        # loudest thing in the channel and they are always wrong, so the
        # channel gets muted and a real critical goes unread.
        defaultRules:
          groups:
            kubernetes-system-scheduler:
              enabled: false
            kubernetes-system-controller-manager:
              enabled: false
          rules:
            # count:up0 counts targets that are DOWN. With everything healthy
            # it returns no data — which is the desired state, and which this
            # alert reports as a problem. Its canonical trigger is the cluster
            # working correctly.
            RecordingRulesNoData:
              enabled: false
            # Fires when vmagent emits a single log line above info level in
            # five minutes. That is a log line, not an incident; the condition
            # it is meant to hint at is already covered by TooManyScrapeErrors
            # and TargetDown, which say what is actually wrong.
            TooManyLogs:
              enabled: false
            # Kept, but slowed down. The rule reads a histogram
            # (apiserver_client_certificate_expiration_seconds_bucket) that
            # RESETS when kube-apiserver restarts. For the first few minutes
            # afterwards the quantile lands in the lowest bucket, so the rule
            # reports every client certificate as expiring within 24 hours.
            #
            # Observed 2026-08-22: rolling all three apiservers produced an
            # immediate CRITICAL while the actual certificates — kubelet
            # client, apiserver serving, front-proxy and the admin kubeconfig
            # — all expire in mid-2027. It cleared by itself in about twelve
            # minutes.
            #
            # 30m outlasts the histogram refilling while still leaving most of
            # a day to act on a certificate that really is about to expire.
            KubeClientCertificateExpiration:
              spec:
                for: 30m
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        # node-exporter needs host mounts and hostPID, which Talos' Pod
        # Security Admission forbids under baseline/restricted.
        pod-security.kubernetes.io/enforce: privileged
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
