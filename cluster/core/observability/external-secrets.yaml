---
# Grafana's admin login. Generated, never typed — the value exists only in
# 1Password and in the Secret ESO writes from it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: grafana-admin
  data:
    - secretKey: admin-user
      remoteRef:
        key: "grafana-admin/username"
    - secretKey: admin-password
      remoteRef:
        key: "grafana-admin/password"
