---
# Log aggregation and search: VictoriaLogs, with Vector as the node collector.
#
# Chosen over Loki for the query experience. Loki indexes only labels, so
# finding something means already knowing which labels narrow it — fine when
# you know what you are looking for, poor at 2am when you do not. LogsQL is
# much closer to "type the error string you saw".
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-logs
  namespace: argocd
spec:
  project: core
  source:
    repoURL: 'https://victoriametrics.github.io/helm-charts/'
    chart: victoria-logs-single
    targetRevision: 0.13.9
    helm:
      values: |
        server:
          # The log store is obs-logs, out of cluster, now. Vector below stays — it is
          # the collector, and it has to run where the logs are.
          enabled: false
          retentionPeriod: 30d
          persistentVolume:
            enabled: true
            size: 20Gi
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi

        # Vector runs as a DaemonSet, tails container logs on each node and
        # ships them to VictoriaLogs. Shipped with this chart so collector and
        # store stay version-matched.
        vector:
          enabled: true
          # DUAL-SHIP for the observability move: alongside the chart's own
          # in-cluster sink, add a second sink pointing at the out-of-cluster
          # store on pve. Same parser input, same field mapping. Once
          # obs-logs has run clean for a few days the in-cluster store is
          # disabled and this becomes the only sink.
          # With server.enabled=false the chart emits no in-cluster sink, so
          # this is now Vector's only destination.
          customConfig:
            sources:
              # A per-node heartbeat: one event a minute from every Vector pod,
              # shipped through the SAME vlogs sink (same disk buffer, same
              # endpoint, same network path) as the container logs. It exists
              # because "this node shipped no logs" cannot tell a quiet node
              # from a broken pipeline: a freshly joined worker running two
              # pods legitimately writes nothing for an hour, and the alert
              # built on log volume flapped on exactly that (2026-10-19). A
              # heartbeat that stops arriving means the path from this node to
              # the store is broken, whatever the node's workload is doing.
              # The node-level alert that reads it lives with the out-of-cluster
              # rules, not here: it has to fire when this cluster cannot.
              #
              # What it does NOT prove: that the kubernetes_logs source is
              # still reading /var/log/pods. A source that stalls while the
              # sink is healthy keeps the heartbeat green.
              heartbeat:
                type: demo_logs
                format: shuffle
                lines: ["log pipeline heartbeat"]
                interval: 60
            transforms:
              # Rebuild the demo event so it reads like a log line from this
              # node: the node name rides in the same field the container logs
              # carry it in, so the store-side query groups both alike. Its own
              # stream (the sink's VL-Stream-Fields) keeps heartbeats out of
              # every real pod's stream. Timestamped at emission, not delivery:
              # heartbeats held in the disk buffer during an outage land in the
              # past when they drain, so they cannot make a broken window look
              # healthy after the fact.
              heartbeat_tag:
                type: remap
                inputs: [heartbeat]
                source: |
                  . = {
                    "timestamp": now(),
                    "message": "log pipeline heartbeat",
                    "stream": "heartbeat",
                    "heartbeat": "log-pipeline",
                    "kubernetes": {
                      "pod_node_name": get_env_var!("VECTOR_SELF_NODE_NAME"),
                      "pod_name": get_env_var!("VECTOR_SELF_POD_NAME"),
                      "pod_namespace": get_env_var!("VECTOR_SELF_POD_NAMESPACE"),
                      "container_name": "vector-heartbeat"
                    }
                  }
              # Replaces the chart's default parser. Three jobs, in order:
              #
              # 1. Structure what we can. Apps here emit three shapes: JSON
              #    (Rails, Argo's application controller), logfmt (Argo's other
              #    pods), and plain text (nginx, Temporal). The chart default
              #    only tried JSON, so logfmt lines arrived as one opaque blob
              #    with no queryable level.
              #
              # 2. Drop Argo's per-resource sync chatter. At info level with 28
              #    applications, "Adding resource result" alone was ~98% of ALL
              #    log volume in the cluster - 355k lines/hour against ~8k for
              #    everything else combined. It is emitted once per resource per
              #    sync and says nothing anyone acts on; real sync outcomes and
              #    every warning/error still come through. Argo is NOT at debug;
              #    this is simply how loud it is, so turning the level down to
              #    warn would have cost real signal instead.
              #
              # 3. Give HTTP request logs a readable message. The structured
              #    fields are the valuable part and they stay - log.status and
              #    log.dur are what make error-rate and latency queries possible
              #    without the apps exposing /metrics at all. But _msg was
              #    landing as the literal "Request", so every Rails line looked
              #    identical in the UI.
              parser:
                type: remap
                inputs: [k8s]
                source: |
                  parsed, jerr = parse_json(.message)
                  if jerr == null && is_object(parsed) {
                    .log = parsed
                  } else {
                    lf, lerr = parse_logfmt(.message)
                    if lerr == null && is_object(lf) && exists(lf.level) {
                      .log = lf
                    } else {
                      .log = .message
                    }
                  }
                  del(.message)

                  if is_object(.log) {
                    m = to_string(.log.msg) ?? to_string(.log.message) ?? ""
                    ns = to_string(.kubernetes.pod_namespace) ?? ""
                    # Argo's routine per-cycle chatter, from all three of its
                    # noisy pods. Scoped to the argocd namespace so these very
                    # generic strings cannot silently eat an application's logs.
                    #
                    # Measured before/after: the application controller alone
                    # was 227k lines/hour and disappeared from the top talkers
                    # once "Adding resource result" went. The notifications
                    # controller and repo-server then dominated with their own
                    # equivalents, which is why this list is not just one entry.
                    if ns == "argocd" {
                      if starts_with(m, "Adding resource result") { abort }
                      if starts_with(m, "Ignoring change of object") { abort }
                      if m == "Start processing" { abort }
                      if m == "Processing completed" { abort }
                      if starts_with(m, "Processing skipped") { abort }
                      if m == "started call" { abort }
                      if m == "finished call" { abort }
                      if starts_with(m, "manifest cache hit") { abort }
                    }
                  }

                  if is_object(.log) && exists(.log.method) && exists(.log.status) {
                    # VictoriaLogs' VL-Msg-Field priority is: message, msg, _msg,
                    # log.msg, log.message, log. This app's own JSON already sets
                    # "msg":"Request" on every line, and log.msg ranks ahead of
                    # log.message in that list - so synthesizing into
                    # .log.message alone was silently outranked by the field
                    # already there. Overwrite .log.msg directly instead.
                    .log.msg = join!(
                      [
                        to_string(.log.method) ?? "?",
                        to_string(.log.path) ?? "?",
                        "->",
                        to_string(.log.status) ?? "?",
                        (to_string(.log.dur) ?? "?") + "ms"
                      ],
                      " "
                    )

                    # 4. Grade request lines by their status. Thruster and Rails
                    #    log every request at INFO whatever it answered, so a
                    #    413 refusing an upload (spritz, 2026-09-29) sat in
                    #    VictoriaLogs looking exactly like a 200. Only ever
                    #    RAISES an info line - a level the app chose itself
                    #    (warn/error/debug) is left alone. 401 and 404 stay
                    #    info on purpose: expired sessions and scanner probes
                    #    are routine, and grading them would bury the 4xx
                    #    worth reading. Case follows the app's own (Thruster
                    #    says INFO, others say info). A line with no level at
                    #    all counts as info - to_string(null) is "", not an
                    #    error, so the ?? fallback alone would not catch it.
                    raw_level = to_string(.log.level) ?? ""
                    if raw_level == "" || downcase(raw_level) == "info" {
                      status = to_int(.log.status) ?? 0
                      graded = if status >= 500 {
                        "error"
                      } else if status >= 400 && status != 401 && status != 404 {
                        "warn"
                      } else {
                        ""
                      }
                      if graded != "" {
                        .log.level = if raw_level == "INFO" { upcase(graded) } else { graded }
                      }
                    }
                  }

                  # 5. Lift the trace id to a top-level `trace_id`, so a log
                  #    line in VictoriaLogs can link to its trace in
                  #    VictoriaTraces (Grafana derived field) and a trace can
                  #    find its logs. Only ever ADDS a field; nothing above
                  #    changes. Sources, in order:
                  #    - a JSON line's own trace_id field (structured loggers,
                  #      spritz's [error_report] JSON);
                  #    - a `trace=<32 hex>` tag anywhere in the line. Rails
                  #      tagged logging puts it among the bracketed tags, whose
                  #      count and order vary by process, so it is searched
                  #      for, not parsed by position. For a JSON line the
                  #      search runs over the whole re-encoded object, which
                  #      also catches a tags array.
                  #    Exactly 32 lowercase hex and not all zeros (the W3C
                  #    "invalid" id), else no field at all.
                  #
                  #    in : .log = "[3f2a] [Mozilla/5.0] [trace=4bf92f3577b34da6a3ce929d0e0e4736] Started GET \"/portal\""
                  #    out: .trace_id = "4bf92f3577b34da6a3ce929d0e0e4736"
                  #    in : .log = {"msg":"boom","trace_id":"4bf92f3577b34da6a3ce929d0e0e4736"}
                  #    out: .trace_id = "4bf92f3577b34da6a3ce929d0e0e4736"
                  #    in : .log = "[trace=4bf92f3577b34da6a3ce929d0e0e47361] ..." (33 hex), or no tag
                  #    out: no trace_id
                  tid = ""
                  if is_object(.log) {
                    candidate = to_string(.log.trace_id) ?? ""
                    if match(candidate, r'^[0-9a-f]{32}$') { tid = candidate }
                  }
                  if tid == "" {
                    hay = if is_string(.log) { to_string(.log) ?? "" } else { encode_json(.log) }
                    found, ferr = parse_regex(hay, r'trace=(?P<id>[0-9a-f]{32})(?:[^0-9a-f]|$)')
                    if ferr == null { tid = to_string(found.id) }
                  }
                  if tid != "" && tid != "00000000000000000000000000000000" {
                    .trace_id = tid
                  }
            sinks:
              # Ship to the out-of-cluster VictoriaLogs (obs-logs) by
              # completing the CHART'S OWN vlogs sink rather than adding a
              # parallel one. The chart's default values define vlogs as a
              # correct elasticsearch sink (right VL-* headers included) but
              # only inject its endpoints when the in-cluster server is
              # enabled — with server.enabled=false it renders endpoint-less
              # and vector refuses to boot ("Endpoints option must be
              # specified"; took the DaemonSet down cluster-wide after #35).
              # Helm's deep merge cannot DELETE the inherited sink (a null
              # override serializes literally — learned in #61), but it merges
              # ADDED keys cleanly, so supplying endpoints + buffer here yields
              # one complete sink. Verified by rendering the chart locally and
              # inspecting the ConfigMap before merging.
              vlogs:
                # Replaces the chart's inputs list (Helm replaces lists whole):
                # the parsed container logs plus the node heartbeat above.
                inputs: [parser, heartbeat_tag]
                endpoints:
                  # TRAILING DOT — load-bearing. Control-plane VMs put
                  # k8s.asn.casa in the pod search path; with ndots:5 the
                  # resolver tries obs-logs.infra.asn.casa.k8s.asn.casa FIRST,
                  # the *.asn.casa Cloudflare wildcard answers with an edge IP,
                  # and vector hangs on port 9428 forever ("Request timed out",
                  # zero packets toward the CT). Workers lack that search
                  # domain, which is why only control-plane log shipping died.
                  # The absolute name bypasses the search list on every node.
                  - http://obs-logs.infra.asn.casa.:9428/insert/elasticsearch
                # Buffer to disk while the CT is briefly away.
                buffer:
                  type: disk
                  max_size: 268435488
                  when_full: block
          # Vector must run on the control-plane nodes too: without this
          # toleration the DaemonSet covers only the 4 workers, so apiserver,
          # scheduler and controller-manager logs were never collected — the
          # exact logs you want when the control plane is misbehaving.
          # (Dropped by accident in #65's sink rewrite; restored with the
          # resources block that went with it.)
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
            # And on the GPU workers (bootstrap/talos/worker-gpu.patch.yaml),
            # where the spritz transcoder runs: its logs are collected here.
            # Without it a Vector pod scheduled before a new GPU node was
            # tainted fires KubeDaemonSetMisScheduled, and after a restart
            # the node ships no logs at all.
            - key: spritz.dev/gpu
              operator: Exists
              effect: NoSchedule
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        # Vector reads /var/log/pods on the host.
        pod-security.kubernetes.io/enforce: privileged
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
