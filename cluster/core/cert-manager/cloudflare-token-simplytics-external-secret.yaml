---
# Cloudflare API token for the simplytics.ai zone, which lives in a separate
# Cloudflare account from the personal-account zones and therefore cannot
# use the `cloudflare-api-token` secret next to it. Needs Zone:Zone:Read +
# Zone:DNS:Edit on simplytics.ai only — scope it there rather than to all
# zones in that account.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token-simplytics
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token-simplytics
  data:
    - secretKey: api-token
      remoteRef:
        # <item>/<field> in the "Tooling - Athena" vault
        key: cloudflare-dns-simplytics/api-token
