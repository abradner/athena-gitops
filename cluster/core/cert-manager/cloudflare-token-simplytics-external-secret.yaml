---
# Cloudflare API token for the simplytics.ai zone, which lives in a separate
# Cloudflare account from the personal-account zones and therefore cannot
# use the `cloudflare-api-token` secret next to it. spritz.events is in that
# same account and shares this token.
#
# The token behind it ("letsencrypt - athena & haproxy") is account-wide DNS
# Write, IP-locked to 144.6.60.49 — the static ISP address both HAProxy and
# the cluster egress through. certbot on the HAProxy box uses the same token
# from /root/.secrets/certbot/cloudflare-simplytics.ini. Which zones actually
# reach this solver is decided by the dnsZones selector in
# letsencrypt-issuers.yaml, not by the token's scope.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token-simplytics
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token-simplytics
  data:
    - secretKey: api-token
      remoteRef:
        # <item>/<field> in the "Tooling - Athena" vault
        key: cloudflare-dns-simplytics/api-token
