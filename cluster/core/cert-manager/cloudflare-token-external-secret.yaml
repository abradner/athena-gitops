---
# Cloudflare API token for cert-manager's DNS-01 solver. The token needs
# Zone:DNS:Edit on the zones backing *.athena.asn.casa and hello.bradner.net.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
  data:
    - secretKey: api-token
      remoteRef:
        # <item>/<field> in the "Tooling - Athena" vault — align with the
        # actual 1Password item name before first sync.
        key: cloudflare-dns/api-token
