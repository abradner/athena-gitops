---
# Let's Encrypt via Cloudflare DNS-01. Most served zones — asn.casa,
# bradner.net, mcg.rest, rabalex.wedding, counta.click — live in the same
# personal Cloudflare account; TLS is terminated in-cluster at the Gateway,
# HAProxy passes :443 through.
# The Cloudflare API token arrives via ESO (cloudflare-api-token secret in
# the cert-manager namespace, where ClusterIssuers resolve solver secrets).
#
# simplytics.ai (inbox.simplytics.ai, crm) and spritz.events (the marketing
# site) are in a *different* Cloudflare account, so they share a second
# solver, selected by dnsZones, with its own token — cert-manager picks the
# solver by most-specific zone match. Add further zones from that account to
# the same selector; a zone from a third account needs a third solver and
# token.
#
# The token behind cloudflare-api-token-simplytics is account-wide DNS Write
# on that account, so it already covers both zones; adding a zone here needs
# no token change. A token scoped to one zone would instead fail as
# "Found no Zones for domain _acme-challenge.<host>" — which names Zone.read
# rights, not the selector, and sends you looking in the wrong place.
#
# Certificates issued by this solver must sit in a sync wave AFTER this file
# (see the note on inbox-simplytics-ai-tls in ../networking/certificates.yaml).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2"
spec:
  acme:
    email: alex+letsencrypt@asn.casa
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
      # simplytics.ai and spritz.events are in a different Cloudflare account,
      # so they need their own token. cert-manager picks the most specific
      # matching solver: this one claims those two zones (and their
      # subdomains — staging.spritz.events matches the spritz.events entry),
      # the unselected solver above stays the catch-all for the
      # personal-account zones.
      - selector:
          dnsZones:
            - "simplytics.ai"
            - "spritz.events"
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-simplytics
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2"
spec:
  acme:
    email: alex+letsencrypt@asn.casa
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
      # simplytics.ai and spritz.events are in a different Cloudflare account,
      # so they need their own token. cert-manager picks the most specific
      # matching solver: this one claims those two zones (and their
      # subdomains — staging.spritz.events matches the spritz.events entry),
      # the unselected solver above stays the catch-all for the
      # personal-account zones.
      - selector:
          dnsZones:
            - "simplytics.ai"
            - "spritz.events"
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-simplytics
              key: api-token
