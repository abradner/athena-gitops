---
# Let's Encrypt via Cloudflare DNS-01. The two zones live in DIFFERENT
# Cloudflare accounts, so each issuer carries one solver per account and
# cert-manager picks the solver by dnsZones match (most specific wins).
# Tokens arrive via ESO into the cert-manager namespace, where
# ClusterIssuers resolve solver secrets.
# TLS is terminated in-cluster at the Gateway — HAProxy passes :443 through.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  acme:
    email: alex+letsencrypt@asn.casa
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - selector:
          dnsZones:
            - athena.asn.casa
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-asn-casa-token
              key: api-token
      - selector:
          dnsZones:
            - bradner.net
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-bradner-net-token
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  acme:
    email: alex+letsencrypt@asn.casa
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - selector:
          dnsZones:
            - athena.asn.casa
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-asn-casa-token
              key: api-token
      - selector:
          dnsZones:
            - bradner.net
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-bradner-net-token
              key: api-token
