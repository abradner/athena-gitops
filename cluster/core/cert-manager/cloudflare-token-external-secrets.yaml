---
# Cloudflare API tokens for cert-manager's DNS-01 solvers — one per
# Cloudflare account, since the zones are split across two accounts:
#   cloudflare-asn-casa    → account holding the asn.casa zone (athena.*)
#   cloudflare-bradner-net → account holding the bradner.net zone
# Each token needs Zone:Zone:Read + Zone:DNS:Edit on its account's zone.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-asn-casa-token
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: cloudflare-asn-casa-token
  data:
    - secretKey: api-token
      remoteRef:
        # <item>/<field> in the "Tooling - Athena" vault
        key: cloudflare-asn-casa/api-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-bradner-net-token
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: cloudflare-bradner-net-token
  data:
    - secretKey: api-token
      remoteRef:
        key: cloudflare-bradner-net/api-token
