---
# Rancher local-path-provisioner, vendored from upstream v0.0.31:
#   https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.31/deploy/local-path-storage.yaml
#
# Vendored rather than pulled as a chart so the exact bytes are reviewable
# here and no new sourceRepo is needed in the `core` AppProject.
#
# Applied directly by the cluster-core Application, which syncs cluster/core
# recursively — matching how headlamp's gateway and the networking manifests
# are handled. There is deliberately no Application of its own: one pointing
# at this same directory would make cluster-core and it co-own every
# resource here, which Argo reports as a SharedResourceWarning and which
# makes prune behaviour ambiguous.
#
# The cluster had NO storage provisioner at all before this — no
# StorageClass, no CSI driver, no PVC anywhere — so nothing could keep state.
#
# THREE DELIBERATE CHANGES FROM UPSTREAM:
#   1. /opt/local-path-provisioner -> /var/local-path-provisioner.
#      Talos mounts / read-only; /var (the EPHEMERAL partition) is the
#      writable one. Upstream's path silently fails on Talos.
#   2. pod-security.kubernetes.io/enforce: privileged on the namespace.
#      Talos enforces PSA, and the helper pod bind-mounts a host directory.
#   3. Marked the default StorageClass.
#
# WHY NODE-LOCAL AND NOT NFS: volumes here live on whichever node the pod
# lands on, so losing that node loses the data. That is accepted
# deliberately. An NFS-backed class would put the NAS in the runtime path,
# and a hard NFS mount that stops answering blocks I/O indefinitely and can
# wedge kubelet's volume manager — a storage outage would become a cluster
# problem. Durability is handled by snapshotting to the NAS on a schedule
# instead, which keeps it out of the hot path entirely.
apiVersion: v1
kind: Namespace
metadata:
  name: local-path-storage
  labels:
    # Talos enforces Pod Security Admission. The provisioner's helper pod
    # bind-mounts a host directory to create and delete PV folders, which
    # baseline/restricted forbid, so this namespace must opt out.
    pod-security.kubernetes.io/enforce: privileged

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-path-provisioner-service-account
  namespace: local-path-storage

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: local-path-provisioner-role
  namespace: local-path-storage
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: local-path-provisioner-role
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumeclaims", "configmaps", "pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: local-path-provisioner-bind
  namespace: local-path-storage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: local-path-provisioner-role
subjects:
  - kind: ServiceAccount
    name: local-path-provisioner-service-account
    namespace: local-path-storage

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: local-path-provisioner-bind
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: local-path-provisioner-role
subjects:
  - kind: ServiceAccount
    name: local-path-provisioner-service-account
    namespace: local-path-storage

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-path-provisioner
  namespace: local-path-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-path-provisioner
  template:
    metadata:
      labels:
        app: local-path-provisioner
    spec:
      serviceAccountName: local-path-provisioner-service-account
      containers:
        - name: local-path-provisioner
          image: rancher/local-path-provisioner:v0.0.31
          imagePullPolicy: IfNotPresent
          command:
            - local-path-provisioner
            - --debug
            - start
            - --config
            - /etc/config/config.json
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config/
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONFIG_MOUNT_PATH
              value: /etc/config/
      volumes:
        - name: config-volume
          configMap:
            name: local-path-config

---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete

---
kind: ConfigMap
apiVersion: v1
metadata:
  name: local-path-config
  namespace: local-path-storage
data:
  config.json: |-
    {
            "nodePathMap":[
            {
                    "node":"DEFAULT_PATH_FOR_NON_LISTED_NODES",
                    "paths":["/var/local-path-provisioner"]
            }
            ]
    }
  setup: |-
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "$VOL_DIR"
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "$VOL_DIR"
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
      - name: helper-pod
        image: busybox
        imagePullPolicy: IfNotPresent
