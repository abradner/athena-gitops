---
# GitOps-managed copy of the Hubble UI route (also applied once during
# bootstrap; adopted by cluster-core afterwards — edit here, not there).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: kube-system
spec:
  parentRefs:
  # Detached from the shared gateway 2026-11-14. Internal hosts move to their own
  # internal-only Gateway (athena-internal); until it exists this route is unattached.
  - name: athena-internal
    namespace: default
    # HTTPS only — plaintext hits the catch-all redirect route instead
    sectionName: https-athena
  hostnames:
  - hubble.athena.asn.casa
  rules:
  - backendRefs:
    - name: hubble-ui
      port: 80
