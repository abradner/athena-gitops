---
# Catch-all HTTP→HTTPS redirect on the Gateway's http listener. Service
# routes pin themselves to an HTTPS listener via sectionName, so this is
# the only route attached to :80 and every plaintext request gets a 301.
#
# DR note: until cert-manager has issued the Gateway certificates, the
# HTTPS listeners aren't programmed and redirected requests will fail. The
# internal UIs (Argo CD included) are on athena-internal, which has no HTTP
# listener and comes up only with its certificates; during a rebuild, reach
# Argo CD by port-forward (bootstrap/kubernetes/argocd-gateway.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
  namespace: default
spec:
  parentRefs:
  - name: homelab-gateway
    namespace: default
    sectionName: http
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
