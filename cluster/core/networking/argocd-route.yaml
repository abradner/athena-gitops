---
# GitOps-managed copy of the Argo CD UI route. bootstrap/kubernetes applies
# the same object during initial provisioning (the UI is needed before the
# root app exists); once cluster-core syncs, Argo CD adopts it and any later
# edits belong here, not in bootstrap.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-ui
  namespace: argocd
spec:
  parentRefs:
  - name: homelab-gateway
    namespace: default
    # HTTPS only — plaintext hits the catch-all redirect route instead
    sectionName: https-athena
  hostnames:
  - argo.athena.asn.casa
  rules:
  - backendRefs:
    - name: argocd-server
      port: 80
