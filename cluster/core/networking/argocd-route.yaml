---
# GitOps-managed copy of the Argo CD UI route. bootstrap/kubernetes applies
# the same object during initial provisioning (the UI is needed before the
# root app exists); once cluster-core syncs, Argo CD adopts it and any later
# edits belong here, not in bootstrap.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-ui
  namespace: argocd
  annotations:
    # Wave 5: after athena-internal (wave 4). Argo waits for each wave to be
    # healthy, and a route whose Gateway does not exist yet never is, so at
    # the default wave 0 it held back the Gateway it was waiting for.
    argocd.argoproj.io/sync-wave: "5"
spec:
  parentRefs:
  # Internal host: served only by the internal-only Gateway (athena-internal,
  # cluster/core/networking/gateway-internal.yaml). Never add homelab-gateway here.
  - name: athena-internal
    namespace: default
    # HTTPS only: athena-internal has no plaintext listener, and the proxy in
    # front answers :80 for these hosts with a redirect to https.
    sectionName: https-athena
  hostnames:
  - argo.athena.asn.casa
  rules:
  - backendRefs:
    - name: argocd-server
      port: 80
