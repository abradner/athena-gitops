---
# The cluster Gateway, GitOps-managed. bootstrap applies an HTTP-only
# version during provisioning (bootstrap/kubernetes/argocd-gateway.yaml);
# cluster-core adopts it and layers on the HTTPS listeners, which become
# ready once cert-manager has issued the referenced certificates.
# HAProxy should pass :443 through (TCP mode) — TLS terminates here.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab-gateway
  namespace: default
  annotations:
    # Wave 4: LAST. The HTTPS listeners reference certificate Secrets, so
    # this cannot go healthy until cert-manager has issued them. Applying it
    # first (its old wave 0) deadlocked the whole sync: Argo waits for a
    # wave to be healthy before starting the next, so the Gateway blocked
    # forever on certs that a later wave was supposed to create.
    argocd.argoproj.io/sync-wave: "4"
spec:
  gatewayClassName: cilium
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All
  - name: https-athena
    port: 443
    protocol: HTTPS
    hostname: "*.athena.asn.casa"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: athena-wildcard-tls
  - name: https-bradner
    port: 443
    protocol: HTTPS
    hostname: "hello.bradner.net"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: hello-bradner-tls
  - name: https-mcg-rest
    port: 443
    protocol: HTTPS
    hostname: "mcg.rest"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: mcg-rest-tls
  - name: https-kaff
    port: 443
    protocol: HTTPS
    hostname: "kaff.asn.casa"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: kaff-asn-casa-tls
  - name: https-rabalex
    port: 443
    protocol: HTTPS
    hostname: "rabalex.wedding"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: rabalex-wedding-tls
  - name: https-kaff-staging
    port: 443
    protocol: HTTPS
    hostname: "staging.kaff.asn.casa"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: staging-kaff-asn-casa-tls
  - name: https-mcg-rest-staging
    port: 443
    protocol: HTTPS
    hostname: "staging.mcg.rest"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: staging-mcg-rest-tls
  - name: https-rabalex-staging
    port: 443
    protocol: HTTPS
    hostname: "staging.rabalex.wedding"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: staging-rabalex-wedding-tls
  - name: https-counta-click
    port: 443
    protocol: HTTPS
    hostname: "counta.click"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: counta-click-tls
  - name: https-counta-click-staging
    port: 443
    protocol: HTTPS
    hostname: "staging.counta.click"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: staging-counta-click-tls
  # inbox.simplytics.ai — crm, the shared contact-form inbox. Its zone lives
  # in a different Cloudflare account from the others, which matters to
  # cert-manager (see letsencrypt-issuers.yaml) but not to the Gateway.
  - name: https-inbox-simplytics-ai
    port: 443
    protocol: HTTPS
    hostname: "inbox.simplytics.ai"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: inbox-simplytics-ai-tls
  # spritz.events — the marketing site, plus /api/* which routes back to the
  # Rails app in spritz-production (see the HTTPRoute in
  # cluster/apps/spritz-production/marketing). Same-account caveat as
  # inbox.simplytics.ai above: matters to cert-manager, not to the Gateway.
  - name: https-spritz-events
    port: 443
    protocol: HTTPS
    hostname: "spritz.events"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: spritz-events-tls
  - name: https-spritz-events-staging
    port: 443
    protocol: HTTPS
    hostname: "staging.spritz.events"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: staging-spritz-events-tls
  # chuvar.ai — the public site. Simplytics-account zone, same cert-manager
  # caveat as inbox.simplytics.ai above; irrelevant to the Gateway itself.
  - name: https-chuvar-ai
    port: 443
    protocol: HTTPS
    hostname: "chuvar.ai"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: chuvar-ai-tls
