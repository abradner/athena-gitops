---
# The cluster Gateway, GitOps-managed. bootstrap applies an HTTP-only
# version during provisioning (bootstrap/kubernetes/argocd-gateway.yaml);
# cluster-core adopts it and layers on the HTTPS listeners, which become
# ready once cert-manager has issued the referenced certificates.
# HAProxy should pass :443 through (TCP mode) — TLS terminates here.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab-gateway
  namespace: default
  annotations:
    # Wave 4: LAST. The HTTPS listeners reference certificate Secrets, so
    # this cannot go healthy until cert-manager has issued them. Applying it
    # first (its old wave 0) deadlocked the whole sync: Argo waits for a
    # wave to be healthy before starting the next, so the Gateway blocked
    # forever on certs that a later wave was supposed to create.
    argocd.argoproj.io/sync-wave: "4"
spec:
  gatewayClassName: cilium
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All
  - name: https-athena
    port: 443
    protocol: HTTPS
    hostname: "*.athena.asn.casa"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: athena-wildcard-tls
  - name: https-bradner
    port: 443
    protocol: HTTPS
    hostname: "hello.bradner.net"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: hello-bradner-tls
  - name: https-mcg-rest
    port: 443
    protocol: HTTPS
    hostname: "mcg.rest"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: mcg-rest-tls
  - name: https-kaff
    port: 443
    protocol: HTTPS
    hostname: "kaff.asn.casa"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: kaff-asn-casa-tls
  - name: https-rabalex
    port: 443
    protocol: HTTPS
    hostname: "rabalex.wedding"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: rabalex-wedding-tls
  - name: https-kaff-staging
    port: 443
    protocol: HTTPS
    hostname: "staging.kaff.asn.casa"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: staging-kaff-asn-casa-tls
  - name: https-mcg-rest-staging
    port: 443
    protocol: HTTPS
    hostname: "staging.mcg.rest"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: staging-mcg-rest-tls
  - name: https-rabalex-staging
    port: 443
    protocol: HTTPS
    hostname: "staging.rabalex.wedding"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: staging-rabalex-wedding-tls
  - name: https-counta-click
    port: 443
    protocol: HTTPS
    hostname: "counta.click"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: counta-click-tls
  - name: https-counta-click-staging
    port: 443
    protocol: HTTPS
    hostname: "staging.counta.click"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: staging-counta-click-tls
  # inbox.simplytics.ai — crm, the shared contact-form inbox. Its zone lives
  # in a different Cloudflare account from the others, which matters to
  # cert-manager (see letsencrypt-issuers.yaml) but not to the Gateway.
  - name: https-inbox-simplytics-ai
    port: 443
    protocol: HTTPS
    hostname: "inbox.simplytics.ai"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: inbox-simplytics-ai-tls
  # spritz.events — the marketing site, plus /api/* which routes back to the
  # Rails app in spritz-production (see the HTTPRoute in
  # cluster/apps/spritz-production/marketing). Same-account caveat as
  # inbox.simplytics.ai above: matters to cert-manager, not to the Gateway.
  - name: https-spritz-events
    port: 443
    protocol: HTTPS
    hostname: "spritz.events"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: spritz-events-tls
  - name: https-spritz-events-staging
    port: 443
    protocol: HTTPS
    hostname: "staging.spritz.events"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: staging-spritz-events-tls
  # chuvar.ai — the public site. Simplytics-account zone, same cert-manager
  # caveat as inbox.simplytics.ai above; irrelevant to the Gateway itself.
  - name: https-chuvar-ai
    port: 443
    protocol: HTTPS
    hostname: "chuvar.ai"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: chuvar-ai-tls
  # The tunnel entrance. cloudflared hands every hostname it receives to this
  # one listener, which is why it sets no hostname of its own: a listener
  # without a hostname is compatible with any route hostname. That keeps the
  # tunnel's ingress config to a single rule with no hostname list to drift out
  # of step with the listeners above.
  #
  # MEASURED BEHAVIOUR, and not what the Gateway API spec would lead you to
  # expect. Cilium serves EVERY HTTPRoute on this Gateway through this
  # listener, whether or not the route names it in parentRefs.sectionName.
  #
  # Measured 2026-09-04 against Cilium v1.19.4, Kubernetes v1.36.1 and
  # Gateway API v1.2.1. This is implementation behaviour, not a spec
  # guarantee, so it can change under a Cilium or Gateway API upgrade
  # without anything here going red. Re-measure on those upgrades:
  #
  #   GW=$(kubectl get svc cilium-gateway-homelab-gateway -n default \
  #          -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
  #   for HOST in rabalex.wedding argo.athena.asn.casa; do
  #     curl -s -o /dev/null -w "$HOST -> %{http_code}\n" \
  #       --resolve "tunnel.athena.asn.casa:8443:$GW" \
  #       -H "Host: $HOST" https://tunnel.athena.asn.casa:8443/
  #   done
  #
  # Read the pair, never either alone. Public 200 with internal 404 means
  # attachment has become spec-strict and the opt-in parentRefs are now
  # load-bearing — an improvement. Two 404s mean the probe itself is broken
  # (wrong IP, listener gone, cert changed), which looks identical to a
  # tightened boundary if you only ask about the internal hostname.
  #
  # What was seen on the date above:
  #
  #   rabalex.wedding            -> 200   (names https-tunnel)
  #   argo.athena.asn.casa       -> 200   (does NOT name it — served anyway)
  #   kaff.asn.casa              -> 200   (does NOT name it — served anyway)
  #   nosuch.example             -> 404
  #
  # So the second parentRef on the eleven public routes is documentation and
  # future-proofing, NOT a security control: it keeps those routes working if
  # Cilium ever tightens to spec, and it makes route status read Accepted. Do
  # not treat it as a boundary. The only thing keeping internal hostnames off
  # the tunnel is the asn.casa deny rule in cluster/core/cloudflared/config.yaml,
  # which is verified and single — so treat that rule as load-bearing.
  #
  # This port is not reachable from the internet (checked), only from the LAN
  # and the mesh, where those hostnames are already reachable via HAProxy.
  #
  # It has to live on its own port. Two listeners on 443 where one has no
  # hostname would collide on SNI with every named listener there.
  #
  # The certificate is the athena wildcard because cloudflared connects with
  # SNI tunnel.athena.asn.casa (see cluster/core/cloudflared/config.yaml) and
  # verifies what it gets back — the alternative was disabling verification.
  # Nothing outside the cluster is expected to reach 8443; HAProxy forwards 443.
  - name: https-tunnel
    port: 8443
    protocol: HTTPS
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: athena-wildcard-tls
