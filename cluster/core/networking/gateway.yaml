---
# The cluster Gateway, GitOps-managed. bootstrap applies an HTTP-only
# version during provisioning (bootstrap/kubernetes/argocd-gateway.yaml);
# cluster-core adopts it and layers on the HTTPS listeners, which become
# ready once cert-manager has issued the referenced certificates.
# HAProxy should pass :443 through (TCP mode) — TLS terminates here.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab-gateway
  namespace: default
spec:
  gatewayClassName: cilium
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All
  - name: https-athena
    port: 443
    protocol: HTTPS
    hostname: "*.athena.asn.casa"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: athena-wildcard-tls
  - name: https-bradner
    port: 443
    protocol: HTTPS
    hostname: "hello.bradner.net"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: hello-bradner-tls
  - name: https-mcg-rest
    port: 443
    protocol: HTTPS
    hostname: "mcg.rest"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: mcg-rest-tls
  - name: https-kaff
    port: 443
    protocol: HTTPS
    hostname: "kaff.asn.casa"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: kaff-asn-casa-tls
  - name: https-rabalex
    port: 443
    protocol: HTTPS
    hostname: "rabalex.wedding"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: rabalex-wedding-tls
  - name: https-kaff-staging
    port: 443
    protocol: HTTPS
    hostname: "staging.kaff.asn.casa"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: staging-kaff-asn-casa-tls
  - name: https-mcg-rest-staging
    port: 443
    protocol: HTTPS
    hostname: "staging.mcg.rest"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: staging-mcg-rest-tls
  - name: https-rabalex-staging
    port: 443
    protocol: HTTPS
    hostname: "staging.rabalex.wedding"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: staging-rabalex-wedding-tls
  - name: https-counta-click
    port: 443
    protocol: HTTPS
    hostname: "counta.click"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: counta-click-tls
  - name: https-counta-click-staging
    port: 443
    protocol: HTTPS
    hostname: "staging.counta.click"
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
        - name: staging-counta-click-tls
