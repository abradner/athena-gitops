# DERIVED COPY of cluster/core/networking/certificates.yaml: the certificates
# the boreas Gateway (gateway.yaml) references, and no others. Move them
# together with that file. The athena wildcard is here because the tunnel
# connectors verify the https-tunnel listener as tunnel.athena.asn.casa, the
# same as on the primary.
#
# This zone issues its own copies with the same issuer config and DNS-01
# tokens (its own ACME account key); nothing is copied between clusters. Seven
# certificates once, then renewals, is well inside Let's Encrypt's limits.
#
# Waves follow the primary's: 3 for the names in the simplytics Cloudflare
# account (chuvar.ai, inbox.simplytics.ai, spritz.events), which issue off the
# second DNS-01 solver the ClusterIssuers gain in wave 2; that file explains
# the deadlock a wave-1 placement causes.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: athena-wildcard-tls
  namespace: default
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "3"
spec:
  secretName: athena-wildcard-tls
  dnsNames:
    - "*.athena.asn.casa"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
---
