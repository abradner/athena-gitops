---
# External Secrets for this zone: same chart and version as the primary
# (cluster/core/external-secrets/eso-app.yaml; move them together).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boreas-external-secrets
  namespace: argocd
spec:
  project: boreas-core-project
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.9.0
    helm:
      parameters:
        - name: installCRDs
          value: 'true'
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
# The ClusterSecretStore lives in cluster/boreas/secret-store/, under its own
# Application with retries. On the first sync (2026-11-11) it sat here in
# boreas-core: its apply failed because the ESO webhook it validates against
# was not up yet, the sync carried on regardless, and then waited forever on
# certificates whose DNS-01 tokens come through that very store. Its own
# Application fails, retries, and lands once the webhook answers.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boreas-secret-store
  namespace: argocd
spec:
  project: boreas-core-project
  source:
    repoURL: 'https://github.com/abradner/athena-gitops.git'
    targetRevision: main
    path: cluster/boreas/secret-store
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
