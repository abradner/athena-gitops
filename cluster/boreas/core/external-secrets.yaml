---
# External Secrets for this zone: same chart and version as the primary
# (cluster/core/external-secrets/eso-app.yaml; move them together).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boreas-external-secrets
  namespace: argocd
spec:
  project: boreas-core-project
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.15.0
    helm:
      parameters:
        - name: installCRDs
          value: 'true'
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
# The same shared vault as the primary: every zone runs the same applications
# against the same database, so the workload secrets are one copy, not one per
# zone (a per-zone copy would drift on the first rotation and surface during a
# failover). What differs is the token in `op-token`: this zone has its own
# 1Password service account, so it can be revoked without touching the
# primary. That Secret is loaded by hand at bootstrap and never committed
# (cluster/boreas/README.md).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword-backend
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    onepasswordSDK:
      vault: "Tooling - Athena"
      auth:
        serviceAccountSecretRef:
          name: op-token
          key: token
          namespace: external-secrets
