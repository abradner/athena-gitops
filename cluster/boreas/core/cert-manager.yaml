---
# cert-manager: same chart and version as the primary
# (cluster/core/cert-manager/cert-manager-app.yaml; move them together).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boreas-cert-manager
  namespace: argocd
spec:
  project: boreas-core-project
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.1
    helm:
      parameters:
        - name: crds.enabled
          value: 'true'
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
# The ClusterIssuers are read straight from the primary's file: nothing about
# them differs per zone. Their DNS-01 tokens do: the primary's are
# IP-restricted to the primary site, and Cloudflare refuses them from here
# ("10502: Too many authentication failures", first sync 2026-11-11). This
# zone's own tokens come in through core/cloudflare-tokens.yaml under the SAME
# Secret names, so the shared issuers work unchanged.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boreas-cert-manager-issuers
  namespace: argocd
spec:
  project: boreas-core-project
  source:
    repoURL: 'https://github.com/abradner/athena-gitops.git'
    targetRevision: main
    path: cluster/core/cert-manager
    directory:
      include: 'letsencrypt-issuers.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
