---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-apps
  namespace: argocd
spec:
  project: core
  source:
    repoURL: 'https://github.com/abradner/athena-gitops.git'
    targetRevision: main
    path: cluster/apps
    directory:
      recurse: true
      # Each app's raw manifests are owned by their own Application
      # (<name>-app.yaml) so they can be paused or pruned independently —
      # exclude the subtrees here to avoid double-tracking.
      exclude: '{hello-world,temporal,mcg,kaff,spritz}/*'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
