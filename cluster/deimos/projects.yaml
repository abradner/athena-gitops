---
# AppProjects for this cluster. Argo projects are per-cluster, so these mirror
# the primary's rather than being shared with it.
#
# Wave -1: these must exist before any Application referencing them syncs.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: deimos-core-project
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Foundational cluster services for the deimos zone
  sourceRepos:
    - 'https://github.com/abradner/athena-gitops.git'
    - 'https://kubernetes-sigs.github.io/metrics-server/'
    - 'https://charts.external-secrets.io'
    - 'https://charts.jetstack.io'
    - 'https://argoproj.github.io/argo-helm'
    - 'https://victoriametrics.github.io/helm-charts/'
    - 'https://postfinance.github.io/kubelet-csr-approver'
  destinations:
    - server: 'https://kubernetes.default.svc'
      namespace: argocd
    - server: 'https://kubernetes.default.svc'
      namespace: kube-system
    - server: 'https://kubernetes.default.svc'
      namespace: external-secrets
    - server: 'https://kubernetes.default.svc'
      namespace: cert-manager
    - server: 'https://kubernetes.default.svc'
      namespace: default
    - server: 'https://kubernetes.default.svc'
      namespace: cloudflared
    - server: 'https://kubernetes.default.svc'
      namespace: data
    # The per-zone override ConfigMap lands in the workload namespaces, so this
    # project must be allowed to write there. Without it Argo rejects the sync
    # as "one or more synchronization tasks are not valid" — which reads like a
    # broken manifest rather than a project-scope problem. Same trap as
    # local-path-storage on the primary; see AGENTS.md.
    - server: 'https://kubernetes.default.svc'
      namespace: 'spritz-*'
    - server: 'https://kubernetes.default.svc'
      namespace: 'asn-*'
    - server: 'https://kubernetes.default.svc'
      namespace: observability
    # The storage provisioner lands in its own namespace. Omitting it is the
    # same trap as the workload namespaces above: Argo rejects the sync as
    # "one or more synchronization tasks are not valid", which reads like a
    # broken manifest rather than a project-scope problem.
    - server: 'https://kubernetes.default.svc'
      namespace: local-path-storage
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: deimos-workloads
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Application workloads, synced from the same paths as the primary
  sourceRepos:
    - 'https://github.com/abradner/athena-gitops.git'
  destinations:
    - server: 'https://kubernetes.default.svc'
      namespace: 'spritz-*'
    - server: 'https://kubernetes.default.svc'
      namespace: 'asn-*'
  clusterResourceWhitelist:
    - group: '*'
      kind: Namespace
