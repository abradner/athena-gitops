---
# Zone-specific core: the per-zone override ConfigMap, the tunnel connector held
# at zero replicas, and cluster DNS. Everything else in this cluster comes from
# the shared application paths.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: deimos-core
  namespace: argocd
spec:
  project: deimos-core-project
  source:
    repoURL: 'https://github.com/abradner/athena-gitops.git'
    targetRevision: main
    path: cluster/deimos/core
    directory:
      recurse: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  # The failover watchdog owns the connectors' replica count (0 or 1), so Argo
  # must not reconcile it back to the manifest's 0 on every sync — the same
  # Argo-vs-controller fight the primary avoids for spritz-web's HPA. Scoped
  # to the two Deployments and the one field.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: cloudflared-personal
      namespace: cloudflared
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: cloudflared-simplytics
      namespace: cloudflared
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
