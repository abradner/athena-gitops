---
# External Secrets Operator. Required before any workload can start here: every
# application's credentials arrive as ExternalSecrets, and without the CRDs the
# manifests fail to apply at all with "no matches for kind ExternalSecret".
#
# Same chart and version as the primary.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: deimos-external-secrets
  namespace: argocd
spec:
  project: deimos-core-project
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.10.0
    helm:
      parameters:
        - name: installCRDs
          value: 'true'
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
# The 1Password backend, pointed at the SAME vault as the primary.
#
# That sharing is deliberate: application credentials must be identical across
# zones or a failover serves with different secrets than the primary did, and
# the drift would only surface mid-incident. See docs/design-multi-az-boreas.md.
#
# The `op-token` Secret this authenticates with is NOT in git — it is injected
# once by bootstrap/kubernetes/load1p-account-token.sh, using this zone's own
# service-account token so it can be revoked without disturbing the primary.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword-backend
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # Wave 1: the operator (wave 0) must be healthy before this applies.
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    onepasswordSDK:
      vault: "Tooling - Athena"
      auth:
        serviceAccountSecretRef:
          name: op-token
          key: token
          namespace: external-secrets
