---
# Rancher local-path-provisioner, vendored from upstream v0.0.31:
#   https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.31/deploy/local-path-storage.yaml
#
# Byte-identical to the primary's copy in cluster/core/storage/ apart from this
# comment. Duplicated rather than shared because the two clusters are separate
# Argo installations reading the same repository: a single path synced by both
# would be fine today, but pinning the version per zone means an upgrade can be
# rolled out to one zone and observed before the other follows.
#
# Same three deliberate changes from upstream as the primary carries:
#   1. /opt/local-path-provisioner -> /var/local-path-provisioner, because
#      Talos mounts / read-only and /var (EPHEMERAL) is the writable partition.
#   2. pod-security.kubernetes.io/enforce: privileged on the namespace, because
#      the helper pod bind-mounts a host directory.
#   3. Marked the default StorageClass.
#
# WHAT NODE-LOCAL MEANS HERE: this zone is a single node, so "the volume lives
# on whichever node the pod lands on" is not a caveat, it is the only option.
# Losing the node loses the data — which is acceptable precisely because
# nothing in this zone is a source of truth. The standby re-seeds from the
# primary with pg_basebackup, the Solid databases are rebuildable from empty,
# and Garage replicates. See cluster/deimos/core/namespaces.yaml.
#
# STOPPING THE INSTANCE IS NOT LOSING THE NODE. The EBS volume survives a
# stop/start, so parking the zone between the rehearsal and the wedding keeps
# these volumes intact and the standby only has to catch up on WAL — provided
# it catches up before the replication slot's retained WAL outgrows the
# primary's disk. See docs/runbook-deimos-data-tier.md.
apiVersion: v1
kind: Namespace
metadata:
  name: local-path-storage
  labels:
    # Talos enforces Pod Security Admission. The provisioner's helper pod
    # bind-mounts a host directory to create and delete PV folders, which
    # baseline/restricted forbid, so this namespace must opt out.
    pod-security.kubernetes.io/enforce: privileged

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-path-provisioner-service-account
  namespace: local-path-storage

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: local-path-provisioner-role
  namespace: local-path-storage
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: local-path-provisioner-role
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumeclaims", "configmaps", "pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: local-path-provisioner-bind
  namespace: local-path-storage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: local-path-provisioner-role
subjects:
  - kind: ServiceAccount
    name: local-path-provisioner-service-account
    namespace: local-path-storage

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: local-path-provisioner-bind
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: local-path-provisioner-role
subjects:
  - kind: ServiceAccount
    name: local-path-provisioner-service-account
    namespace: local-path-storage

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-path-provisioner
  namespace: local-path-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-path-provisioner
  template:
    metadata:
      labels:
        app: local-path-provisioner
    spec:
      serviceAccountName: local-path-provisioner-service-account
      containers:
        - name: local-path-provisioner
          image: rancher/local-path-provisioner:v0.0.31
          imagePullPolicy: IfNotPresent
          command:
            - local-path-provisioner
            - --debug
            - start
            - --config
            - /etc/config/config.json
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config/
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONFIG_MOUNT_PATH
              value: /etc/config/
      volumes:
        - name: config-volume
          configMap:
            name: local-path-config

---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete

---
kind: ConfigMap
apiVersion: v1
metadata:
  name: local-path-config
  namespace: local-path-storage
data:
  config.json: |-
    {
            "nodePathMap":[
            {
                    "node":"DEFAULT_PATH_FOR_NON_LISTED_NODES",
                    "paths":["/var/local-path-provisioner"]
            }
            ]
    }
  setup: |-
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "$VOL_DIR"
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "$VOL_DIR"
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
      - name: helper-pod
        image: busybox
        imagePullPolicy: IfNotPresent
