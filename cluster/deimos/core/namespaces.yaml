---
# Data tier namespace. The workloads in it — a read-only standby of the
# primary's database, a small read-write instance for the Solid cache/queue/cable
# databases, and a Garage node — are added in a later change.
#
# This bends the primary's placement doctrine (state lives outside Kubernetes)
# deliberately and narrowly: everything here is a replica or a rebuildable
# cache, re-seedable from the primary in minutes. Nothing in this namespace is
# a source of truth, so the property that doctrine protects does not apply.
apiVersion: v1
kind: Namespace
metadata:
  name: data
---
# Declared explicitly rather than left to Argo's CreateNamespace, which creates
# the namespace but sets no labels — so it lands on the default `baseline`
# Pod Security policy and the node exporter is refused outright:
#   violates PodSecurity "baseline:latest": host namespaces (hostNetwork=true,
#   hostPID=true), hostPath volumes, hostPort
#
# A node exporter needs all of those by definition. The primary's namespace
# carries the same label; it just predates this tree.
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    pod-security.kubernetes.io/enforce: privileged
