# spritz arm64 image builds (`runs-on: zagreus-docker-arm64`): docker-ci.yml's
# PR build checks and the arm64 leg of docker.yml's release builds. Runs on
# always-on CM5 builder nodes (USB SSD), so arm64 builds stop depending on a Mac
# being awake. Workflows select it through RUNNER_DOCKER_ARM64 (the bare
# string "zagreus-docker-arm64"), switched over only after this set has run a
# real build.
#
# No `containerMode: dind`: the chart's generated dind assumes the runner lives
# in /home/runner and cannot be customised. This one lives in
# /opt/actions-runner, and its dockerd needs a host-path data root (the layer
# cache, kept across jobs) and a config file, so the sidecar is written out in
# full. Points that are easy to break:
#   - The socket lives in /var/run/dind, not /var/run: an emptyDir over
#     /var/run would hide /run/postgresql (Debian's /var/run is a symlink to
#     /run) and the runner image's Postgres could not start.
#   - dockerd gives the socket to group 1000, the runner user's own group;
#     the entrypoint drops to that user with gosu, which resets supplementary
#     groups, so a pod-level supplementalGroups would not survive.
#   - The build runs inside dind's cgroup, so the requests sit on dind.
#   - One dockerd per data root: maxRunners 1, so at most one dind pod uses
#     the data root at a time, and the controller leaves finished pods their
#     termination grace period (arc-controller.yaml) so dockerd stops cleanly
#     before the next starts.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zagreus-spritz-docker-arm64
  namespace: argocd
spec:
  project: zagreus-core-project
  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set
    targetRevision: 0.15.0
    helm:
      releaseName: spritz-docker-arm64
      valuesObject:
        runnerScaleSetName: zagreus-docker-arm64
        # No class labels, deliberately: this set is reached by name only.
        # Bot-authored dependency PRs build here by name (spritz#1231), while
        # the arm64 release legs reach the classic Mac builders by the
        # docker-arm64 label. A docker-arm64 label here would let release legs
        # (which hold a GHCR write token) build on the same dind data root,
        # buildkit cache included, as those third-party builds. Add one only
        # once the two no longer share a data root (README, "Runners").
        githubConfigUrl: https://github.com/abradner/spritz
        githubConfigSecret: arc-github-app
        controllerServiceAccount:
          namespace: arc-systems
          name: arc-gha-rs-controller
        minRunners: 0
        maxRunners: 1
        listenerTemplate:
          spec:
            nodeSelector:
              node-role.kubernetes.io/control-plane: ""
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
            containers:
              - name: listener
                resources:
                  requests: {cpu: 20m, memory: 64Mi}
        template:
          spec:
            automountServiceAccountToken: false
            terminationGracePeriodSeconds: 120
            nodeSelector:
              zagreus.asn.casa/role: arm-builder
            tolerations:
              - key: zagreus.asn.casa/role
                operator: Equal
                value: arm-builder
                effect: NoSchedule
            initContainers:
              - name: init-dind-externals
                # Same pin as the runner container; see ci.yaml.
                image: ghcr.io/abradner/spritz-ci-runner:sha-b1a67c5ba30b@sha256:1d31d1b554ef0cb8ee9ac102b509afcc6f4c44603f3113bf3362844bf6ef568b
                command: ["cp", "-r", "/opt/actions-runner/externals/.", "/tmpDir/"]
                volumeMounts:
                  - {name: dind-externals, mountPath: /tmpDir}
              - name: dind
                image: docker:28-dind@sha256:2a232a42256f70d78e3cc5d2b5d6b3276710a0de0596c145f627ecfae90282ac
                restartPolicy: Always # native sidecar
                args: ["dockerd", "--host=unix:///var/run/dind/docker.sock", "--group=$(DOCKER_GROUP_GID)", "--config-file=/etc/docker/daemon.json"]
                env:
                  - {name: DOCKER_GROUP_GID, value: "1000"}
                securityContext:
                  privileged: true
                startupProbe:
                  exec: {command: ["docker", "-H", "unix:///var/run/dind/docker.sock", "info"]}
                  periodSeconds: 5
                  failureThreshold: 24
                resources:
                  requests: {cpu: "1", memory: 3Gi}
                  limits: {memory: 6Gi}
                volumeMounts:
                  - {name: work, mountPath: /opt/actions-runner/_work}
                  - {name: dind-sock, mountPath: /var/run/dind}
                  - {name: dind-externals, mountPath: /opt/actions-runner/externals}
                  - {name: docker-data, mountPath: /var/lib/docker}
                  - {name: daemon-json, mountPath: /etc/docker/daemon.json, subPath: daemon.json}
            containers:
              - name: runner
                image: ghcr.io/abradner/spritz-ci-runner:sha-b1a67c5ba30b@sha256:1d31d1b554ef0cb8ee9ac102b509afcc6f4c44603f3113bf3362844bf6ef568b
                imagePullPolicy: IfNotPresent
                command: ["/usr/bin/tini", "--", "/usr/local/bin/entrypoint.sh"]
                env:
                  - {name: DOCKER_HOST, value: unix:///var/run/dind/docker.sock}
                resources:
                  requests: {cpu: 250m, memory: 768Mi}
                  limits: {memory: 2Gi}
                volumeMounts:
                  - {name: work, mountPath: /opt/actions-runner/_work}
                  - {name: dind-sock, mountPath: /var/run/dind}
                  - {name: pg, mountPath: /var/lib/postgresql}
            volumes:
              - {name: work, emptyDir: {}}
              - {name: dind-sock, emptyDir: {}}
              - {name: dind-externals, emptyDir: {}}
              - {name: pg, emptyDir: {}}
              - {name: docker-data, hostPath: {path: /var/lib/arc-docker, type: DirectoryOrCreate}}
              - {name: daemon-json, configMap: {name: arc-dind-daemon}}
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-builders
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    # The first syncs race zagreus-core (CRDs, namespaces, the repo secret):
    # automated sync does not retry a failed revision on its own.
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
