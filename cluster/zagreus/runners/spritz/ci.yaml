# spritz's heavy runner class on the amd64 nodes (../CLASSES.md): every job
# that asks for `heavy` (rspec, vitest, lint, the browser matrix shards, and
# the e2e jobs, which add `X64`), and every heavy job of a bot's run, which
# names this set. amd64 nodes only. The x64-only set (ci-x64.yaml) was folded
# in here on 13 Nov 2026.
#
# Sizing from measured peaks (2026-10-19): e2e 5.5 GiB / 3.6 CPU (Rails,
# Postgres and Chromium in one container), a full-matrix shard 5.1 GiB, rspec
# up to 4.4 GiB, vitest 4.1 GiB PSS with VITEST_MAX_WORKERS=4 (spritz#1163;
# the earlier ~7.3 GB OOM kills were a test allocating real 2 GB buffers,
# fixed in #1102). Request covers e2e; the limit leaves headroom above it, and
# an over-request pod is the kubelet's first eviction.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zagreus-spritz-ci
  namespace: argocd
spec:
  project: zagreus-core-project
  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set
    targetRevision: 0.15.0
    helm:
      releaseName: spritz-ci
      valuesObject:
        runnerScaleSetName: zagreus-ci
        # ARC writes labels only when it CREATES the scale set: after a change
        # here, delete the AutoscalingRunnerSet and let Argo recreate it, or
        # GitHub keeps the old labels. Amd64 nodes only, below: the e2e jobs
        # capture the Chromatic archives and must never rasterise on arm64.
        # Runner classes (../CLASSES.md): `heavy`, and `X64` because every
        # node this set runs on is amd64, so it takes the jobs that capture
        # Chromatic archives (they ask for heavy + X64) as well as the
        # any-architecture heavy jobs. The classic labels (spritz-ci,
        # playwright-full) went in step 3, 13 Nov 2026: spritz no longer asks
        # for them, and they let this set claim jobs meant for other pools.
        scaleSetLabels: [self-hosted, linux, X64, heavy]
        githubConfigUrl: https://github.com/abradner/spritz
        githubConfigSecret: arc-github-app
        controllerServiceAccount:
          namespace: arc-systems
          name: arc-gha-rs-controller
        minRunners: 0
        # Never more runners than the nodes can schedule. A job this set claims
        # is bound to it: a claim beyond capacity sits in a Pending pod while a
        # classic runner with the same labels could have taken it. The three
        # amd64 nodes have 30.3, 30.2 and 14.4 GiB and 7.95, 7.95 and 3.95 CPU
        # allocatable (1 Nov 2026). A heavy pod requests 6 GiB and 1.5 CPU;
        # the amd64 builder (docker-amd64.yaml) 3.75 GiB and 1.25 CPU with its
        # dind sidecar; up to two light pods (ci-light.yaml), the bundle
        # filler, coredns and the DaemonSets about 2.28 GiB and 0.77 CPU more.
        # CPU binds on the two i7s: zag-amd64-01 fits the builder and three
        # heavy pods (6.52 of 7.95 CPU; a fourth makes 8.02), zag-amd64-02
        # fits four (6.77; a fifth makes 8.27). Memory binds on the i5:
        # zag-amd64-03 fits two (14.28 of 14.4 GiB). Each always-on VM
        # (zag-amd64vm-01, and zag-amd64vm-02 since 14 Nov 2026;
        # 4 vCPU, 8 GiB, 6.97 GiB allocatable) fits one. Eleven heavy pods in
        # all: three on 01, four on 02, two on 03, one on each VM (the old x64
        # set's slots on 01 and 02 folded in here, 13 Nov 2026).
        # Re-check whenever a request, a DaemonSet
        # or a node changes. The node waker drives the live value from the
        # awake nodes, and this is its ceiling (README, "Runners";
        # ../../waker/waker.conf holds the per-node slots that sum to it, and
        # its test_configured_slots_fit_the_nodes checks the sums).
        maxRunners: 11
        listenerTemplate:
          spec:
            nodeSelector:
              node-role.kubernetes.io/control-plane: ""
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
            containers:
              - name: listener
                resources:
                  requests: {cpu: 20m, memory: 64Mi}
        template:
          spec:
            automountServiceAccountToken: false
            terminationGracePeriodSeconds: 60
            # The always-on VM (waker README, "Always-on node") carries this
            # taint so only runner pods land there. Its slot is offered to
            # every set drawing on the zagreus-ci pool, so each must tolerate it.
            tolerations:
              - key: zagreus.asn.casa/always-on
                operator: Exists
                effect: NoSchedule
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: zagreus.asn.casa/role
                          operator: In
                          values: [amd64-runner]
                preferredDuringSchedulingIgnoredDuringExecution:
                  # Heavy jobs scale with cores (Vitest workers, parallel
                  # rspec): prefer the two 8-thread i7s over the 4-thread
                  # i5 (zag-amd64-03), which still takes jobs once they are
                  # full. A preference only: the waker's slots decide what
                  # is offered, this only decides where it lands.
                  - weight: 50
                    preference:
                      matchExpressions:
                        - key: kubernetes.io/hostname
                          operator: In
                          values: [zag-amd64-01, zag-amd64-02]
            initContainers:
              # Copies this node's pre-installed gem tree (bundle-cache.yaml)
              # into the pod's own BUNDLE_PATH. The trees are mounted
              # read-only, and the job installs anything missing into its own
              # copy. No tree yet (a fresh node, an arm64 node, a runner image
              # the fill has not built for) or a failed copy: an empty
              # BUNDLE_PATH, and the job installs everything, as before.
              - name: bundle-seed
                # The runner's own image (aliased below), so the seed keys
                # trees by the libraries the job will load them with.
                image: &runner-image ghcr.io/abradner/spritz-ci-runner:sha-b1a67c5ba30b@sha256:1d31d1b554ef0cb8ee9ac102b509afcc6f4c44603f3113bf3362844bf6ef568b
                imagePullPolicy: IfNotPresent
                securityContext: {runAsUser: 1000, runAsGroup: 1000}
                command:
                  - /bin/bash
                  - -c
                  - |
                    . /etc/os-release
                    shopt -s dotglob nullglob
                    # The fill's key for this image: OS release, architecture
                    # and installed packages (bundle-cache.yaml, fill.sh).
                    src=/cache/$ID-$VERSION_ID-$(uname -m)-$(sha256sum /var/lib/dpkg/status | cut -c1-12)/current
                    dst=/home/runner/.bundle-local
                    # The tree's entries, not "$t/.": the emptyDir itself is
                    # root's, and cp -a cannot set its times.
                    entries=()
                    if t=$(readlink -e "$src") && [ -d "$t" ]; then entries=("$t"/*); fi
                    if [ ${#entries[@]} -eq 0 ]; then
                      echo "no gem tree at $src"
                    elif start=$EPOCHREALTIME && cp -a --reflink=auto -- "${entries[@]}" "$dst/"; then
                      echo "seeded $dst from ${t##*/} in $(awk -v s="$start" -v e="$EPOCHREALTIME" 'BEGIN { printf "%.1f", e - s }') s"
                    else
                      echo "seed from ${t##*/} failed; starting empty"
                      chmod -R u+w -- "$dst" 2>/dev/null; rm -rf -- "${dst:?}"/* || true
                    fi
                    # Never fail the pod: an empty BUNDLE_PATH is today's behaviour.
                    exit 0
                resources:
                  requests: {cpu: 100m, memory: 64Mi}
                volumeMounts:
                  - {name: bundle-trees, mountPath: /cache, readOnly: true}
                  - {name: bundle, mountPath: /home/runner/.bundle-local}
            containers:
              - name: runner
                # The first image with the ARC-mode entrypoint (spritz#1165).
                # Pinned by digest: ARC disables runner self-update, so move
                # this deliberately whenever actions/runner releases (GitHub
                # stops queueing jobs for a runner 30 days behind). The pin
                # sits on bundle-seed above (&runner-image), which must run
                # the same image; keep spritz-bundle-fill (bundle-cache.yaml)
                # on it too, or the pods find no gem tree.
                image: *runner-image
                imagePullPolicy: IfNotPresent
                command: ["/usr/bin/tini", "--", "/usr/local/bin/entrypoint.sh"]
                env:
                  - name: RUNNER_CACHE_DIRS
                    value: /home/runner/.local/share/mise:/home/runner/.cache/ms-playwright:/home/runner/.bun/install/cache
                  # Gems: each pod installs into its own path, an emptyDir the
                  # bundle-seed init container fills from the node's read-only
                  # gem tree. A shared, writable per-node download cache
                  # (BUNDLE_GLOBAL_GEM_CACHE) raced: jobs starting together on
                  # one node fetched the same .gem into it at once and Bundler
                  # aborted with ENOENT on a half-written file (spritz run
                  # 39776737369). See bundle-cache.yaml.
                  - name: BUNDLE_PATH
                    value: /home/runner/.bundle-local
                  # Playwright's install removes every browser its own version
                  # does not list. Every pod here shares one cache and one
                  # checkout path, so a Playwright-bump PR would delete the
                  # browsers a concurrent main job is using. Old revisions
                  # are pruned on the node instead, by ci-cache-prune
                  # (../ci-cache-prune.yaml) once /var passes 70%.
                  - name: PLAYWRIGHT_SKIP_BROWSER_GC
                    value: "1"
                  # mise records an unfinished install in its cache dir. Keep
                  # that marker with the shared data, or a pod evicted mid
                  # Ruby compile leaves a half-built Ruby that later pods
                  # take for installed.
                  - name: MISE_CACHE_DIR
                    value: /home/runner/.local/share/mise/.cache
                  # With no CPU limit this is the node's allocatable cores
                  # (8 on the i7s, 4 on the i5). Nothing in spritz reads it
                  # today; Vitest takes VITEST_MAX_WORKERS from ci.yml.
                  - name: CI_CPUS
                    valueFrom:
                      resourceFieldRef:
                        containerName: runner
                        resource: limits.cpu
                # No CPU limit (2 Nov 2026). A limit of 4 had CFS throttle the
                # Vitest step even on an idle node: 300-550 s here against
                # 100-200 s on the Mac runners. The request (1.5) is unchanged:
                # it is what the scheduler and the waker's slot sums use, and
                # under contention it sets each pod's share of the node. Memory
                # keeps its limit: running out of memory kills, running out of
                # CPU only slows.
                resources:
                  requests: {cpu: 1500m, memory: 6Gi, ephemeral-storage: 10Gi}
                  limits: {memory: 8Gi, ephemeral-storage: 40Gi}
                volumeMounts:
                  - {name: mise, mountPath: /home/runner/.local/share/mise}
                  - {name: playwright, mountPath: /home/runner/.cache/ms-playwright}
                  - {name: bun, mountPath: /home/runner/.bun/install/cache}
                  - {name: bundle, mountPath: /home/runner/.bundle-local}
                  - {name: pg, mountPath: /var/lib/postgresql}
                  - {name: shm, mountPath: /dev/shm}
            volumes:
              # Per-node caches on the node's EPHEMERAL disk. They outlive the
              # pod and a power-off, which is what makes an ephemeral runner
              # on a freshly woken node start warm.
              - {name: mise, hostPath: {path: /var/lib/ci-cache/mise, type: DirectoryOrCreate}}
              - {name: playwright, hostPath: {path: /var/lib/ci-cache/ms-playwright, type: DirectoryOrCreate}}
              - {name: bun, hostPath: {path: /var/lib/ci-cache/bun, type: DirectoryOrCreate}}
              # Written only by spritz-bundle-fill; read-only here.
              - {name: bundle-trees, hostPath: {path: /var/lib/ci-cache/bundle-trees, type: DirectoryOrCreate}}
              - {name: bundle, emptyDir: {}}
              - {name: pg, emptyDir: {}}
              - {name: shm, emptyDir: {medium: Memory, sizeLimit: 1Gi}}
  # The node waker (../../waker/README.md) owns the live maxRunners: 0 while
  # the amd64 nodes sleep, their slots once awake. The value above is its
  # ceiling. RespectIgnoreDifferences keeps a sync from writing the ceiling
  # back over the waker's value; only a set Argo creates afresh starts at it
  # (README, "Runners": recreate a set only while its nodes are awake).
  ignoreDifferences:
    - group: actions.github.com
      kind: AutoscalingRunnerSet
      jsonPointers: [/spec/maxRunners]
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
    # The first syncs race zagreus-core (CRDs, namespaces, the repo secret):
    # automated sync does not retry a failed revision on its own.
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
