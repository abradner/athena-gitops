# zagreus namespaces and their Pod Security levels.
#
# The cluster default is enforce=baseline (bootstrap/zagreus/talos/controlplane.template.yaml).
# Four namespaces opt into privileged, deliberately:
#   - arc-runners: runner pods mount per-node cache directories by hostPath,
#     which baseline forbids. The caches are what let an ephemeral runner on a
#     freshly woken node start warm.
#   - arc-builders: dind sidecars must run privileged.
#   - log-heartbeat: one pod per node writes a heartbeat into the host's
#     kernel log, which needs /dev/kmsg, which needs privileged
#     (kmsg-heartbeat.yaml has the failed unprivileged attempt).
#   - node-power: one node_exporter per node, which reads the host's /proc and
#     /sys by hostPath and serves on the node's address (hostNetwork); baseline
#     forbids both. The pod itself is NOT privileged: it runs as root with every
#     capability dropped (node-power-exporter.yaml says why that is enough).
# What makes that acceptable here and not on athena: this cluster runs only CI,
# on its own VLAN with internet egress only, and the control-plane nodes (which
# hold the GitHub App key and etcd) never schedule a runner pod.
#
# arc-systems holds the controller and the listeners, which carry the GitHub
# App credential. It stays at the baseline default.
#
# zagreus-waker holds the node waker (../waker/), which carries the AMT and
# Talos credentials and needs no privilege at all: restricted.
apiVersion: v1
kind: Namespace
metadata:
  name: arc-systems
---
apiVersion: v1
kind: Namespace
metadata:
  name: arc-runners
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: arc-builders
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: log-heartbeat
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: zagreus-waker
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: node-power
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
