# The GitHub App credential ARC registers runners with, synced from the
# CI-only 1Password vault into each namespace that holds scale sets (the
# chart requires the secret in the scale set's own namespace). Runner pods
# never mount it: only the controller and the listeners (control plane) read
# it, and a worker's kubelet can read only the secrets of pods scheduled on
# that worker.
#
# App permissions for repository-scope runners: Repository → Administration:
# read and write, Metadata: read. Installed on the selected private
# repositories only. Public repositories stay on GitHub-hosted runners.
#
# The 1Password item (any category; the onepasswordSDK provider resolves
# fields by reference and never looks at it) holds github_app_id and
# github_app_installation_id as fields, and the private key as the App's
# downloaded .pem ATTACHED as a file. Not a field: a 1Password password field
# drops the PEM's newlines, which leaves an invalid key. How the key is read,
# per ESO v2.9.0 (chart 2.9.0):
#   - The .pem is read by secret reference (`<item>/<file name>`), which the
#     provider hands to the SDK's Secrets().Resolve; that resolves an
#     attachment by its name. So the remoteRef below names the file: when the
#     key is rotated, update it to the new file's name in the same change.
#     Not dataFrom.extract with `property: file/`: in ESO v2.9.0 (and still in
#     v2.13.0) fetchFile passes the file's field ID where the SDK's
#     Files().Read expects the item ID (client.go, fetchFile), so every file
#     read fails with "item couldn't be found".
#   - The template is the whole Secret: with template.data and the default
#     mergePolicy Replace, no other key from data or dataFrom is written
#     (pkg/controllers/externalsecret/externalsecret_controller_template.go,
#     ApplyTemplate).
#   - filterPEM re-encodes the RSA key (GitHub issues PKCS#1, "RSA PRIVATE
#     KEY") and errors on text that is not PEM, such as a key whose newlines
#     were stripped. It returns an empty string for a PEM of another type
#     (PKCS#8 "PRIVATE KEY", a certificate), hence the explicit fail. With
#     missingkey=error and the provider erroring on an unknown name, a missing
#     attachment fails too. Any of these stops the sync instead of handing
#     ARC a bad credential.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-app
  namespace: arc-runners
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 24h # 1Password rate limits (AGENTS.md, Snapshot Learnings 1)
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-ci
  target:
    name: arc-github-app
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        github_app_id: '{{ .github_app_id }}'
        github_app_installation_id: '{{ .github_app_installation_id }}'
        github_app_private_key: '{{ $k := .github_app_private_key_pem | filterPEM "RSA PRIVATE KEY" }}{{ if not $k }}{{ fail "the .pem attached to zagreus-arc-github-app holds no RSA PRIVATE KEY block" }}{{ end }}{{ $k }}'
  data:
    - secretKey: github_app_id
      remoteRef: {key: zagreus-arc-github-app/github_app_id}
    - secretKey: github_app_installation_id
      remoteRef: {key: zagreus-arc-github-app/github_app_installation_id}
    - secretKey: github_app_private_key_pem
      remoteRef: {key: zagreus-arc-github-app/zagreus-arc.2026-10-19.private-key.pem}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-app
  namespace: arc-builders
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-ci
  target:
    name: arc-github-app
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        github_app_id: '{{ .github_app_id }}'
        github_app_installation_id: '{{ .github_app_installation_id }}'
        github_app_private_key: '{{ $k := .github_app_private_key_pem | filterPEM "RSA PRIVATE KEY" }}{{ if not $k }}{{ fail "the .pem attached to zagreus-arc-github-app holds no RSA PRIVATE KEY block" }}{{ end }}{{ $k }}'
  data:
    - secretKey: github_app_id
      remoteRef: {key: zagreus-arc-github-app/github_app_id}
    - secretKey: github_app_installation_id
      remoteRef: {key: zagreus-arc-github-app/github_app_installation_id}
    - secretKey: github_app_private_key_pem
      remoteRef: {key: zagreus-arc-github-app/zagreus-arc.2026-10-19.private-key.pem}
