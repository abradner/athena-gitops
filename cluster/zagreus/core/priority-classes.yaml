# Priority inside zagreus. Everything here is CI, so these order CI work
# against itself: when a node is full, the scheduler preempts the lowest class
# first. Pods with no class run at 0, the general CI tier.
#
# preemptionPolicy Never on the low classes: a light or dev pod waits for room
# rather than evicting anyone. Release builds may preempt, because they hold
# the GHCR push and a release waiting behind a PR's lint job is the wrong way
# round.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: ci-release
value: 100
preemptionPolicy: PreemptLowerPriority
globalDefault: false
description: Image builds that publish (docker.yml release legs).
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: ci-light
value: -100
preemptionPolicy: Never
globalDefault: false
description: Short gating jobs (path filters, doc checks). Waits rather than preempts.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: ci-dev
value: -200
preemptionPolicy: Never
globalDefault: false
description: Throwaway experiments. First to go.
---
# A CI job that must never be killed mid-run, and never kills anyone either
# (15 Nov 2026). Value 0, the general CI tier, so the default-priority spritz
# heavy pods cannot preempt it (preemption needs a strictly higher priority);
# preemptionPolicy Never, so it waits for room instead of evicting. At
# ci-light (-100) Simplytics' services runners on zag-amd64vm-02 were
# preempted by spritz heavy pods 31 s to minutes into their jobs, and GitHub
# timed the jobs out with no steps run.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: ci-queued
value: 0
preemptionPolicy: Never
globalDefault: false
description: CI jobs that queue behind others for room but are never preempted mid-job.

