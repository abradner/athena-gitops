---
# External Secrets Operator, pinned to the control plane: it holds the
# 1Password service-account token, and the control plane is the only place no
# CI job ever runs (see cluster/zagreus/README.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zagreus-external-secrets
  namespace: argocd
spec:
  project: zagreus-core-project
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.9.0 # keep in step with athena's cluster/core/external-secrets
    helm:
      valuesObject:
        installCRDs: true
        nodeSelector: &cp
          node-role.kubernetes.io/control-plane: ""
        tolerations: &cptol
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
        webhook:
          nodeSelector: *cp
          tolerations: *cptol
        certController:
          nodeSelector: *cp
          tolerations: *cptol
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
---
# A vault of its own holding only CI items (the GitHub App key), so the token
# this cluster carries can read nothing else. The service-account token is
# loaded by hand at bootstrap with bootstrap/kubernetes/load1p-account-token.sh,
# using a service account scoped to this vault alone.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword-ci
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  # Only the scale-set namespaces may draw from it.
  conditions:
    - namespaces:
        - arc-runners
        - arc-builders
  provider:
    onepasswordSDK:
      vault: "Tooling - Github Runners"
      auth:
        serviceAccountSecretRef:
          name: op-token
          key: token
          namespace: external-secrets
