apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello-world-route
  namespace: default
spec:
  parentRefs:
  # This attaches to the gateway we deployed in the default namespace earlier
  - name: homelab-gateway
    namespace: default
    # HTTPS only — plaintext hits the catch-all redirect route instead
    sectionName: https-bradner
  # Public: also attached to the tunnel listener (:8443). This records
  # intent and keeps the route working if attachment ever becomes
  # spec-strict. It is NOT a security control — Cilium serves every route
  # on this Gateway through that hostname-less listener regardless of
  # sectionName (measured, see cluster/core/networking/gateway.yaml). What
  # keeps internal hostnames off the tunnel is the asn.casa deny rule.
  - name: homelab-gateway
    namespace: default
    sectionName: https-tunnel
  hostnames:
  # Change this to whatever FQDN you are pointing at HAProxy!
  - "hello.bradner.net" 
  rules:
  - backendRefs:
    - name: hello-world-svc
      port: 80
