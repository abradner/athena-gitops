---
# spritz (github.com/abradner/spritz), served at rabalex.wedding (later a
# redirect into spritz.events). Web + Temporal worker, garage S3 storage.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spritz
  namespace: argocd
spec:
  project: workloads
  source:
    repoURL: 'https://github.com/abradner/athena-gitops.git'
    targetRevision: main
    path: cluster/apps/spritz
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: spritz
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
