---
# counta web (staging). Single process — no background jobs in the request
# path (the retention sweep runs out-of-band, see purge-cronjob.yaml). The
# image entrypoint runs `rails db:prepare` before the server, so migrations
# apply on rollout. PORT is set explicitly: config/puma.rb defaults to
# 25425 (the pre-cutover dev host's HAProxy mapping); the image pins
# ENV PORT=3000 and this matches it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: counta-web
  namespace: asn-staging
spec:
  # Unparked 2026-08-25. counta#51 (already this pinned image, sha-a213b36)
  # made hosts/WebAuthn env-driven via WebauthnEnvConfig: RAILS_HOSTS,
  # WEBAUTHN_ORIGIN, WEBAUTHN_RP_ID (defaults to the origin's host). The
  # earlier park reason — hardcoded config.hosts — was fixed by the very
  # image this manifest already pinned.
  replicas: 1
  selector:
    matchLabels:
      app: counta-web
  template:
    metadata:
      labels:
        app: counta-web
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: web
          image: ghcr.io/abradner/counta:sha-a213b36c0482b5b6d0e2d04554599ad6bdc5362f
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
            - name: RAILS_HOSTS
              value: staging.counta.click
            - name: WEBAUTHN_ORIGIN
              value: https://staging.counta.click
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: counta-app
          readinessProbe:
            httpGet:
              path: /up
              port: 3000
              # Rails HostAuthorization rejects the kubelet's probe, which
              # sends the pod IP as Host:
              #   Blocked hosts: 10.244.x.y:3000
              # The pod then never goes Ready despite the app being fine.
              httpHeaders:
                # The real staging hostname — allowed via RAILS_HOSTS above —
                # so the probe exercises the same Host path users hit.
                - name: Host
                  value: staging.counta.click
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /up
              port: 3000
              httpHeaders:
                # The real staging hostname — allowed via RAILS_HOSTS above —
                # so the probe exercises the same Host path users hit.
                - name: Host
                  value: staging.counta.click
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: counta-web
  namespace: asn-staging
spec:
  selector:
    app: counta-web
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: counta
  namespace: asn-staging
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: default
      sectionName: https-counta-click-staging
  hostnames:
    - "staging.counta.click"
  rules:
    - backendRefs:
        - name: counta-web
          port: 80
