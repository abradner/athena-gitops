---
# Temporal Web UI for the asn-staging instance. NOTE: no built-in auth — exposed on
# the athena wildcard listener, which HAProxy src-gates to internal networks.
# Delete the HTTPRoute if that listener ever becomes internet-reachable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  namespace: asn-staging
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-ui
  template:
    metadata:
      labels:
        app: temporal-ui
    spec:
      # Kubernetes injects legacy service-discovery variables for every
      # Service in the namespace: a Service named `temporal-ui` produces
      # TEMPORAL_UI_PORT=tcp://10.96.x.x:8080. Temporal UI has its OWN
      # config variable of that name and expects an integer, so the
      # injected value makes it refuse to start:
      #   config file corrupted: cannot unmarshal !!str `tcp://1...` into int
      # Nothing here relies on those variables, so switch them off entirely.
      enableServiceLinks: false
      containers:
        - name: ui
          image: temporalio/ui:2.52.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal-frontend.asn-staging.svc.cluster.local:7233
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
  namespace: asn-staging
spec:
  selector:
    app: temporal-ui
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: temporal-ui
  namespace: asn-staging
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: default
      sectionName: https-athena
  hostnames:
    - "temporal-asn-staging.athena.asn.casa"
  rules:
    - backendRefs:
        - name: temporal-ui
          port: 80
