---
# Credentials for the managed Postgres (postgres.infra.asn.casa). Role
# temporal_asn_staging needs CREATEDB — the schema-setup hook creates the
# temporal_asn_staging and temporal_asn_staging_visibility databases on first sync.
# Provisioned via scripts/provision_app_db.sh temporal_asn staging --skip-db
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: temporal-db
  namespace: asn-staging
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: temporal-db
  data:
    - secretKey: username
      remoteRef:
        key: "temporal-asn-staging/database-username"
    - secretKey: password
      remoteRef:
        key: "temporal-asn-staging/database-password"
