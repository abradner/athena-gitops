---
# kaff web (staging). Solid Queue runs inside Puma (single instance) — the
# Temporal worker below handles the workflow side. Entrypoint runs
# db:prepare on `rails server`, so migrations apply on rollout.
# KAFF_DATABASE_NAME/USERNAME are env-driven in the app's database.yml so
# one production Rails env serves both cluster environments.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaff-web
  namespace: asn-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kaff-web
  template:
    metadata:
      labels:
        app: kaff-web
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: web
          image: ghcr.io/abradner/kaff:sha-779a65c852893a8b9d68aabfaec5d9e7d5ce8df8
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            # yabeda exporter — cluster-internal only, scraped by vmagent
            # (see monitoring.yaml). Never routed by Thruster or the ingress.
            - name: metrics
              containerPort: 9394
          env:
            # Thruster defaults to :80, which a non-root container can't bind
            # under Kubernetes (unprivileged port start is 1024).
            - name: HTTP_PORT
              value: "8080"
            - name: PGHOST
              value: postgres.infra.asn.casa
            - name: KAFF_DATABASE_NAME
              value: kaff_staging
            - name: SOLID_QUEUE_IN_PUMA
              value: "true"
            - name: TEMPORAL_ADDRESS
              value: temporal-frontend.asn-staging.svc.cluster.local:7233
            - name: TEMPORAL_NAMESPACE
              value: kaff
          envFrom:
            - secretRef:
                name: kaff-app
          readinessProbe:
            httpGet:
              path: /up
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /up
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              memory: 768Mi
---
# Temporal worker — same image, separate process (bin/temporal-worker), kept
# out of the request path by design (kaff NFR2).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaff-temporal-worker
  namespace: asn-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kaff-temporal-worker
  template:
    metadata:
      labels:
        app: kaff-temporal-worker
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: worker
          image: ghcr.io/abradner/kaff:sha-779a65c852893a8b9d68aabfaec5d9e7d5ce8df8
          imagePullPolicy: IfNotPresent
          args: ["./bin/temporal-worker"]
          ports:
            # Temporal SDK core Prometheus endpoint (see monitoring.yaml).
            - name: metrics
              containerPort: 9464
          env:
            - name: TEMPORAL_METRICS_ADDR
              value: 0.0.0.0:9464
            - name: PGHOST
              value: postgres.infra.asn.casa
            - name: KAFF_DATABASE_NAME
              value: kaff_staging
            - name: TEMPORAL_ADDRESS
              value: temporal-frontend.asn-staging.svc.cluster.local:7233
            - name: TEMPORAL_NAMESPACE
              value: kaff
          envFrom:
            - secretRef:
                name: kaff-app
          resources:
            requests:
              cpu: 25m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kaff-web
  namespace: asn-staging
  labels:
    # VMServiceScrape (monitoring.yaml) selects the Service by this label.
    app: kaff-web
spec:
  selector:
    app: kaff-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: metrics
      port: 9394
      targetPort: 9394
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kaff
  namespace: asn-staging
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: default
      sectionName: https-kaff-staging
  hostnames:
    - "staging.kaff.asn.casa"
  rules:
    - backendRefs:
        - name: kaff-web
          port: 80
