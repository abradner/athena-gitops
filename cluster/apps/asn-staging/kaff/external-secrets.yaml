---
# App secrets from 1Password. `kaff-staging` item fields (database ones written by
# scripts/provision_app_db.sh kaff staging):
#   database-username / database-password — role kaff_staging, CREATEDB
#     (db:prepare creates the primary/cache/queue/cable databases)
#   rails-master-key — contents of config/master.key
#   garage-access-key-id / garage-secret-access-key — garage S3 keypair for
#     the kaff-staging bucket (ActiveStorage)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kaff-app
  namespace: asn-staging
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: kaff-app
  data:
    - secretKey: KAFF_DATABASE_USERNAME
      remoteRef:
        key: "kaff-staging/database-username"
    - secretKey: KAFF_DATABASE_PASSWORD
      remoteRef:
        key: "kaff-staging/database-password"
    - secretKey: RAILS_MASTER_KEY
      remoteRef:
        key: "kaff-staging/rails-master-key"
    - secretKey: GARAGE_ACCESS_KEY_ID
      remoteRef:
        key: "kaff-staging/garage-access-key-id"
    - secretKey: GARAGE_SECRET_ACCESS_KEY
      remoteRef:
        key: "kaff-staging/garage-secret-access-key"
