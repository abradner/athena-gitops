---
# App secrets from 1Password. `kaff-app` item fields:
#   database-password — password for the `kaff` role on postgres.infra.asn.casa
#                       (role needs CREATEDB: db:prepare creates the
#                       primary/cache/queue/cable databases)
#   rails-master-key  — contents of config/master.key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kaff-app
  namespace: kaff
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: kaff-app
  data:
    - secretKey: KAFF_DATABASE_PASSWORD
      remoteRef:
        key: "kaff-app/database-password"
    - secretKey: RAILS_MASTER_KEY
      remoteRef:
        key: "kaff-app/rails-master-key"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: kaff
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        ".dockerconfigjson": '{"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}"}}}'
  data:
    - secretKey: username
      remoteRef:
        key: "ghcr-pull/username"
    - secretKey: token
      remoteRef:
        key: "ghcr-pull/token"
