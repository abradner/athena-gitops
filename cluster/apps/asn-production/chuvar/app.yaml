---
# chuvar.ai public site (github.com/abradner/chuvar-web) — static Astro build
# served by Caddy on distroless, same shape as spritz-marketing. No shell, no
# package manager: nothing to exec into, health is an HTTP probe.
#
# The site content is baked into the image at build time. The contact form's
# CRM wiring (endpoint, property key, Turnstile site key — all public-by-
# construction values) is also build-time: until the repo's workflow gets
# those repo variables, the form renders in confirm-without-sending mode.
# No Secret here beyond the namespace's existing ghcr-pull.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chuvar-web
  namespace: asn-production
spec:
  # Two replicas so a single node loss or drain doesn't take the site down.
  # The spread is soft and nothing moves pods back afterwards, so after a
  # node loss both can stay on one node; a later reschedule may spread them.
  # Rolling update adds the new pod and waits for it to be Ready before
  # removing an old one, so something answers during a deploy or restart.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: chuvar-web
  template:
    metadata:
      labels:
        app: chuvar-web
    spec:
      # Soft: a pod beside its twin beats a pod left Pending while a node is down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: chuvar-web
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: web
          image: ghcr.io/abradner/chuvar-web:sha-ee73b0714e6a6022573beb9ec5c25cba7032bab5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # Caddy binds :8080 (Caddyfile) — above 1024 so the nonroot user
          # needs no capability, and TLS terminates at the Gateway, so this
          # speaks plain HTTP.
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
---
# Without a PDB a drain could evict both replicas at once. AlwaysAllow lets
# a drain evict pods that aren't Ready (say, a bad image that never passes
# its probe),
# instead of hanging until they recover.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: chuvar-web
  namespace: asn-production
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: chuvar-web
---
apiVersion: v1
kind: Service
metadata:
  name: chuvar-web
  namespace: asn-production
spec:
  selector:
    app: chuvar-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chuvar
  namespace: asn-production
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: default
      sectionName: https-chuvar-ai
    # Public: also attached to the tunnel listener (:8443). This records
    # intent and keeps the route working if attachment ever becomes
    # spec-strict. It is NOT a security control — Cilium serves every route
    # on this Gateway through that hostname-less listener regardless of
    # sectionName (measured, see cluster/core/networking/gateway.yaml). What
    # keeps internal hostnames off the tunnel is the asn.casa deny rule.
    - name: homelab-gateway
      namespace: default
      sectionName: https-tunnel
  hostnames:
    - "chuvar.ai"
  rules:
    - backendRefs:
        - name: chuvar-web
          port: 80
