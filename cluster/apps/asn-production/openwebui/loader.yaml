---
# eml-loader code. Copied from abradner/asn-infra llm/frontend/eml-loader/loader.py (tests: test.sh
# there, 24 checks against a real Tika). This copy becomes the source when this deployment merges;
# the asn-infra copy is then removed, not kept in step.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openwebui-loader-code
  namespace: asn-production
data:
  loader.py: |
    """Open WebUI external document loader: Tika, plus the email headers Open WebUI drops.

    Open WebUI (CONTENT_EXTRACTION_ENGINE=external) PUTs every uploaded file to /process and expects
    {"page_content": str, "metadata": dict}. This forwards the bytes to Tika's /rmeta/text, which
    returns the document and each embedded attachment as separate entries with their metadata.
    For emails (.eml, Outlook .msg) it writes a From/To/Cc/Date/Subject block above the body,
    which Open WebUI's own Tika loader discards. Everything else passes through as Tika's text.

    Stdlib only, so it runs from a ConfigMap in a stock python image with no build.
    """

    import hmac
    import json
    import os
    import re
    import sys
    import urllib.parse
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    TIKA_URL = os.environ["TIKA_URL"].rstrip("/")  # required: fail at start, not per request
    API_KEY = os.environ["LOADER_API_KEY"]
    if len(API_KEY) < 32:
        sys.exit("LOADER_API_KEY must be at least 32 characters")
    MAX_BYTES = int(os.environ.get("MAX_BYTES", str(50 * 1024 * 1024)))
    TIKA_TIMEOUT = int(os.environ.get("TIKA_TIMEOUT", "120"))

    EMAIL_TYPES = ("message/rfc822", "application/vnd.ms-outlook")
    HEADER_FIELDS = (  # (label, Tika metadata keys in order of preference)
        ("From", ("Message-From", "Message:From-Email", "dc:creator")),
        ("To", ("Message-To",)),
        ("Cc", ("Message-Cc",)),
        ("Date (UTC)", ("dcterms:created",)),
        ("Subject", ("dc:title", "subject")),
    )


    def first(meta, keys):
        for k in keys:
            v = meta.get(k)
            if v:
                return ", ".join(v) if isinstance(v, list) else str(v)
        return None


    def tidy(text):
        return re.sub(r"\n{3,}", "\n\n", text or "").strip()


    def is_email(meta):
        return str(meta.get("Content-Type", "")).split(";")[0].strip() in EMAIL_TYPES


    def render(entries, filename):
        parts = []
        for i, meta in enumerate(entries):
            body = tidy(meta.get("X-TIKA:content"))
            if is_email(meta):
                lines = [f"{label}: {v}" for label, keys in HEADER_FIELDS if (v := first(meta, keys))]
                title = "Email" if i == 0 else f"Attached email: {meta.get('resourceName', '')}"
                parts.append(f"{title}\n" + "\n".join(lines) + ("\n\n" + body if body else ""))
            elif i == 0:
                parts.append(body)
            elif body:
                parts.append(f"--- Attachment: {meta.get('resourceName', 'unnamed')} ---\n{body}")
        return "\n\n".join(p for p in parts if p)


    # Emails are the files this loader exists for, so don't leave their type to Tika's detection
    # when the browser sent a generic one (Windows often sends application/octet-stream or nothing).
    BY_EXTENSION = {".eml": "message/rfc822", ".msg": "application/vnd.ms-outlook"}
    GENERIC = ("", "application/octet-stream", "text/plain")


    def tika_rmeta(data, content_type, filename):
        headers = {"Accept": "application/json"}
        ext = os.path.splitext(filename.lower())[1]
        if (content_type or "").split(";")[0].strip() in GENERIC:
            # A generic type is a guess by the browser; Tika takes any type literally (an .xls sent
            # as text/plain comes back as binary garbage), so let it detect from the bytes instead.
            content_type = BY_EXTENSION.get(ext, "application/octet-stream")
        # Always send a type. Without one, urllib adds application/x-www-form-urlencoded, which Tika
        # takes literally and answers with empty text (a 200 with nothing in it). octet-stream makes
        # Tika detect the type from the bytes.
        headers["Content-Type"] = content_type or "application/octet-stream"
        req = urllib.request.Request(f"{TIKA_URL}/rmeta/text", data=data, headers=headers, method="PUT")
        with urllib.request.urlopen(req, timeout=TIKA_TIMEOUT) as r:
            return json.load(r)


    class Handler(BaseHTTPRequestHandler):
        timeout = 30  # per socket read, not per request: a client trickling bytes can still hold a thread

        def _send(self, code, obj):
            body = json.dumps(obj).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path == "/health":
                return self._send(200, {"ok": True})
            self._send(404, {"error": "not found"})

        def do_PUT(self):
            if self.path != "/process":
                return self._send(404, {"error": "not found"})
            auth = self.headers.get("Authorization", "")
            if not hmac.compare_digest(auth.encode(), f"Bearer {API_KEY}".encode()):
                return self._send(401, {"error": "unauthorized"})
            try:
                length = int(self.headers.get("Content-Length") or 0)
            except ValueError:
                return self._send(400, {"error": "bad Content-Length"})
            if length <= 0 or length > MAX_BYTES:
                return self._send(413, {"error": f"body must be 1..{MAX_BYTES} bytes"})
            data = self.rfile.read(length)
            if len(data) != length:  # client closed early: never extract half a document as a success
                return self._send(400, {"error": "body shorter than Content-Length"})
            filename = urllib.parse.unquote(self.headers.get("X-Filename", ""))
            try:
                entries = tika_rmeta(data, self.headers.get("Content-Type"), filename)
            except Exception as e:  # Tika down or rejected the file: Open WebUI shows the error
                return self._send(502, {"error": f"tika: {type(e).__name__}"})
            if not isinstance(entries, list) or not entries or not all(isinstance(e, dict) for e in entries):
                return self._send(502, {"error": "tika returned no documents"})
            try:
                text = render(entries, filename)
            except Exception as e:
                return self._send(500, {"error": f"render: {type(e).__name__}"})
            meta = {"source": filename, "content_type": str(entries[0].get("Content-Type", ""))}
            self._send(200, {"page_content": text, "metadata": meta})

        # A fixed route label and the status only. Filenames, the X-OpenWebUI-User-* headers Open WebUI
        # sends with every upload, and whatever an unauthenticated caller puts in the request target
        # (query strings, control characters) are never logged. getattr: a malformed request line
        # reaches here before command/path are set.
        ROUTES = {"/process", "/health"}

        def log_message(self, fmt, *args):
            status = args[1] if len(args) > 1 and fmt.startswith('"%s" %s') else "-"
            method = getattr(self, "command", None)
            method = method if method in ("GET", "PUT", "POST", "HEAD") else "-"
            route = getattr(self, "path", None)
            route = route if route in self.ROUTES else "other"
            sys.stderr.write(f"{method} {route} -> {status}\n")


    if __name__ == "__main__":
        ThreadingHTTPServer(("0.0.0.0", int(os.environ.get("PORT", "8000"))), Handler).serve_forever()
