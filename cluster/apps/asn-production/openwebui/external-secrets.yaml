---
# Secrets from 1Password item `openwebui-production` (vault Tooling - Athena). Field inventory and
# how each is made: asn-infra llm/frontend/README.md ("Deploy") and SECRETS.md.
#   database-url        written by scripts/provision_app_db.sh openwebui production (postgres://…)
#   garage-access-key-id / garage-secret-access-key   key allowed on bucket openwebui-production only
#   webui-secret-key    encrypts every user's TOTP secret: losing or changing it locks all users out
#   admin-email / admin-password   first admin, used only when the database has no users yet
#   loader-api-key      shared with the eml-loader below
#   llm-base-url        the model endpoint (…/v1); private address, so it lives here, not in git.
#                       Today llama-swap on the GPU host; the LiteLLM router once it exists.
#   router-api-key      this frontend's own key for that endpoint (never the runner's shared key)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openwebui-app
  namespace: asn-production
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: openwebui-app
    template:
      engineVersion: v2
      data:
        # Open WebUI rewrites postgres:// for its main database but reads PGVECTOR_DB_URL raw, and
        # SQLAlchemy refuses the postgres:// scheme, so both are given as postgresql://.
        DATABASE_URL: '{{ .dburl | replace "postgres://" "postgresql://" }}'
        PGVECTOR_DB_URL: '{{ .dburl | replace "postgres://" "postgresql://" }}'
        WEBUI_SECRET_KEY: "{{ .webuikey }}"
        WEBUI_ADMIN_EMAIL: "{{ .adminemail }}"
        WEBUI_ADMIN_PASSWORD: "{{ .adminpw }}"
        S3_ACCESS_KEY_ID: "{{ .s3id }}"
        S3_SECRET_ACCESS_KEY: "{{ .s3secret }}"
        EXTERNAL_DOCUMENT_LOADER_API_KEY: "{{ .loaderkey }}"
        OPENAI_API_BASE_URL: "{{ .llmurl }}"
        OPENAI_API_KEY: "{{ .llmkey }}"
  data:
    - secretKey: dburl
      remoteRef: {key: "openwebui-production/database-url"}
    - secretKey: webuikey
      remoteRef: {key: "openwebui-production/webui-secret-key"}
    - secretKey: adminemail
      remoteRef: {key: "openwebui-production/admin-email"}
    - secretKey: adminpw
      remoteRef: {key: "openwebui-production/admin-password"}
    - secretKey: s3id
      remoteRef: {key: "openwebui-production/garage-access-key-id"}
    - secretKey: s3secret
      remoteRef: {key: "openwebui-production/garage-secret-access-key"}
    - secretKey: loaderkey
      remoteRef: {key: "openwebui-production/loader-api-key"}
    - secretKey: llmurl
      remoteRef: {key: "openwebui-production/llm-base-url"}
    - secretKey: llmkey
      remoteRef: {key: "openwebui-production/router-api-key"}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openwebui-loader
  namespace: asn-production
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: openwebui-loader
  data:
    - secretKey: LOADER_API_KEY
      remoteRef: {key: "openwebui-production/loader-api-key"}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openwebui-searxng
  namespace: asn-production
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: openwebui-searxng
  data:
    - secretKey: SEARXNG_SECRET
      remoteRef: {key: "openwebui-production/searxng-secret-key"}
