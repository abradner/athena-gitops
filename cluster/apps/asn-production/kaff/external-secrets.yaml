---
# App secrets from 1Password. `kaff-production` item fields (database ones written by
# scripts/provision_app_db.sh kaff production):
#   database-username / database-password — role kaff_production, CREATEDB
#     (db:prepare creates the primary/cache/queue/cable databases)
#   rails-master-key — contents of config/master.key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kaff-app
  namespace: asn-production
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: kaff-app
  data:
    - secretKey: KAFF_DATABASE_USERNAME
      remoteRef:
        key: "kaff-production/database-username"
    - secretKey: KAFF_DATABASE_PASSWORD
      remoteRef:
        key: "kaff-production/database-password"
    - secretKey: RAILS_MASTER_KEY
      remoteRef:
        key: "kaff-production/rails-master-key"
