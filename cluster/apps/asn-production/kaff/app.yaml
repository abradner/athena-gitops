---
# kaff web (production). Solid Queue runs inside Puma (single instance) and
# executes the recurring (nightly) jobs. Entrypoint runs
# db:prepare on `rails server`, so migrations apply on rollout.
# KAFF_DATABASE_NAME/USERNAME are env-driven in the app's database.yml so
# one production Rails env serves both cluster environments.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaff-web
  namespace: asn-production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kaff-web
  template:
    metadata:
      labels:
        app: kaff-web
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: web
          image: ghcr.io/abradner/kaff:sha-779a65c852893a8b9d68aabfaec5d9e7d5ce8df8@sha256:0f61de701507849439075767c249ac73b65f170dcc6bc85ff07ddaef9c412369
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            # yabeda exporter — cluster-internal only, scraped by vmagent
            # (see monitoring.yaml). Never routed by Thruster or the ingress.
            - name: metrics
              containerPort: 9394
          env:
            # Thruster defaults to :80, which a non-root container can't bind
            # under Kubernetes (unprivileged port start is 1024).
            - name: HTTP_PORT
              value: "8080"
            - name: PGHOST
              value: postgres.infra.asn.casa
            - name: KAFF_DATABASE_NAME
              value: kaff_production
            - name: SOLID_QUEUE_IN_PUMA
              value: "true"
          envFrom:
            - secretRef:
                name: kaff-app
          readinessProbe:
            httpGet:
              path: /up
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /up
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kaff-web
  namespace: asn-production
  labels:
    # VMServiceScrape (monitoring.yaml) selects the Service by this label.
    app: kaff-web
spec:
  selector:
    app: kaff-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: metrics
      port: 9394
      targetPort: 9394
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kaff
  namespace: asn-production
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: default
      sectionName: https-kaff
  hostnames:
    - "kaff.asn.casa"
  rules:
    - backendRefs:
        - name: kaff-web
          port: 80
