---
# crm web (production) — the shared contact-form inbox at inbox.simplytics.ai.
# Several marketing sites (chuvar.ai, spritz.events, later kaff/counta) POST
# their contact form here; the admin panel at /admin is the only
# authenticated surface. Lives in asn-production rather than a
# simplytics-production group of its own because it is fleet-shared
# infrastructure and reuses this namespace's Temporal instance — the
# hostname's zone does not imply the namespace group (cf. counta.click).
#
# The image entrypoint runs `rails db:prepare` before `rails server`, so
# migrations apply on rollout. crm's tables default their primary keys to
# `uuidv7()`, a PostgreSQL 18 builtin — postgres.infra.asn.casa runs 18.4,
# which is what makes that work. Do not point this at an older server.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-web
  namespace: asn-production
spec:
  # Two replicas so a single node loss or drain doesn't take the site down.
  # The spread is soft and nothing moves pods back afterwards, so after a
  # node loss both can stay on one node; a later reschedule may spread them.
  # Rolling update adds the new pod and waits for it to be Ready before
  # removing an old one, so something answers during a deploy or restart.
  # Rails against the shared Postgres: each pod holds its own connection pool,
  # so every replica spends connections on that server. Count them before
  # raising this.
  # rack-attack counts in each pod's own Rails.cache (no shared cache_store),
  # so its per-IP and per-email limits apply per pod: two pods roughly double
  # them. Turnstile is the main defence on the form.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: crm-web
  template:
    metadata:
      labels:
        app: crm-web
    spec:
      # Soft: a pod beside its twin beats a pod left Pending while a node is down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: crm-web
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: web
          # Pinned sha-<commit> tag (crm AGENTS.md §7: never a branch tag).
          # Deploying crm = bump this tag everywhere in this directory
          # (app.yaml and temporal.yaml) to a sha published by crm's
          # docker.yml and let Argo sync it.
          image: ghcr.io/abradner/crm:sha-472e5f66b08fb0553a96ab90e086ce71a3016651@sha256:c3e70d0c193e34151e92799fb0c408f7873234ed64aff0a481d0faac8d3bc757
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Thruster defaults to :80, which a non-root container can't bind
            # under Kubernetes (unprivileged port start is 1024).
            - name: HTTP_PORT
              value: "8080"
            - name: TEMPORAL_ADDRESS
              value: temporal-frontend.asn-production.svc.cluster.local:7233
            # Registered by this namespace's temporal-register-namespaces
            # PostSync hook. crm's own default would be "crm-production"
            # (Rails.env-derived); the cluster namespace is per-app, not
            # per-environment, so it is set explicitly.
            - name: TEMPORAL_NAMESPACE
              value: crm
          envFrom:
            - secretRef:
                name: crm-app
          readinessProbe:
            httpGet:
              path: /up
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /up
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              memory: 768Mi
---
# Without a PDB a drain could evict both replicas at once. AlwaysAllow lets
# a drain evict pods that aren't Ready (say, while the database is down),
# instead of hanging until they recover.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: crm-web
  namespace: asn-production
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: crm-web
---
apiVersion: v1
kind: Service
metadata:
  name: crm-web
  namespace: asn-production
spec:
  selector:
    app: crm-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: crm
  namespace: asn-production
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: default
      sectionName: https-inbox-simplytics-ai
    # Public: also attached to the tunnel listener (:8443). This records
    # intent and keeps the route working if attachment ever becomes
    # spec-strict. It is NOT a security control — Cilium serves every route
    # on this Gateway through that hostname-less listener regardless of
    # sectionName (measured, see cluster/core/networking/gateway.yaml). What
    # keeps internal hostnames off the tunnel is the asn.casa deny rule.
    - name: homelab-gateway
      namespace: default
      sectionName: https-tunnel
  hostnames:
    - "inbox.simplytics.ai"
  rules:
    - backendRefs:
        - name: crm-web
          port: 80
