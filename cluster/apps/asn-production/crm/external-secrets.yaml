---
# App secrets from 1Password. `crm-production` item fields (database-url
# written by scripts/provision_app_db.sh crm production):
#   database-url        — postgres://crm_production:<pw>@postgres.infra.asn.casa:5432/crm_production
#   rails-master-key    — contents of config/master.key
#   telegram-bot-token  — TELEGRAM_BOT_TOKEN, the bot that posts submissions
#
# TELEGRAM_BOT_TOKEN is app-wide on purpose and is not a violation of crm's
# "per-property config lives on the Property record" rule: the bot is the
# transport, while *which chat* each property announces to is the channel's
# jsonb config in the database (crm AGENTS.md §4.4). It is read with a bare
# ENV.fetch, so a missing value raises at delivery rather than silently
# dropping a stranger's message.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crm-app
  namespace: asn-production
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: crm-app
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: "crm-production/database-url"
    - secretKey: RAILS_MASTER_KEY
      remoteRef:
        key: "crm-production/rails-master-key"
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: "crm-production/telegram-bot-token"
