---
# mcg web (production). Single process — no background jobs yet. The image
# entrypoint runs `rails db:prepare` before the server, so migrations apply
# on rollout.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcg-web
  namespace: asn-production
spec:
  # Cutover 2026-08-25: the old VM (10.10.20.133:3000) is dead — port closed,
  # mcg.rest was serving 503. This targets the same `mcg_production` database
  # on postgres.infra.asn.casa the VM used, so data carries over; db:prepare
  # in the entrypoint applies any pending migrations with no live app to race.
  replicas: 1
  selector:
    matchLabels:
      app: mcg-web
  template:
    metadata:
      labels:
        app: mcg-web
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: web
          image: ghcr.io/abradner/mcg:sha-f71e0af3712aa418faa59807a279ca4cf7fdb8d2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: mcg-app
          readinessProbe:
            httpGet:
              path: /up
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /up
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mcg-web
  namespace: asn-production
spec:
  selector:
    app: mcg-web
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcg
  namespace: asn-production
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: default
      sectionName: https-mcg-rest
  hostnames:
    - "mcg.rest"
  rules:
    - backendRefs:
        - name: mcg-web
          port: 80
