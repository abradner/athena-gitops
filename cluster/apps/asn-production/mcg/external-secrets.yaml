---
# App secrets from 1Password. `mcg-production` item fields (database-url written by
# scripts/provision_app_db.sh mcg production):
#   database-url     — postgres://mcg_production:<pw>@postgres.infra.asn.casa:5432/mcg_production
#   rails-master-key — contents of config/master.key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcg-app
  namespace: asn-production
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: mcg-app
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: "mcg-production/database-url"
    - secretKey: RAILS_MASTER_KEY
      remoteRef:
        key: "mcg-production/rails-master-key"
