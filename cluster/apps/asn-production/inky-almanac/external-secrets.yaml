# Inky Almanac's runtime config and frame release, both from 1Password (the
# vault the onepassword-backend store reads). Two items, two ExternalSecrets.
#
# `inky-almanac` -- the renderer's settings, one text field per variable. They
# name where the frame hangs, so they live in 1Password and never in this
# public repo (AGENTS.md, "The public/private split"):
#   ALMANAC_PLACE, ALMANAC_LAT, ALMANAC_LON, ALMANAC_TZ, ALMANAC_BOM_TOWN
# Anything not set here falls back to the renderer's Sydney defaults, silently
# (the app's gotchas.md: "An unset location renders Sydney").
#
# `inky-almanac-ota` -- the signed frame release, two FILE ATTACHMENTS named
# exactly `manifest.json` and `almanac_frame.py`. Published from the
# maintainer's machine with scripts/release-ota.sh in the app repo; the signing
# key never leaves it. Attachments, not text fields: the frame checks the
# sha256 of the code it downloads, so the bytes must arrive as signed, and a
# 1Password field can drop a PEM's newlines (cluster/zagreus/core/github-app.yaml
# hit that). As there, the attachment is read by secret reference
# (`<item>/<file name>`), which the provider resolves through the SDK;
# `dataFrom.extract` with `property: file/` fails in ESO 2.9.0.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: inky-almanac
  namespace: asn-production
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: inky-almanac
  data:
    - secretKey: ALMANAC_PLACE
      remoteRef:
        key: "inky-almanac/ALMANAC_PLACE"
    - secretKey: ALMANAC_LAT
      remoteRef:
        key: "inky-almanac/ALMANAC_LAT"
    - secretKey: ALMANAC_LON
      remoteRef:
        key: "inky-almanac/ALMANAC_LON"
    - secretKey: ALMANAC_TZ
      remoteRef:
        key: "inky-almanac/ALMANAC_TZ"
    - secretKey: ALMANAC_BOM_TOWN
      remoteRef:
        key: "inky-almanac/ALMANAC_BOM_TOWN"
---
# A release is a pair: both keys come from one reconcile into one Secret, and
# the kubelet swaps a mounted Secret's files atomically, so the server never
# sees a manifest from one release beside the code of another.
#
# Force a sync after publishing instead of waiting out the 24h refresh:
#   kubectl -n asn-production annotate externalsecret inky-almanac-ota \
#     force-sync="$(date +%s)" --overwrite
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: inky-almanac-ota
  namespace: asn-production
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: inky-almanac-ota
  data:
    - secretKey: manifest.json
      remoteRef:
        key: "inky-almanac-ota/manifest.json"
    - secretKey: almanac_frame.py
      remoteRef:
        key: "inky-almanac-ota/almanac_frame.py"
