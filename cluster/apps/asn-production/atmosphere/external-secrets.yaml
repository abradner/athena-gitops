# Atmosphere's runtime config, from the atmosphere-production item in 1Password.
#
# MQTT_BROKER and TRACEMAP_URL are addresses, not secrets. They live in
# 1Password anyway because this repo is public and both name hosts on the
# private network (see AGENTS.md, "The public/private split").
#
# ATMOSPHERE_KEY is the fleet's shared signing key. It must be the same value
# the Pi panels and the rest of the fleet hold, or signed writes fail to verify.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atmosphere
  namespace: asn-production
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: atmosphere
  data:
    - secretKey: ATMOSPHERE_KEY
      remoteRef:
        key: "atmosphere-production/atmosphere-key"
    - secretKey: MQTT_BROKER
      remoteRef:
        key: "atmosphere-production/mqtt-broker"
    - secretKey: MQTT_USERNAME
      remoteRef:
        key: "atmosphere-production/mqtt-username"
    - secretKey: MQTT_PASSWORD
      remoteRef:
        key: "atmosphere-production/mqtt-password"
    - secretKey: TRACEMAP_URL
      remoteRef:
        key: "atmosphere-production/tracemap-url"
---
# The sky server's ed25519 identity seed (base64, one line). Mounted read-only:
# the server reads an existing seed and never rewrites it, so its fingerprint
# stays the same across restarts without a PersistentVolume.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atmosphere-identity
  namespace: asn-production
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: atmosphere-identity
  data:
    - secretKey: identity
      remoteRef:
        key: "atmosphere-production/identity"
