---
# counta web (production). Single process — no background jobs in the request
# path (the retention sweep runs out-of-band, see purge-cronjob.yaml). The
# image entrypoint runs `rails db:prepare` before the server, so migrations
# apply on rollout. PORT is set explicitly: config/puma.rb defaults to
# 25425 (the pre-cutover dev host's HAProxy mapping); the image pins
# ENV PORT=3000 and this matches it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: counta-web
  namespace: asn-production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: counta-web
  template:
    metadata:
      labels:
        app: counta-web
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: web
          image: ghcr.io/abradner/counta:sha-037c9bd1de1ca98341700a746cadad0d96a0292e
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
            # yabeda exporter — cluster-internal only, scraped by vmagent
            # (see monitoring.yaml). Never routed by the ingress.
            - name: metrics
              containerPort: 9394
          envFrom:
            - secretRef:
                name: counta-app
          readinessProbe:
            httpGet:
              path: /up
              port: 3000
              # Rails HostAuthorization rejects the kubelet's probe, which
              # sends the pod IP as Host:
              #   Blocked hosts: 10.244.x.y:3000
              # The pod then never goes Ready despite the app being fine.
              httpHeaders:
                - name: Host
                  value: counta.click
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /up
              port: 3000
              httpHeaders:
                - name: Host
                  value: counta.click
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: counta-web
  namespace: asn-production
  labels:
    # VMServiceScrape (monitoring.yaml) selects the Service by this label.
    app: counta-web
spec:
  selector:
    app: counta-web
  ports:
    - name: http
      port: 80
      targetPort: 3000
    - name: metrics
      port: 9394
      targetPort: 9394
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: counta
  namespace: asn-production
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: default
      sectionName: https-counta-click
    # Public: also reachable through the Cloudflare Tunnel, which arrives on
    # the hostname-less :8443 listener. Routes pin themselves with
    # sectionName, so attaching there is opt-in — which is deliberate. It
    # means an internal route cannot be served over a tunnel even if a DNS
    # record pointed at one.
    - name: homelab-gateway
      namespace: default
      sectionName: https-tunnel
  hostnames:
    - "counta.click"
  rules:
    - backendRefs:
        - name: counta-web
          port: 80
