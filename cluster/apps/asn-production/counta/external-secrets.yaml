---
# App secrets from 1Password. `counta-production` item fields (database-url
# written by scripts/provision_app_db.sh counta production):
#   database-url     — postgres://counta_production:<pw>@postgres.infra.asn.casa:5432/counta_production
#   rails-master-key — contents of config/master.key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: counta-app
  namespace: asn-production
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: counta-app
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: "counta-production/database-url"
    - secretKey: RAILS_MASTER_KEY
      remoteRef:
        key: "counta-production/rails-master-key"
