---
# App secrets from 1Password. `spritz-app` item fields:
#   database-username / database-password — role on postgres.infra.asn.casa
#                       (needs CREATEDB: db:prepare creates the
#                       primary/cache/queue/cable databases)
#   rails-master-key  — contents of config/master.key
#   secret-key-base   — SECRET_KEY_BASE
#   garage-access-key-id / garage-secret-access-key — garage S3 keypair
#   smtp-username / smtp-password — SMTP credentials
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spritz-app
  namespace: spritz
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: spritz-app
  data:
    - secretKey: SPRITZ_DATABASE_USERNAME
      remoteRef:
        key: "spritz-app/database-username"
    - secretKey: SPRITZ_DATABASE_PASSWORD
      remoteRef:
        key: "spritz-app/database-password"
    - secretKey: RAILS_MASTER_KEY
      remoteRef:
        key: "spritz-app/rails-master-key"
    - secretKey: SECRET_KEY_BASE
      remoteRef:
        key: "spritz-app/secret-key-base"
    - secretKey: GARAGE_ACCESS_KEY_ID
      remoteRef:
        key: "spritz-app/garage-access-key-id"
    - secretKey: GARAGE_SECRET_ACCESS_KEY
      remoteRef:
        key: "spritz-app/garage-secret-access-key"
    - secretKey: SMTP_USERNAME
      remoteRef:
        key: "spritz-app/smtp-username"
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: "spritz-app/smtp-password"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: spritz
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        ".dockerconfigjson": '{"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}"}}}'
  data:
    - secretKey: username
      remoteRef:
        key: "ghcr-pull/username"
    - secretKey: token
      remoteRef:
        key: "ghcr-pull/token"
