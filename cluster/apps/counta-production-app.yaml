---
# Counta (github.com/abradner/counta) — pen/dose click counter (production),
# served at counta.click. Production is a real cutover: the Pi dev-server
# currently serving counta.click retires once live (counta issue #10 /
# R-005) — see the PR checklist.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: counta-production
  namespace: argocd
spec:
  project: workloads
  source:
    repoURL: 'https://github.com/abradner/athena-gitops.git'
    targetRevision: main
    path: cluster/apps/asn-production/counta
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: asn-production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
