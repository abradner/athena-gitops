---
# App secrets from 1Password. `spritz-staging` item fields (database ones written by
# scripts/provision_app_db.sh spritz staging):
#   database-username / database-password — role spritz_staging, CREATEDB
#     (db:prepare creates the primary/cache/queue/cable databases)
#   rails-master-key  — contents of config/master.key
#   secret-key-base   — SECRET_KEY_BASE
#   garage-access-key-id / garage-secret-access-key — garage S3 keypair
#   smtp-username / smtp-password — SMTP credentials (Gmail app password)
#   turnstile-secret-key — Cloudflare Turnstile secret (see the entry below)
#   whatsapp-access-token / whatsapp-phone-number-id /
#     whatsapp-verify-token / whatsapp-app-secret — WhatsApp Cloud API for the
#     staging Meta app + test number (see the WhatsApp entries below)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spritz-app
  namespace: spritz-staging
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: spritz-app
  data:
    - secretKey: SPRITZ_DATABASE_USERNAME
      remoteRef:
        key: "spritz-staging/database-username"
    - secretKey: SPRITZ_DATABASE_PASSWORD
      remoteRef:
        key: "spritz-staging/database-password"
    - secretKey: RAILS_MASTER_KEY
      remoteRef:
        key: "spritz-staging/rails-master-key"
    - secretKey: SECRET_KEY_BASE
      remoteRef:
        key: "spritz-staging/secret-key-base"
    - secretKey: GARAGE_ACCESS_KEY_ID
      remoteRef:
        key: "spritz-staging/garage-access-key-id"
    - secretKey: GARAGE_SECRET_ACCESS_KEY
      remoteRef:
        key: "spritz-staging/garage-secret-access-key"
    - secretKey: SMTP_USERNAME
      remoteRef:
        key: "spritz-staging/smtp-username"
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: "spritz-staging/smtp-password"
    # Cloudflare Turnstile secret for the contact form. Copied (not moved)
    # from the "Turnstile: Spritz.events" item in AsN Infra — the VMs still
    # serve these sites and share the same key. Verified accepted by
    # Cloudflare's siteverify endpoint before use.
    - secretKey: TURNSTILE_SECRET_KEY
      remoteRef:
        key: "spritz-staging/turnstile-secret-key"
    # WhatsApp Cloud API — the STAGING Meta app and its free test number, not
    # production's WABA (one Meta app has exactly one webhook URL, and the test
    # number's 5-recipient allowlist is the hard guard against messaging real
    # guests from a database refreshed from production). All four are required
    # at boot by config/initializers/whatsapp.rb whenever WHATSAPP_ENABLED is
    # not "false" — so these must sync BEFORE that flag flips in config.yaml,
    # or web and temporal-worker both CrashLoopBackOff on their next restart.
    #
    # whatsapp-access-token must be a System User token (never-expiring,
    # whatsapp_business_messaging + whatsapp_business_management), not the
    # 24h temporary token from the API Setup page — the initializer checks
    # presence, not validity, so a dev token boots fine and dies overnight.
    # whatsapp-verify-token is self-generated (openssl rand -hex 24); it is
    # the value Meta echoes back during the webhook handshake.
    - secretKey: WHATSAPP_ACCESS_TOKEN
      remoteRef:
        key: "spritz-staging/whatsapp-access-token"
    - secretKey: WHATSAPP_PHONE_NUMBER_ID
      remoteRef:
        key: "spritz-staging/whatsapp-phone-number-id"
    - secretKey: WHATSAPP_VERIFY_TOKEN
      remoteRef:
        key: "spritz-staging/whatsapp-verify-token"
    - secretKey: WHATSAPP_APP_SECRET
      remoteRef:
        key: "spritz-staging/whatsapp-app-secret"
