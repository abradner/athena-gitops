---
# App secrets from 1Password. `spritz-staging` item fields (database ones written by
# scripts/provision_app_db.sh spritz staging):
#   database-username / database-password — role spritz_staging, CREATEDB
#     (db:prepare creates the primary/cache/queue/cable databases)
#   rails-master-key  — contents of config/master.key
#   secret-key-base   — SECRET_KEY_BASE
#   garage-access-key-id / garage-secret-access-key — garage S3 keypair
#   smtp-username / smtp-password — SMTP credentials (Gmail app password)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spritz-app
  namespace: spritz-staging
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: spritz-app
  data:
    - secretKey: SPRITZ_DATABASE_USERNAME
      remoteRef:
        key: "spritz-staging/database-username"
    - secretKey: SPRITZ_DATABASE_PASSWORD
      remoteRef:
        key: "spritz-staging/database-password"
    - secretKey: RAILS_MASTER_KEY
      remoteRef:
        key: "spritz-staging/rails-master-key"
    - secretKey: SECRET_KEY_BASE
      remoteRef:
        key: "spritz-staging/secret-key-base"
    - secretKey: GARAGE_ACCESS_KEY_ID
      remoteRef:
        key: "spritz-staging/garage-access-key-id"
    - secretKey: GARAGE_SECRET_ACCESS_KEY
      remoteRef:
        key: "spritz-staging/garage-secret-access-key"
    - secretKey: SMTP_USERNAME
      remoteRef:
        key: "spritz-staging/smtp-username"
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: "spritz-staging/smtp-password"
    # Cloudflare Turnstile secret for the contact form. Copied (not moved)
    # from the "Turnstile: Spritz.events" item in AsN Infra — the VMs still
    # serve these sites and share the same key. Verified accepted by
    # Cloudflare's siteverify endpoint before use.
    - secretKey: TURNSTILE_SECRET_KEY
      remoteRef:
        key: "spritz-staging/turnstile-secret-key"
    # SHA-256 hex of the video transcoder's token (abradner/spritz
    # config/initializers/transcoder.rb). REQUIRED at boot by every app
    # process from v202610160907 on: anything but 64 hex characters and the
    # pod does not start. The token itself is the `transcoder-token` field of
    # the same item, and only the transcoder reads it (transcoder.yaml).
    # Made 2026-10-17 (gate G2): openssl rand -hex 32, then its sha256sum,
    # written straight into 1Password, never printed. To rotate, write both
    # fields together, then restart spritz-web, spritz-temporal-worker and
    # spritz-transcoder (env is read only at start).
    - secretKey: TRANSCODER_TOKEN_DIGEST
      remoteRef:
        key: "spritz-staging/transcoder-token-digest"
    # Active Record encryption (Save the Date and thank-you link tokens are
    # `encrypts :token`). Written 2026-10-28 straight into 1Password as
    # openssl rand -hex 32 each, never printed. Never rotate in place:
    # rows encrypted under the old keys become unreadable.
    - secretKey: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
      remoteRef:
        key: "spritz-staging/active-record-encryption-primary-key"
    - secretKey: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
      remoteRef:
        key: "spritz-staging/active-record-encryption-deterministic-key"
    - secretKey: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
      remoteRef:
        key: "spritz-staging/active-record-encryption-key-derivation-salt"
