---
# Non-secret app config, shared by the web and worker deployments.
apiVersion: v1
kind: ConfigMap
metadata:
  name: spritz-config
  namespace: spritz-staging
data:
  RAILS_ENV: staging
  RAILS_LOG_LEVEL: info
  SPRITZ_DATABASE_HOST: postgres.infra.asn.casa
  # garage's S3 API listens plain-HTTP on :3900 (internal network only).
  GARAGE_ENDPOINT: http://garage.infra.asn.casa:3900
  GARAGE_BUCKET: spritz-staging
  # Whether a web pod renders a guest photo's variant that the job queue has
  # not rendered yet ("true": what the app has always done), or answers "not
  # ready" and leaves it to the queue ("false").
  #
  # REQUIRED by app images from abradner/spritz "day photo originals" onward:
  # the app reads it at boot and accepts only "true" or "false", so a pod
  # without it does not start. Older images ignore it. That is why it is here
  # before any image that needs it.
  #
  # "false" keeps 48MP decodes out of the web pods, and makes new guest photos
  # depend on the queue: with the queue down, none appear. If photos stop
  # appearing on the day, set this back to "true" and restart spritz-web.
  GUEST_PHOTOS_RENDER_IN_WEB: "true"
  # How the app answers a request for an occasion picture's original, or for
  # a variant it no longer declares. "observe": serve it as before and log
  # what "enforce" would have refused. "enforce": redirect an original to its
  # stripped variant and refuse an undeclared variant key. A removed picture
  # is refused in both.
  #
  # REQUIRED by app images from abradner/spritz "image library" (#1032–#1050)
  # onward: read on the first image request, and any other value raises, so
  # every picture errors. Older images ignore it.
  #
  # Stays "observe" for at least one release: a tab left open across the
  # deploy still holds the old variant URLs, and "enforce" would 404 them.
  # Flip to "enforce" together with a CDN purge of
  # /rails/active_storage/blobs/* and /rails/active_storage/representations/*.
  OCCASION_ASSET_GUARD: "observe"
  # Whether the job that deletes the files of pictures removed more than 30
  # days ago does anything. It acts only on exactly "true"; it is read when
  # the job runs, and the job has no schedule yet. Leave "false" until a dry
  # run against a production snapshot has been read.
  ASSET_PURGE_ENABLED: "false"
  # Personal notes (abradner/spritz stack #1161): the daily job that hard-deletes
  # the superseded keystroke history of notes delivered 30+ days ago
  # (PersonalNotes::PruneHistoryJob). It deletes only on exactly "true";
  # anything else counts and logs. Read when the job runs (bare ENV.fetch: a
  # missing key raises KeyError daily). REQUIRED before the image that brings
  # the job. Turning it on is a runbook (spritz .agents/personal_notes.md,
  # "Turning the history prune on") and Alex's call; this lands it "false".
  PERSONAL_NOTES_PRUNE_ENABLED: "false"
  # Personal notes (abradner/spritz stack #1161): where personal-note email may
  # go outside production (PersonalNotes::MailGuard). Staging sends REAL email
  # and, after a refresh from production, holds real guests' addresses, so
  # this is an allowlist: comma-separated addresses, "@domain", or "*". ""
  # sends none. Read when an email is built; a missing key makes every
  # personal-notes send on staging raise. REQUIRED before the image.
  # DECISION FOR ALEX: "" (no note email on staging) or his own test
  # addresses, e.g. "alex@bradner.net".
  PERSONAL_NOTES_MAIL_ALLOWLIST: ""
  # The Host the video transcoder's in-cluster calls arrive on (it calls the
  # web Service by name, http://spritz-web/). abradner/spritz #1093 exempts
  # /api/transcoder/* on exactly this host from the canonical-host redirect
  # and host authorization; every other path on it is still redirected.
  # REQUIRED and non-blank at boot by app images from that PR onward, in every
  # process. Older images ignore it, so it lands before the image.
  TRANSCODER_INTERNAL_HOST: spritz-web
  # OpenTelemetry (spritz tracing): ON for staging. Spans and product events
  # go to the in-cluster collector (cluster/core/observability/
  # otel-collector-app.yaml), which scrubs, samples and forwards them to the
  # obs-traces store outside the cluster. The Rails initializer starts the
  # SDK only when this endpoint is set, and every span leaves the app through
  # its scrubbing exporter (spritz .agents/observability_tracing.md).
  # Production stays OFF: its config.yaml has no endpoint.
  #
  # OFF SWITCH: delete the endpoint line and restart the pods (or set
  # OTEL_SDK_DISABLED=true). The protocol below is inert without an
  # endpoint, and inert on images without the OTel gems (spritz phase 1).
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  CANONICAL_HOST: staging.rabalex.wedding
  # The host every guest-facing link is built on (/t/, /day/, /n/, /s/,
  # unsubscribe, QR codes): abradner/spritz GuestHost. A bare host name, no
  # scheme. REQUIRED at boot by app images from the guest-host PR onward, in
  # every process; older images ignore it, so it lands BEFORE the image.
  # Equal to CANONICAL_HOST, the app behaves exactly as before: one host, no
  # fence. Flip it to the spritz.rsvp name only once that host's listener,
  # certificate and DNS answer (cluster/core/networking).
  GUEST_HOST: staging.rabalex.wedding
  CONTACT_EMAIL: alex@bradner.net
  FROM_EMAIL: noreply@rabalex.wedding
  # Interim relay: Gmail (app password in the spritz-staging 1Password item;
  # SMTP_USERNAME is the full Gmail address). Port 587/STARTTLS is hardcoded
  # in the Rails env config, which matches Gmail. Caveats until a real
  # transactional mailer replaces this: Gmail rewrites the From header to
  # the authenticated account unless FROM_EMAIL is a configured send-as
  # alias, and daily send caps are low (~500).
  SMTP_ADDRESS: smtp.gmail.com
  SMTP_DOMAIN: rabalex.wedding
  # Cloudflare Turnstile *site* key for the guest portal's magic-link
  # recovery form — same key as production (one shared "Turnstile:
  # Spritz.events" widget; see the note in ../../spritz-production/spritz/
  # config.yaml). staging.rabalex.wedding must be on the key's hostname
  # allowlist in the Cloudflare dashboard.
  TURNSTILE_SITE_KEY: "0x4AAAAAAD-Hh32Z1mJG3Jb2"
  # staging.rb uses in-process async adapters — no Solid Queue supervisor.
  TEMPORAL_HOST_PORT: temporal-frontend.spritz-staging.svc.cluster.local:7233
  TEMPORAL_NAMESPACE: spritz
  MAILER_HOST: staging.rabalex.wedding
  # WhatsApp is OFF in the cluster for now. config/initializers/whatsapp.rb
  # fail-fasts on WHATSAPP_ACCESS_TOKEN unless this is false, and those
  # tokens are not in the spritz-* 1Password items yet. Production already
  # ran with it false on the VM; STAGING DID NOT — staging genuinely uses
  # WhatsApp, so this is a temporary reduction there, not parity. Restore by
  # adding the tokens to 1Password and the ExternalSecret, then flipping to
  # true.
  WHATSAPP_ENABLED: "false"
