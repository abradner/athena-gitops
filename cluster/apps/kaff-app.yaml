---
# kaff (github.com/abradner/kaff), served at kaff.asn.casa. Web + a Temporal
# worker sharing the same image, against the shared temporal cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kaff
  namespace: argocd
spec:
  project: workloads
  source:
    repoURL: 'https://github.com/abradner/athena-gitops.git'
    targetRevision: main
    path: cluster/apps/kaff
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kaff
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
