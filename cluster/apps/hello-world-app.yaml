---
# The hello-world canary: exercises the full path (gateway → route → pods)
# plus an ExternalSecret against the 1Password backend. Owning it via its
# own Application (cluster-apps excludes the hello-world/ subtree) means it
# can be paused, pruned, or broken without touching anything else.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-world
  namespace: argocd
spec:
  project: core
  source:
    repoURL: 'https://github.com/abradner/athena-gitops.git'
    targetRevision: main
    path: cluster/apps/hello-world
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
