---
# Mickleham Campground booking site (github.com/abradner/mcg), served at
# mcg.rest. Own Application so it can be paused independently.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mcg
  namespace: argocd
spec:
  project: workloads
  source:
    repoURL: 'https://github.com/abradner/athena-gitops.git'
    targetRevision: main
    path: cluster/apps/mcg
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: mcg
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
