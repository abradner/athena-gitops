---
# Counta (github.com/abradner/counta) — pen/dose click counter, served at
# counta.click. Own Application so it can be paused independently. This is
# a real cutover: the Pi dev-server currently serving counta.click retires
# once this is live (counta issue #10 / R-005) — see the PR checklist.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: counta
  namespace: argocd
spec:
  project: workloads
  source:
    repoURL: 'https://github.com/abradner/athena-gitops.git'
    targetRevision: main
    path: cluster/apps/counta
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: counta
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
