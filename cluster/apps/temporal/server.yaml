---
# Temporal server, lightweight single-node deployment (all four services in
# one process — the temporalio/server image's default). Persistence lives on
# the managed Postgres; schemas are maintained by the PreSync hook
# (schema-setup-job.yaml). Mirrors the docker-compose stack spritz ran on
# Portainer, so behaviour is known-good — swap to the official Helm chart if
# per-service scaling ever matters.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-server
  namespace: temporal
spec:
  replicas: 1
  strategy:
    # Membership is single-node; don't run two servers against the same
    # shard tables during rollouts.
    type: Recreate
  selector:
    matchLabels:
      app: temporal-server
  template:
    metadata:
      labels:
        app: temporal-server
    spec:
      containers:
        - name: server
          image: temporalio/server:1.31.2
          ports:
            - name: frontend
              containerPort: 7233
          env:
            - name: DB
              value: postgresql
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_SEEDS
              value: postgres.infra.asn.casa
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: temporal-db
                  key: username
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: temporal-db
                  key: password
            - name: DBNAME
              value: temporal
            - name: VISIBILITY_DBNAME
              value: temporal_visibility
            - name: BIND_ON_IP
              value: 0.0.0.0
          readinessProbe:
            tcpSocket:
              port: 7233
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7233
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-frontend
  namespace: temporal
spec:
  selector:
    app: temporal-server
  ports:
    - name: grpc
      port: 7233
      targetPort: 7233
