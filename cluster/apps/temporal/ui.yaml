---
# Temporal Web UI. NOTE: the UI has no built-in auth — it is exposed on the
# athena wildcard listener like Headlamp, but unlike Headlamp there is no
# token gate. Delete the HTTPRoute below (and reach it via port-forward) if
# that listener is internet-reachable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  namespace: temporal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-ui
  template:
    metadata:
      labels:
        app: temporal-ui
    spec:
      containers:
        - name: ui
          image: temporalio/ui:2.52.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal-frontend.temporal.svc.cluster.local:7233
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
  namespace: temporal
spec:
  selector:
    app: temporal-ui
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: temporal-ui
  namespace: temporal
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: default
      sectionName: https-athena
  hostnames:
    - "temporal.athena.asn.casa"
  rules:
    - backendRefs:
        - name: temporal-ui
          port: 80
