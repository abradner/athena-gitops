---
# Credentials for the managed Postgres (postgres.infra.asn.casa). The role needs
# CREATEDB — the schema-setup hook creates the `temporal` and
# `temporal_visibility` databases on first sync.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: temporal-db
  namespace: temporal
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: temporal-db
  data:
    - secretKey: username
      remoteRef:
        key: "temporal-db/username"
    - secretKey: password
      remoteRef:
        key: "temporal-db/password"
