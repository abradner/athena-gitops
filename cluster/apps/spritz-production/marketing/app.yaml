---
# spritz marketing site (production) — spritz.events. A static Astro build served by
# Caddy on distroless (marketing/Dockerfile in abradner/spritz). No shell, no
# package manager: nothing to exec into, and health is an HTTP probe rather
# than a HEALTHCHECK.
#
# The site content is baked into the image at build time — the Turnstile
# *site* key, and now also the crm contact endpoint and the spritz property
# key — so there is no volume, no bucket and no Secret here; the only
# pull-time credential is the namespace's existing ghcr-pull. A rotation of
# any of those three needs a rebuild, not just a restart.
#
# This pin no longer has to match spritz-web in ../spritz, and this stanza
# previously said it did. The stated reason was that "the contact form posts
# to the Rails app's /api/public/contact_submissions" — which stopped being
# true when the form was cut over to crm (inbox.simplytics.ai) in
# abradner/spritz#437. The contact form now posts cross-origin to a different
# app entirely, gated by that app's per-property CORS allowlist, so nothing
# in this Deployment depends on the Rails app's version.
#
# The two images are still BUILT and published in lockstep by one workflow
# (.github/workflows/docker.yml), which is a fact about the build, not a
# deployment constraint. What remains coupled to spritz-web is the EOI form,
# which still posts to /api/public/eoi_submissions through the Gateway — but
# that path has not changed and is not version-sensitive.
#
# Consequence worth knowing: spritz.events must be in the spritz-events-inbound
# Property's allowed_origins in crm, or the contact form fails CORS — which a
# visitor experiences as a lost message, not an error.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spritz-marketing
  namespace: spritz-production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spritz-marketing
  template:
    metadata:
      labels:
        app: spritz-marketing
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: web
          image: ghcr.io/abradner/spritz-marketing:sha-094676fa99aaea4b8283d3b403e7c610f94e1756
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # Caddy binds :8080 (marketing/Caddyfile) — above 1024 so the
          # nonroot user needs no capability, and TLS terminates at the
          # Gateway, so this speaks plain HTTP.
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: spritz-marketing
  namespace: spritz-production
spec:
  selector:
    app: spritz-marketing
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
# Reproduces the HAProxy split for spritz.events: /api/* to the Rails app,
# everything else to the static site. HAProxy needed the api ACL tested
# first because its use_backend lines are evaluated in order; Gateway API
# instead picks the most specific match, so the longer /api/ prefix wins
# over / regardless of the order these rules appear in.
#
# spritz-web lives in this same namespace but belongs to a different Argo
# Application (../spritz), which is why this route is safe to sync
# independently — the Service it names already exists.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: spritz-marketing
  namespace: spritz-production
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: default
      sectionName: https-spritz-events
    # Public: also attached to the tunnel listener (:8443). This records
    # intent and keeps the route working if attachment ever becomes
    # spec-strict. It is NOT a security control — Cilium serves every route
    # on this Gateway through that hostname-less listener regardless of
    # sectionName (measured, see cluster/core/networking/gateway.yaml). What
    # keeps internal hostnames off the tunnel is the asn.casa deny rule.
    - name: homelab-gateway
      namespace: default
      sectionName: https-tunnel
  hostnames:
    - "spritz.events"
  rules:
    # The contact form posts to /api/public/contact_submissions, and the
    # Turnstile secret half only exists in the Rails app — so this half of
    # the split is what makes the form work at all.
    - matches:
        - path:
            type: PathPrefix
            value: /api/
      backendRefs:
        - name: spritz-web
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: spritz-marketing
          port: 80
