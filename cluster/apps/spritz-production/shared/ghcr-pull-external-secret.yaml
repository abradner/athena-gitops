---
# Pull secret for ghcr.io — shared `ghcr-pull` 1Password item (username +
# token with read:packages). One instance per namespace, owned here so the
# app Applications don't each try to manage an identical copy.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: spritz-production
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        ".dockerconfigjson": '{"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}"}}}'
  data:
    - secretKey: username
      remoteRef:
        key: "ghcr-pull/username"
    - secretKey: token
      remoteRef:
        key: "ghcr-pull/token"
