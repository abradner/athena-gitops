---
# PostSync hook: register the Temporal namespaces the spritz-production apps use.
# Idempotent (`|| true` on already-exists). Add a line when an app onboards.
apiVersion: batch/v1
kind: Job
metadata:
  name: temporal-register-namespaces
  namespace: spritz-production
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: register
          image: temporalio/admin-tools:1.31
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal-frontend.spritz-production.svc.cluster.local:7233
          command:
            - sh
            - -c
            - |
              until temporal operator cluster health | grep -q 'SERVING'; do sleep 2; done
              temporal operator namespace create -n spritz || true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
