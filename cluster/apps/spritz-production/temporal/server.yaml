---
# Temporal server, lightweight single-node deployment (all four services in
# one process — the temporalio/server image's default). Persistence lives on
# the managed Postgres; schemas are maintained by the Sync-hook Job
# (schema-setup-job.yaml). One instance per namespace — spritz-production apps only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-server
  namespace: spritz-production
  annotations:
    # After the schema-setup Sync hook (wave 1) — schemas exist before boot.
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    # Membership is single-node; don't run two servers against the same
    # shard tables during rollouts.
    type: Recreate
  selector:
    matchLabels:
      app: temporal-server
  template:
    metadata:
      labels:
        app: temporal-server
    spec:
      containers:
        - name: server
          image: temporalio/server:1.31.2
          ports:
            - name: frontend
              containerPort: 7233
          env:
            # config_template.yaml accepts only cassandra|mysql8|postgres12|
            # postgres12_pgx — "postgresql" silently renders no persistence
            # block at all.
            - name: DB
              value: postgres12
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_SEEDS
              value: postgres.infra.asn.casa
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: temporal-db
                  key: username
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: temporal-db
                  key: password
            - name: DBNAME
              value: temporal_spritz_production
            - name: VISIBILITY_DBNAME
              value: temporal_spritz_production_visibility
            - name: BIND_ON_IP
              value: 0.0.0.0
          readinessProbe:
            tcpSocket:
              port: 7233
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7233
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-frontend
  namespace: spritz-production
spec:
  selector:
    app: temporal-server
  ports:
    - name: grpc
      port: 7233
      targetPort: 7233
