---
# Solid Queue supervisor, extracted from Puma.
#
# It previously ran in-process via SOLID_QUEUE_IN_PUMA. That was correct for a
# single always-on server, but not once the web Deployment autoscales: job
# capacity would become a side effect of web traffic, scaling 2->5 and back,
# and the recurring scheduler in config/recurring.yml would run in every
# replica.
#
# Kept at one replica. Concurrency belongs in config/queue.yml (JOB_CONCURRENCY
# processes x 3 threads), not in the replica count — Solid Queue claims work
# with FOR UPDATE SKIP LOCKED, so more replicas is safe but is the wrong dial.
#
# The one exception is image variant rendering, which is bounded per CONTAINER
# (one libvips render each) and so scales by containers: see
# spritz-variant-workers at the bottom of this file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spritz-solid-queue
  namespace: spritz-production
spec:
  replicas: 1
  strategy:
    # Never run two supervisors at once, even briefly. Recreate keeps the
    # recurring scheduler single-writer across a rollout.
    type: Recreate
  selector:
    matchLabels:
      app: spritz-solid-queue
  template:
    metadata:
      labels:
        app: spritz-solid-queue
        # Shared with spritz-variant-workers, whose spread constraint counts
        # this pod too: it renders variants as well, so the three renderers
        # should be on three nodes.
        spritz/render-pool: variants
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: jobs
          image: ghcr.io/abradner/spritz:v202610071215@sha256:9b4469a8fff8d560a0563c83d4f8c7378a54bfa360306fb1449b3f09bd5e9b7e
          imagePullPolicy: IfNotPresent
          args: ["bin/jobs"]
          ports:
            # Supervisor-process exporter (config/initializers/
            # solid_queue_metrics.rb in the app): supervisor GC stats,
            # queue-state gauges, per-role RSS for the forked processes.
            - name: metrics
              containerPort: 9394
          env:
            - name: SOLID_QUEUE_METRICS_ADDR
              value: 0.0.0.0:9394
          envFrom:
            - configMapRef:
                name: spritz-config
            - secretRef:
                name: spritz-app
            # Per-zone overrides, last so they win. Absent on the primary, where
            # `optional` makes it a no-op; present in a secondary zone to point
            # the app at that zone's own data tier. Keys not mentioned here fall
            # through to spritz-config unchanged.
            - configMapRef:
                name: cluster-overrides
                optional: true
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              # This pod renders guest photo variants as well as running the
              # supervisor. Guest photos are kept as the phone took them, up to
              # 52MP; measured on a real 48MP iPhone HEIC, three variants peak
              # at about 625 MB in the rendering process, and the app allows
              # ONE render per container. The pod idles near 700Mi, so
              # 700 + 625 (670 at the 52MP cap) is about 1.4Gi: inside the old
              # 1536Mi with nothing to spare. 2560Mi leaves a render's worth of
              # headroom.
              memory: 2560Mi

---
# Extra renderers for Active Storage variants: worker-only Solid Queue
# processes on the `variants` queue (config/queue_variants.yml in the app).
#
# Why this exists. The app allows three variant renders at once across the
# cluster and exactly one per container (GuestMedia::VariantRendering), because
# a 24MP HEIC decode peaks near 600MiB and the queue pod idles near 700MiB of
# its 1536Mi. With only the supervisor pod above, two of the three slots can
# never be used; measured on these nodes that is about six full-size photos a
# minute, against a wedding's worth of guests uploading at once. Each replica
# here is one more render at a time, on its own node's CPU.
#
# Why a second Deployment rather than `replicas: 3` on the supervisor. That
# pod also runs the dispatcher and the recurring scheduler, and is Recreate so
# that there is only ever one of them. These pods run neither: no dispatcher
# in their config, and SOLID_QUEUE_SKIP_RECURRING stops the scheduler.
#
# They are optional capacity. The supervisor's own worker takes `variants`
# too, so scaling this to zero slows rendering and breaks nothing. More than
# two replicas buys nothing until the app's slot count (3) is raised.
#
# Same file as the supervisor on purpose: deimos excludes solid-queue.yaml,
# and a renderer with no writable database there would only fail.
#
# NEEDS an image that contains config/queue_variants.yml (abradner/spritz
# #942); on an older image this container exits at boot.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spritz-variant-workers
  namespace: spritz-production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spritz-variant-worker
  template:
    metadata:
      labels:
        app: spritz-variant-worker
        spritz/render-pool: variants
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      # One renderer per node, counting the supervisor pod. Soft: a renderer
      # doubling up on a node is slower, not wrong, and beats one left Pending
      # when a node is down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              spritz/render-pool: variants
      containers:
        - name: jobs
          image: ghcr.io/abradner/spritz:v202610071215@sha256:9b4469a8fff8d560a0563c83d4f8c7378a54bfa360306fb1449b3f09bd5e9b7e
          imagePullPolicy: IfNotPresent
          args: ["bin/jobs"]
          env:
            - name: SOLID_QUEUE_CONFIG
              value: config/queue_variants.yml
            - name: SOLID_QUEUE_SKIP_RECURRING
              value: "true"
          envFrom:
            - configMapRef:
                name: spritz-config
            - secretRef:
                name: spritz-app
            - configMapRef:
                name: cluster-overrides
                optional: true
          resources:
            requests:
              # A render uses every core libvips can get for a few seconds;
              # the request is the idle floor, not the peak.
              cpu: 100m
              memory: 384Mi
            limits:
              # One render per container (the app's lock), up to about 670 MB
              # for a 52MP photo, on a worker-only process that idles well
              # under the supervisor's 700Mi.
              memory: 2048Mi

---
# Kept in this file rather than monitoring.yaml so that a zone which excludes
# the Deployment excludes its scrape with it. See temporal-worker.yaml.
# The solid-queue pod runs bin/jobs (no Puma), so the yabeda Puma plugins
# never start there. Its exporter is the supervisor-process one in the app's
# config/initializers/solid_queue_metrics.rb, gated on
# SOLID_QUEUE_METRICS_ADDR in the Deployment — supervisor GC stats,
# queue-state gauges, and per-role RSS for the forked dispatcher/workers.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: spritz-solid-queue
  namespace: spritz-production
spec:
  selector:
    matchLabels:
      app: spritz-solid-queue
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
