---
# spritz web (production). Entrypoint runs db:prepare on `rails server`, so
# migrations apply on rollout (web container only — the worker never
# triggers it).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spritz-web
  namespace: spritz-production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spritz-web
  template:
    metadata:
      labels:
        app: spritz-web
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: web
          image: ghcr.io/abradner/spritz:v202608231625@sha256:0d8995041364952059c170dba8bd673b40c8a8c9bc11fed5376956ae4bdb99f6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Thruster defaults to :80, which a non-root container can't bind
            # under Kubernetes (unprivileged port start is 1024).
            - name: HTTP_PORT
              value: "8080"
          envFrom:
            - configMapRef:
                name: spritz-config
            - secretRef:
                name: spritz-app
          readinessProbe:
            httpGet:
              path: /up
              port: 8080
              # Without an explicit Host the probe arrives as
              # http://<podIP>:8080/up, Rails redirects to CANONICAL_HOST,
              # and kubelet logs a ProbeWarning every cycle. The 3xx counts
              # as success, so this is noise rather than a failure — but it
              # buries real probe events.
              httpHeaders:
                - name: Host
                  value: rabalex.wedding
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /up
              port: 8080
              # Without an explicit Host the probe arrives as
              # http://<podIP>:8080/up, Rails redirects to CANONICAL_HOST,
              # and kubelet logs a ProbeWarning every cycle. The 3xx counts
              # as success, so this is noise rather than a failure — but it
              # buries real probe events.
              httpHeaders:
                - name: Host
                  value: rabalex.wedding
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
---
# Temporal worker — same image, run via rake.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spritz-temporal-worker
  namespace: spritz-production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spritz-temporal-worker
  template:
    metadata:
      labels:
        app: spritz-temporal-worker
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: worker
          image: ghcr.io/abradner/spritz:v202608231625@sha256:0d8995041364952059c170dba8bd673b40c8a8c9bc11fed5376956ae4bdb99f6
          imagePullPolicy: IfNotPresent
          args: ["bundle", "exec", "rake", "temporal:run_worker"]
          envFrom:
            - configMapRef:
                name: spritz-config
            - secretRef:
                name: spritz-app
          resources:
            requests:
              cpu: 25m
              memory: 384Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: spritz-web
  namespace: spritz-production
spec:
  selector:
    app: spritz-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: spritz
  namespace: spritz-production
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: default
      sectionName: https-rabalex
  hostnames:
    - "rabalex.wedding"
  rules:
    - backendRefs:
        - name: spritz-web
          port: 80
