---
# spritz web (production). Entrypoint runs db:prepare on `rails server`, so
# migrations apply on rollout (web container only — the worker never
# triggers it).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spritz-web
  namespace: spritz-production
spec:
  # No `replicas` here on purpose — the HorizontalPodAutoscaler in hpa.yaml
  # owns it. Declaring it in git would have Argo's selfHeal reset the count on
  # every reconcile and fight the autoscaler.
  selector:
    matchLabels:
      app: spritz-web
  template:
    metadata:
      labels:
        app: spritz-web
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: web
          image: ghcr.io/abradner/spritz:v202608260013@sha256:bc0d1fc2f1cbce328da0f6daeca91e7907d0c61daff22ae80d7121b8bdfed82f
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            # yabeda exporter — cluster-internal only, scraped by vmagent
            # (see monitoring.yaml). Never routed by Thruster or the ingress.
            - name: metrics
              containerPort: 9394
          env:
            # Thruster defaults to :80, which a non-root container can't bind
            # under Kubernetes (unprivileged port start is 1024).
            - name: HTTP_PORT
              value: "8080"
          envFrom:
            - configMapRef:
                name: spritz-config
            - secretRef:
                name: spritz-app
          readinessProbe:
            httpGet:
              path: /up
              port: 8080
              # Without an explicit Host the probe arrives as
              # http://<podIP>:8080/up, Rails redirects to CANONICAL_HOST,
              # and kubelet logs a ProbeWarning every cycle. The 3xx counts
              # as success, so this is noise rather than a failure — but it
              # buries real probe events.
              httpHeaders:
                - name: Host
                  value: rabalex.wedding
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /up
              port: 8080
              # Without an explicit Host the probe arrives as
              # http://<podIP>:8080/up, Rails redirects to CANONICAL_HOST,
              # and kubelet logs a ProbeWarning every cycle. The 3xx counts
              # as success, so this is noise rather than a failure — but it
              # buries real probe events.
              httpHeaders:
                - name: Host
                  value: rabalex.wedding
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              # At or above observed steady state, so the scheduler reserves
              # what the pod actually holds rather than letting a node accept
              # neighbours it cannot honour.
              memory: 1Gi
            limits:
              # Active Storage variants are generated lazily in the request
              # (Occasion declares them without preprocessed: true), so libvips
              # runs in-process and spikes well above steady state. A limit set
              # just above steady state gets OOMKilled by that spike, which is
              # what 1Gi did under production load. The ceiling has to clear the
              # peak, not the average.
              memory: 2Gi
---
# Temporal worker — same image, run via rake.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spritz-temporal-worker
  namespace: spritz-production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spritz-temporal-worker
  template:
    metadata:
      labels:
        app: spritz-temporal-worker
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: worker
          image: ghcr.io/abradner/spritz:v202608260013@sha256:bc0d1fc2f1cbce328da0f6daeca91e7907d0c61daff22ae80d7121b8bdfed82f
          imagePullPolicy: IfNotPresent
          args: ["bundle", "exec", "rake", "temporal:run_worker"]
          ports:
            # Temporal SDK core Prometheus endpoint (see monitoring.yaml).
            - name: metrics
              containerPort: 9464
          env:
            - name: TEMPORAL_METRICS_ADDR
              value: 0.0.0.0:9464
          envFrom:
            - configMapRef:
                name: spritz-config
            - secretRef:
                name: spritz-app
          resources:
            requests:
              cpu: 25m
              memory: 384Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: spritz-web
  namespace: spritz-production
  labels:
    # VMServiceScrape (monitoring.yaml) selects the Service by this label.
    app: spritz-web
spec:
  selector:
    app: spritz-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: metrics
      port: 9394
      targetPort: 9394
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: spritz
  namespace: spritz-production
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: default
      sectionName: https-rabalex
  hostnames:
    - "rabalex.wedding"
  rules:
    - backendRefs:
        - name: spritz-web
          port: 80
---
# Solid Queue supervisor, extracted from Puma.
#
# It previously ran in-process via SOLID_QUEUE_IN_PUMA. That was correct for a
# single always-on server, but not once the web Deployment autoscales: job
# capacity would become a side effect of web traffic, scaling 2->5 and back,
# and the recurring scheduler in config/recurring.yml would run in every
# replica.
#
# Kept at one replica. Concurrency belongs in config/queue.yml (JOB_CONCURRENCY
# processes x 3 threads), not in the replica count — Solid Queue claims work
# with FOR UPDATE SKIP LOCKED, so more replicas is safe but is the wrong dial.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spritz-solid-queue
  namespace: spritz-production
spec:
  replicas: 1
  strategy:
    # Never run two supervisors at once, even briefly. Recreate keeps the
    # recurring scheduler single-writer across a rollout.
    type: Recreate
  selector:
    matchLabels:
      app: spritz-solid-queue
  template:
    metadata:
      labels:
        app: spritz-solid-queue
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: jobs
          image: ghcr.io/abradner/spritz:v202608260013@sha256:bc0d1fc2f1cbce328da0f6daeca91e7907d0c61daff22ae80d7121b8bdfed82f
          imagePullPolicy: IfNotPresent
          args: ["bin/jobs"]
          ports:
            # Supervisor-process exporter (config/initializers/
            # solid_queue_metrics.rb in the app): supervisor GC stats,
            # queue-state gauges, per-role RSS for the forked processes.
            - name: metrics
              containerPort: 9394
          env:
            - name: SOLID_QUEUE_METRICS_ADDR
              value: 0.0.0.0:9394
          envFrom:
            - configMapRef:
                name: spritz-config
            - secretRef:
                name: spritz-app
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              # AnalyzeJob drives libvips for Active Storage metadata, which is
              # the same memory-spiky work that OOMKilled the web container at
              # 1Gi. Give it comparable headroom rather than the worker's 768Mi.
              memory: 1536Mi
