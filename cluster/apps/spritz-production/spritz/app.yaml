---
# spritz web (production). Entrypoint runs db:prepare on `rails server`, so
# migrations apply on rollout (web container only — the worker never
# triggers it).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spritz-web
  namespace: spritz-production
spec:
  # No `replicas` here on purpose — the HorizontalPodAutoscaler in hpa.yaml
  # owns it. Declaring it in git would have Argo's selfHeal reset the count on
  # every reconcile and fight the autoscaler.
  selector:
    matchLabels:
      app: spritz-web
  template:
    metadata:
      labels:
        app: spritz-web
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: web
          image: ghcr.io/abradner/spritz:v202609110838@sha256:9138197efe3a6f9ac61283775ba3f880ca8d666744deee9b3346277e1bc5a7e9
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            # yabeda exporter — cluster-internal only, scraped by vmagent
            # (see monitoring.yaml). Never routed by Thruster or the ingress.
            - name: metrics
              containerPort: 9394
          env:
            # Thruster defaults to :80, which a non-root container can't bind
            # under Kubernetes (unprivileged port start is 1024).
            - name: HTTP_PORT
              value: "8080"
            # Explicit cap on request bodies at Thruster, ahead of Rails —
            # covers the photo bingo guest upload path (up to 12 MB photos).
            - name: MAX_REQUEST_BODY
              value: "20971520" # 20 MiB
          envFrom:
            - configMapRef:
                name: spritz-config
            - secretRef:
                name: spritz-app
            # Per-zone overrides, last so they win. Absent on the primary, where
            # `optional` makes it a no-op; present in a secondary zone to point
            # the app at that zone's own data tier. Keys not mentioned here fall
            # through to spritz-config unchanged.
            - configMapRef:
                name: cluster-overrides
                optional: true
          readinessProbe:
            httpGet:
              path: /up
              port: 8080
              # Without an explicit Host the probe arrives as
              # http://<podIP>:8080/up, Rails redirects to CANONICAL_HOST,
              # and kubelet logs a ProbeWarning every cycle. The 3xx counts
              # as success, so this is noise rather than a failure — but it
              # buries real probe events.
              httpHeaders:
                - name: Host
                  value: rabalex.wedding
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /up
              port: 8080
              # Without an explicit Host the probe arrives as
              # http://<podIP>:8080/up, Rails redirects to CANONICAL_HOST,
              # and kubelet logs a ProbeWarning every cycle. The 3xx counts
              # as success, so this is noise rather than a failure — but it
              # buries real probe events.
              httpHeaders:
                - name: Host
                  value: rabalex.wedding
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              # At or above observed steady state, so the scheduler reserves
              # what the pod actually holds rather than letting a node accept
              # neighbours it cannot honour.
              memory: 1Gi
            limits:
              # Active Storage variants are generated lazily in the request
              # (Occasion declares them without preprocessed: true), so libvips
              # runs in-process and spikes well above steady state. A limit set
              # just above steady state gets OOMKilled by that spike, which is
              # what 1Gi did under production load. The ceiling has to clear the
              # peak, not the average.
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: spritz-web
  namespace: spritz-production
  labels:
    # VMServiceScrape (monitoring.yaml) selects the Service by this label.
    app: spritz-web
spec:
  selector:
    app: spritz-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: metrics
      port: 9394
      targetPort: 9394
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: spritz
  namespace: spritz-production
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: default
      sectionName: https-rabalex
    # Public: also attached to the tunnel listener (:8443). This records
    # intent and keeps the route working if attachment ever becomes
    # spec-strict. It is NOT a security control — Cilium serves every route
    # on this Gateway through that hostname-less listener regardless of
    # sectionName (measured, see cluster/core/networking/gateway.yaml). What
    # keeps internal hostnames off the tunnel is the asn.casa deny rule.
    - name: homelab-gateway
      namespace: default
      sectionName: https-tunnel
  hostnames:
    - "rabalex.wedding"
  rules:
    - backendRefs:
        - name: spritz-web
          port: 80
