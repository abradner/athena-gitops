---
# vmagent scrape wiring for spritz. The VMAgent CR (vm-stack-app.yaml) runs
# with selectAllByDefault, so these CRs are picked up from this namespace
# without any extra selector plumbing.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: spritz-web
  namespace: spritz-production
spec:
  selector:
    matchLabels:
      app: spritz-web
  endpoints:
    - port: metrics
      path: /metrics
---
# The Temporal worker has no Service — scrape the pod directly. The port
# name refers to the containerPort named `metrics` (9464) on the worker.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: spritz-temporal-worker
  namespace: spritz-production
spec:
  selector:
    matchLabels:
      app: spritz-temporal-worker
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
---
# The solid-queue pod runs bin/jobs (no Puma), so the yabeda Puma plugins
# never start there. Its exporter is the supervisor-process one in the app's
# config/initializers/solid_queue_metrics.rb, gated on
# SOLID_QUEUE_METRICS_ADDR in the Deployment — supervisor GC stats,
# queue-state gauges, and per-role RSS for the forked dispatcher/workers.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: spritz-solid-queue
  namespace: spritz-production
spec:
  selector:
    matchLabels:
      app: spritz-solid-queue
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
