---
# Temporal worker — same image, run via rake.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spritz-temporal-worker
  namespace: spritz-production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spritz-temporal-worker
  template:
    metadata:
      labels:
        app: spritz-temporal-worker
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: worker
          image: ghcr.io/abradner/spritz:v202609210619@sha256:f22cc44bdd20f52a0faf0cd4ced09796a6c1f8809a19fad3fc818c606b208967
          imagePullPolicy: IfNotPresent
          args: ["bundle", "exec", "rake", "temporal:run_worker"]
          ports:
            # Temporal SDK core Prometheus endpoint (see monitoring.yaml).
            - name: metrics
              containerPort: 9464
          env:
            - name: TEMPORAL_METRICS_ADDR
              value: 0.0.0.0:9464
          envFrom:
            - configMapRef:
                name: spritz-config
            - secretRef:
                name: spritz-app
            # Per-zone overrides, last so they win. Absent on the primary, where
            # `optional` makes it a no-op; present in a secondary zone to point
            # the app at that zone's own data tier. Keys not mentioned here fall
            # through to spritz-config unchanged.
            - configMapRef:
                name: cluster-overrides
                optional: true
          resources:
            requests:
              cpu: 25m
              memory: 384Mi
            limits:
              memory: 768Mi

---
# Kept in this file rather than monitoring.yaml so that a zone which excludes
# the Deployment excludes its scrape with it. A VMPodScrape with no pods
# behind it is a scrape pool with zero targets, which vmagent reports as a
# misconfiguration — and it is one.
# The Temporal worker has no Service — scrape the pod directly. The port
# name refers to the containerPort named `metrics` (9464) on the worker.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: spritz-temporal-worker
  namespace: spritz-production
spec:
  selector:
    matchLabels:
      app: spritz-temporal-worker
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
