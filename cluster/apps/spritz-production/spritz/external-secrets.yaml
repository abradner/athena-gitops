---
# App secrets from 1Password. `spritz-production` item fields (database ones written by
# scripts/provision_app_db.sh spritz production):
#   database-username / database-password — role spritz_production, CREATEDB
#     (db:prepare creates the primary/cache/queue/cable databases)
#   rails-master-key  — contents of config/master.key
#   secret-key-base   — SECRET_KEY_BASE
#   garage-access-key-id / garage-secret-access-key — garage S3 keypair
#   smtp-username / smtp-password — SMTP credentials (Gmail app password)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spritz-app
  namespace: spritz-production
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: spritz-app
  data:
    - secretKey: SPRITZ_DATABASE_USERNAME
      remoteRef:
        key: "spritz-production/database-username"
    - secretKey: SPRITZ_DATABASE_PASSWORD
      remoteRef:
        key: "spritz-production/database-password"
    - secretKey: RAILS_MASTER_KEY
      remoteRef:
        key: "spritz-production/rails-master-key"
    - secretKey: SECRET_KEY_BASE
      remoteRef:
        key: "spritz-production/secret-key-base"
    - secretKey: GARAGE_ACCESS_KEY_ID
      remoteRef:
        key: "spritz-production/garage-access-key-id"
    - secretKey: GARAGE_SECRET_ACCESS_KEY
      remoteRef:
        key: "spritz-production/garage-secret-access-key"
    - secretKey: SMTP_USERNAME
      remoteRef:
        key: "spritz-production/smtp-username"
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: "spritz-production/smtp-password"
    # Cloudflare Turnstile secret for the contact form. Copied (not moved)
    # from the "Turnstile: Spritz.events" item in AsN Infra — the VMs still
    # serve these sites and share the same key. Verified accepted by
    # Cloudflare's siteverify endpoint before use.
    - secretKey: TURNSTILE_SECRET_KEY
      remoteRef:
        key: "spritz-production/turnstile-secret-key"
