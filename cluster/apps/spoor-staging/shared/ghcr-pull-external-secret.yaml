---
# Pull secret for ghcr.io/simplytics/*: the `ghcr-pull-simplytics` 1Password
# item (LOGIN; `username` and `token`, a read:packages token; its `password`
# field is empty and unused). Separate from the shared `ghcr-pull` item, which
# reads the abradner org's packages.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: spoor-staging
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        ".dockerconfigjson": '{"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}"}}}'
  data:
    - secretKey: username
      remoteRef:
        key: "ghcr-pull-simplytics/username"
    - secretKey: token
      remoteRef:
        key: "ghcr-pull-simplytics/token"
