---
# Spoor's sample emitter (staging): demo traffic for the dashboard, per
# Simplytics/spoor services/sample-emitter/README.md. Every 15 minutes it
# publishes the sample registry to the portal and sends synthetic events
# through Spoor's public ingest (ingest-staging.spoor.observer), as a host would.
#
# Credentials: the ExternalSecret `spoor-sample-emitter` (external-secrets.yaml)
# from the `simplytics-staging` item's `sample-emitter-token` (-> SPOOR_TOKEN, a
# registry_publish credential for spoor-sample/staging),
# `sample-emitter-ingest-token` (-> SPOOR_INGEST_TOKEN, an ingest credential for
# spoor-sample/staging; never the same as SPOOR_TOKEN) and
# `sample-emitter-subject-key` (-> SPOOR_SAMPLE_SUBJECT_KEY).
#
# No ClickHouse CA here: it talks only to the portal's and ingest's public https
# origins.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: spoor-sample-emitter
  namespace: spoor-staging
spec:
  schedule: "*/15 * * * *"
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull
          securityContext:
            runAsNonRoot: true
            # The image's `bun` user; numeric so runAsNonRoot can verify it.
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: emit
              image: ghcr.io/simplytics/spoor-sample-emitter:sha-600e042640aa0f223f720d8cee9668271f89d539
              imagePullPolicy: IfNotPresent
              env:
                # https: the token goes to the portal on every run, and the
                # emitter refuses plain http to any host but loopback.
                - name: SPOOR_PORTAL_URL
                  value: "https://app-staging.spoor.observer"
                # https too: the ingest token goes there on every batch.
                - name: SPOOR_INGEST_URL
                  value: "https://ingest-staging.spoor.observer/v1/events"
                - name: SPOOR_ENVIRONMENT
                  value: "staging"
                - name: SPOOR_PROJECT
                  value: "spoor-sample"
              # SPOOR_TOKEN, SPOOR_INGEST_TOKEN and SPOOR_SAMPLE_SUBJECT_KEY (see the
              # header).
              envFrom:
                - secretRef:
                    name: spoor-sample-emitter
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
