---
# Spoor's sample emitter (staging): demo traffic for the dashboard, per
# Simplytics/spoor services/sample-emitter/README.md. Every 15 minutes it
# publishes the sample registry to the portal and sends synthetic events
# through the in-cluster collector.
#
# SUSPENDED: its credential does not exist yet. An admin issues a
# registry_publish credential for spoor-sample/staging after the first deploy
# (deploy.md, "First deploy" step 5). Enabling it is one PR that:
#   1. adds an ExternalSecret `spoor-sample-emitter` from the
#      `simplytics-staging` item, expected fields `sample-emitter-token`
#      (-> SPOOR_TOKEN) and `sample-emitter-subject-key`
#      (-> SPOOR_SAMPLE_SUBJECT_KEY, 32+ random bytes as lowercase hex);
#   2. sets `suspend: false` below.
# The ExternalSecret is not added now: with its fields missing it would sit in
# SecretSyncedError and hold the whole app Degraded, hiding real faults.
#
# No ClickHouse CA here: it talks only to the public https origin and the
# collector over in-cluster http.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: spoor-sample-emitter
  namespace: spoor-staging
spec:
  schedule: "*/15 * * * *"
  # Enabled 14 Nov 2026 with an interim manual Secret `spoor-sample-emitter`
  # (1Password was locked); step 1 above (fields + ExternalSecret) replaces it.
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull
          securityContext:
            runAsNonRoot: true
            # The image's `bun` user; numeric so runAsNonRoot can verify it.
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: emit
              image: ghcr.io/simplytics/spoor-sample-emitter:sha-2b3dc339b0b43fe065b8b376bbcfbec064fad74a
              imagePullPolicy: IfNotPresent
              env:
                # https: the token goes to the portal on every run, and the
                # emitter refuses plain http to any host but loopback.
                - name: SPOOR_PORTAL_URL
                  value: "https://app-staging.spoor.observer"
                - name: SPOOR_OTLP_URL
                  value: "http://spoor-collector.spoor-staging.svc:4318/v1/logs"
                - name: SPOOR_ENVIRONMENT
                  value: "staging"
                - name: SPOOR_PROJECT
                  value: "spoor-sample"
              # SPOOR_TOKEN and SPOOR_SAMPLE_SUBJECT_KEY (see the header).
              envFrom:
                - secretRef:
                    name: spoor-sample-emitter
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
