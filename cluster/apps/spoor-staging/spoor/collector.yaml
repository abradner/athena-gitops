---
# Spoor's OpenTelemetry collector (staging). Ingest is in-cluster only: a
# ClusterIP Service, no route, nothing outside the cluster can post to it.
# Senders (the sample emitter, later the apps) use
# http://spoor-collector.spoor-staging:4318 (OTLP/HTTP) or :4317 (gRPC).
#
# `config.yaml` is Simplytics/spoor infra/collector/otel-collector.yaml
# VERBATIM at d5f7dea8b173ea573ce504a60f777328f53ccc48: replace it whole from
# that repo, never edit it here. It keeps only scope `spoor` log records and
# writes them to ClickHouse over the native TLS port.
#
# ClickHouse: host, port and database from 1Password (spoor-clickhouse-collector),
# never from this repo. The collector writes with its own user (INSERT on the
# transit table only). SSL_CERT_FILE makes Go verify the
# server against the ClickHouse CA (the config has no CA-file option); it
# replaces the system roots, and ClickHouse is the collector's only TLS peer.
#
# A Deployment with one replica: no tail sampling and no disk queue here, so
# nothing pins spans to one pod or one file. contrib, not core: the ClickHouse
# exporter is a contrib component. Pinned by digest (0.164.0, multi-arch).
apiVersion: v1
kind: ConfigMap
metadata:
  name: spoor-collector
  namespace: spoor-staging
data:
  config.yaml: |
    # The OpenTelemetry collector for Spoor's slice 1 path (contract/README.md,
    # "The envelope as OTLP"): hosts send product events as OTLP logs; a pipeline
    # of Spoor's own keeps only records whose scope is `spoor` and writes them to
    # ClickHouse's Null transit table, where the views type them into spoor_events.
    #
    # Spoor events never share a general logs pipeline: an app's own logs landing
    # in a Null table would vanish silently. Anything that is not scope `spoor` is
    # dropped here.
    #
    # Where ClickHouse is comes only from the environment, so this one file serves
    # local compose (infra/local/compose.yaml sets the values) and a deployment
    # alike; ClickHouse runs in its own container outside the cluster (D10).
    #   CLICKHOUSE_HOST         ClickHouse host (native protocol)
    #   CLICKHOUSE_NATIVE_PORT  the port ClickHouse listens on (9000, or 9440
    #                           with TLS); not the compose host port
    #   CLICKHOUSE_SECURE       true for TLS, false otherwise
    #   CLICKHOUSE_DATABASE     spoor
    #   CLICKHOUSE_USER         the collector's user (INSERT on the transit table
    #                           only)
    #   CLICKHOUSE_PASSWORD     its password (empty for local compose)
    # The collector expands an unset variable to "", and clickhouse-go would then
    # dial localhost and sign in as ClickHouse's `default` user (and database).
    # So the host, user and database fall back to sentinels that cannot work: a
    # missing host fails to resolve, a missing user is refused by any server, and
    # a missing database names none that exists. The D10 container
    # should disable `default` regardless.
    # Health, for the deployment to watch:
    #   - readiness: the health_check extension answers 200 on :13133 once the
    #     pipeline is up. It does not prove ClickHouse is reachable.
    #   - ClickHouse unreachable: the collector's own metrics on :8888
    #     (Prometheus). infra/clickhouse/README.md has the alert rules.
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      filter/spoor_only:
        error_mode: propagate
        logs:
          log_record:
            - instrumentation_scope.name != "spoor"
      batch:
        timeout: 1s

    exporters:
      clickhouse/spoor:
        endpoint: tcp://${env:CLICKHOUSE_HOST:-clickhouse-host-unset}:${env:CLICKHOUSE_NATIVE_PORT}?dial_timeout=10s&secure=${env:CLICKHOUSE_SECURE}
        database: ${env:CLICKHOUSE_DATABASE:-clickhouse_database_unset}
        username: ${env:CLICKHOUSE_USER:-clickhouse_user_unset}
        password: ${env:CLICKHOUSE_PASSWORD}
        logs_table_name: spoor_otel_logs
        create_schema: false
        async_insert: false
        timeout: 10s
        retry_on_failure:
          enabled: true

    service:
      extensions: [health_check]
      pipelines:
        logs/spoor:
          receivers: [otlp]
          processors: [filter/spoor_only, batch]
          exporters: [clickhouse/spoor]
      telemetry:
        logs:
          level: info
        metrics:
          level: normal
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spoor-collector
  namespace: spoor-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spoor-collector
  template:
    metadata:
      labels:
        app: spoor-collector
      annotations:
        # A config change rolls the pod: bump when editing the ConfigMap.
        spoor.simplytics.ai/config-rev: "2"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
          imagePullPolicy: IfNotPresent
          args: ["--config=/etc/otelcol/config.yaml"]
          env:
            - name: GOMEMLIMIT
              value: "400MiB"
            - name: SSL_CERT_FILE
              value: /etc/spoor/clickhouse/ca.crt
            - name: CLICKHOUSE_SECURE
              value: "true"
            # Named keys, not envFrom: the secret also holds ca.crt, which is
            # not a valid variable name (mounted as a file below instead).
            - name: CLICKHOUSE_HOST
              valueFrom:
                secretKeyRef:
                  name: spoor-clickhouse-collector
                  key: CLICKHOUSE_HOST
            # The native TLS port (9440).
            - name: CLICKHOUSE_NATIVE_PORT
              valueFrom:
                secretKeyRef:
                  name: spoor-clickhouse-collector
                  key: CLICKHOUSE_PORT
            - name: CLICKHOUSE_DATABASE
              valueFrom:
                secretKeyRef:
                  name: spoor-clickhouse-collector
                  key: CLICKHOUSE_DATABASE
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: spoor-clickhouse-collector
                  key: CLICKHOUSE_USERNAME
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spoor-clickhouse-collector
                  key: CLICKHOUSE_PASSWORD
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: metrics
              containerPort: 8888
          # health_check answers 200 once the pipeline is up; it does not prove
          # ClickHouse is reachable (the exporter metrics on :8888 do).
          readinessProbe:
            httpGet:
              path: /
              port: 13133
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
            - name: clickhouse-ca
              mountPath: /etc/spoor/clickhouse
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: spoor-collector
        - name: clickhouse-ca
          secret:
            secretName: spoor-clickhouse-collector
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: spoor-collector
  namespace: spoor-staging
  labels:
    app: spoor-collector
spec:
  type: ClusterIP
  selector:
    app: spoor-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: metrics
      port: 8888
      targetPort: 8888
