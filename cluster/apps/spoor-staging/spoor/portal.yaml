---
# Spoor portal (staging). Image and configuration per Simplytics/spoor
# docs/deploy.md at the pinned commit: puma on 3000 (no Thruster), uid 1000,
# configuration from the environment only. The image refuses to boot without
# any required setting, or with ClickHouse's `default` user or database.
#
# Public at app-staging.spoor.observer (HTTPRoute below), through the tunnel only.
#
# ClickHouse: the host comes from 1Password (spoor-clickhouse-portal), never from
# this repo; the URL is built from it with Kubernetes env interpolation. The
# portal reads with its own user (SELECT on spoor_<env>.* only; no writes).
# SSL_CERT_FILE points OpenSSL (Net::HTTP) at the ClickHouse CA: the app has no
# CA-file option of its own. It replaces the system roots for this process,
# which is fine while ClickHouse is the portal's only outbound TLS peer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spoor-portal
  namespace: spoor-staging
spec:
  # Two pods, so a rollout or a node drain never leaves the route with no
  # endpoint: maxUnavailable 0 starts the new pod before an old one stops,
  # the PodDisruptionBudget below keeps one through a drain, and the preStop
  # sleep lets the gateway drop a stopping pod before Puma closes its socket.
  # Rate limits are in-process (MemoryStore), so each pod counts on its own:
  # the effective limits (sign-in and API throttles) are up to 2x the configured ones.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: spoor-portal
  template:
    metadata:
      labels:
        app: spoor-portal
    spec:
      # Soft: a pod beside its twin beats a pod left Pending while a node is down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          # Count only this revision's pods: without it the scheduler ignores
          # terminating old pods, so both new pods can land on one node and
          # nothing rebalances them (GA in 1.36).
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app: spoor-portal
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portal
          image: ghcr.io/simplytics/spoor-portal:sha-65065c50cd6cd67017cdc925cedca4fb3b19203d
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: SPOOR_PORTAL_HOSTS
              value: "app-staging.spoor.observer"
            # Passkey sign-in. The origin and relying-party id must equal the
            # public host exactly, or every WebAuthn ceremony fails. Changing
            # the rp id orphans every passkey: it changes only with the host.
            - name: SPOOR_WEBAUTHN_ORIGIN
              value: "https://app-staging.spoor.observer"
            - name: SPOOR_WEBAUTHN_RP_ID
              value: "app-staging.spoor.observer"
            # Proxies allowed to name the client in X-Forwarded-For (Simplytics/spoor
            # docs/deploy.md): the pod range, i.e. cloudflared and the Cilium
            # gateway's per-node addresses. Keep it to the pod range; the reason is
            # recorded in the Spoor repo. Images from Spoor #48 on refuse to boot
            # without it; older images ignore it.
            - name: SPOOR_TRUSTED_PROXIES
              value: "10.244.0.0/16"
            - name: SSL_CERT_FILE
              value: /etc/spoor/clickhouse/ca.crt
            # Named keys, not envFrom, for the ClickHouse secret: it also holds
            # ca.crt, which is not a valid variable name (mounted below).
            # CLICKHOUSE_HOST must come before the URL that interpolates it.
            - name: CLICKHOUSE_HOST
              valueFrom:
                secretKeyRef:
                  name: spoor-clickhouse-portal
                  key: CLICKHOUSE_HOST
            - name: SPOOR_CLICKHOUSE_URL
              value: "https://$(CLICKHOUSE_HOST):8443"
            - name: SPOOR_CLICKHOUSE_DATABASE
              valueFrom:
                secretKeyRef:
                  name: spoor-clickhouse-portal
                  key: CLICKHOUSE_DATABASE
            - name: SPOOR_CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: spoor-clickhouse-portal
                  key: CLICKHOUSE_USERNAME
            - name: SPOOR_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spoor-clickhouse-portal
                  key: CLICKHOUSE_PASSWORD
            # The portal's own product events through Spoor's Ruby SDK to public
            # ingest, as project spoor-portal (docs/deploy.md, Portal). All four or
            # none; a present-but-empty one refuses boot, on purpose.
            - name: SPOOR_DOGFOOD_ENDPOINT
              value: "https://ingest-staging.spoor.observer/v1/events"
            - name: SPOOR_DOGFOOD_ENVIRONMENT
              value: "staging"
          # DATABASE_URL and SECRET_KEY_BASE; the dogfood token and subject key.
          envFrom:
            - secretRef:
                name: spoor-portal
            - secretRef:
                name: spoor-portal-dogfood
          # /up is exempt from host authorisation and needs no Host header.
          # Endpoint removal reaches the gateway asynchronously; without the
          # wait, requests still routed to a stopping pod get 503. Native sleep
          # action (no binary needed in the image); within the 30 s grace period.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          readinessProbe:
            httpGet:
              path: /up
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /up
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: clickhouse-ca
              mountPath: /etc/spoor/clickhouse
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          # Pod Security "restricted". The root filesystem stays writable: the
          # app writes tmp/ and log/ under its directory and shells out to Bun
          # (registry validation), and a read-only root is not yet verified
          # against all three. Two-way door: emptyDirs on tmp/ and log/ later.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: clickhouse-ca
          secret:
            secretName: spoor-clickhouse-portal
            items:
              - key: ca.crt
                path: ca.crt
---
# Keeps one spoor-portal pod through voluntary disruptions (node drains, evictions).
# unhealthyPodEvictionPolicy AlwaysAllow lets a pod that is Running but not Ready
# be evicted even when the budget allows no disruption, so a crash-looping pod
# never pins a drain on its own. A drain can still block: a healthy pod on the
# drained node with the other pod unhealthy elsewhere (0 disruptions allowed),
# or both pods on the drained node with no room to reschedule.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: spoor-portal
  namespace: spoor-staging
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: spoor-portal
---
apiVersion: v1
kind: Service
metadata:
  name: spoor-portal
  namespace: spoor-staging
  labels:
    app: spoor-portal
spec:
  selector:
    app: spoor-portal
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: spoor-portal
  namespace: spoor-staging
spec:
  # Tunnel only. Cloudflare's edge serves the public certificate (proxied
  # records) and cloudflared reaches this listener with the athena wildcard
  # (cluster/core/networking/gateway.yaml, https-tunnel), so no per-host
  # listener or certificate is needed. HAProxy SNI passthrough for this host is
  # deliberately absent; adding it later means adding back a per-host :443
  # listener and a cert-manager Certificate (two-way door).
  parentRefs:
    - name: homelab-gateway
      namespace: default
      sectionName: https-tunnel
  hostnames:
    - "app-staging.spoor.observer"
  rules:
    - backendRefs:
        - name: spoor-portal
          port: 80
