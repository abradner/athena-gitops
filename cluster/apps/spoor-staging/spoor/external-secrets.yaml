---
# Portal secrets from the `simplytics-staging` 1Password item. database-url points at the
# role and database spoor_staging on the shared PostgreSQL server (owner of its
# own database only; no rights on the other environment's).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spoor-portal
  namespace: spoor-staging
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: spoor-portal
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: "simplytics-staging/database-url"
    - secretKey: SECRET_KEY_BASE
      remoteRef:
        key: "simplytics-staging/secret-key-base"
---
# ClickHouse credentials for the migration Job (DDL): the `simplytics-staging` item's clickhouse-*
# fields. Host, port and the CA come from 1Password, not from this repo: the
# server is outside the cluster and its address is not published here. TLS
# only (the native secure port); clients verify the server against ca.crt.
# The migrator user has rights on this environment's database only.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spoor-clickhouse-migrator
  namespace: spoor-staging
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: spoor-clickhouse-migrator
  data:
    - secretKey: CLICKHOUSE_HOST
      remoteRef:
        key: "simplytics-staging/clickhouse-host"
    - secretKey: CLICKHOUSE_PORT
      remoteRef:
        key: "simplytics-staging/clickhouse-port"
    - secretKey: CLICKHOUSE_DATABASE
      remoteRef:
        key: "simplytics-staging/clickhouse-database"
    - secretKey: CLICKHOUSE_USERNAME
      remoteRef:
        key: "simplytics-staging/clickhouse-migrator-username"
    - secretKey: CLICKHOUSE_PASSWORD
      remoteRef:
        key: "simplytics-staging/clickhouse-migrator-password"
    # Mounted as a file by consumers (CLICKHOUSE_CA_FILE).
    - secretKey: ca.crt
      remoteRef:
        key: "simplytics-staging/clickhouse-ca"
---
# Sample emitter credentials from the `simplytics-staging` item: the registry_publish
# token issued to "sample-emitter" for the spoor-sample project (SPOOR_TOKEN), the
# ingest token issued to "sample-emitter-ingest" (SPOOR_INGEST_TOKEN, for public
# ingest; never the same credential), and the key the emitter derives sample
# subject ids from. Replaces the hand-made Secret of the
# same name (managed-by=manual) created while 1Password was locked.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spoor-sample-emitter
  namespace: spoor-staging
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: spoor-sample-emitter
  data:
    - secretKey: SPOOR_TOKEN
      remoteRef:
        key: "simplytics-staging/sample-emitter-token"
    - secretKey: SPOOR_INGEST_TOKEN
      remoteRef:
        key: "simplytics-staging/sample-emitter-ingest-token"
    - secretKey: SPOOR_SAMPLE_SUBJECT_KEY
      remoteRef:
        key: "simplytics-staging/sample-emitter-subject-key"
---
# ClickHouse credentials for the portal (reads): the `simplytics-staging` item's
# clickhouse-* fields, with the portal user pair. Host, port and the CA come from
# 1Password, not from this repo (the server is outside the cluster and its
# address is not published here). TLS only; clients verify the server against
# ca.crt. SELECT on this environment's database (spoor_<env>.*) and nothing
# else, under a 1 GiB memory, 60 s per query cap; no
# read-only profile yet (narrowing to table grants is a tracked follow-up).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spoor-clickhouse-portal
  namespace: spoor-staging
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: spoor-clickhouse-portal
  data:
    - secretKey: CLICKHOUSE_HOST
      remoteRef:
        key: "simplytics-staging/clickhouse-host"
    - secretKey: CLICKHOUSE_PORT
      remoteRef:
        key: "simplytics-staging/clickhouse-port"
    - secretKey: CLICKHOUSE_DATABASE
      remoteRef:
        key: "simplytics-staging/clickhouse-database"
    - secretKey: CLICKHOUSE_USERNAME
      remoteRef:
        key: "simplytics-staging/clickhouse-portal-username"
    - secretKey: CLICKHOUSE_PASSWORD
      remoteRef:
        key: "simplytics-staging/clickhouse-portal-password"
    # Mounted as a file by consumers (CLICKHOUSE_CA_FILE).
    - secretKey: ca.crt
      remoteRef:
        key: "simplytics-staging/clickhouse-ca"
---
# ClickHouse credentials for the OTel collector (writes): the `simplytics-staging` item's
# clickhouse-* fields, with the collector user pair. Ingest has its own user
# (spoor-clickhouse-ingest, below). Host, port and the CA come from
# 1Password, not from this repo (the server is outside the cluster and its
# address is not published here). TLS only; clients verify the server against
# ca.crt. INSERT on this environment's database (spoor_<env>.*) and nothing
# else: it can never read events back. The views insert as their definer
# (<env>_migrator), so it needs no SELECT.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spoor-clickhouse-collector
  namespace: spoor-staging
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: spoor-clickhouse-collector
  data:
    - secretKey: CLICKHOUSE_HOST
      remoteRef:
        key: "simplytics-staging/clickhouse-host"
    - secretKey: CLICKHOUSE_PORT
      remoteRef:
        key: "simplytics-staging/clickhouse-port"
    - secretKey: CLICKHOUSE_DATABASE
      remoteRef:
        key: "simplytics-staging/clickhouse-database"
    - secretKey: CLICKHOUSE_USERNAME
      remoteRef:
        key: "simplytics-staging/clickhouse-collector-username"
    - secretKey: CLICKHOUSE_PASSWORD
      remoteRef:
        key: "simplytics-staging/clickhouse-collector-password"
    # Mounted as a file; the collector points SSL_CERT_FILE at it.
    - secretKey: ca.crt
      remoteRef:
        key: "simplytics-staging/clickhouse-ca"
---
# Ingest secrets from the `simplytics-staging` item: ingest-database-url is the
# portal's database as role spoor_staging_ingest (read-only but for
# credentials.last_used_at); ingest-secret-key-base is ingest's own, never the
# portal's.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spoor-ingest
  namespace: spoor-staging
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: spoor-ingest
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: "simplytics-staging/ingest-database-url"
    - secretKey: SECRET_KEY_BASE
      remoteRef:
        key: "simplytics-staging/ingest-secret-key-base"
---
# ClickHouse credentials for public ingest (apps/ingest): its own user,
# <env>_ingest, with INSERT on spoor_<env>.spoor_otel_logs only. It cannot read
# events back or write any other table; the views insert as their definer.
# Ingest speaks HTTPS on 8443 (ingest.yaml builds the URL from the host), so no
# port key here: the shared clickhouse-port field is the native 9440. Host,
# database and the CA come from 1Password; the CA is mounted as a file.
#
# Rotating or fixing these credentials: Secrets refresh every 24 h, and env vars
# never change in a running pod. After the 1Password fields change, force a
# refresh (kubectl -n spoor-<env> annotate externalsecret spoor-clickhouse-ingest
# force-sync="$(date +%s)" --overwrite), then restart
# spoor-ingest; if a rollout is stuck on a pod that started with bad
# credentials, delete that surge pod once the Secret is right.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spoor-clickhouse-ingest
  namespace: spoor-staging
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: spoor-clickhouse-ingest
  data:
    - secretKey: CLICKHOUSE_HOST
      remoteRef:
        key: "simplytics-staging/clickhouse-host"
    - secretKey: CLICKHOUSE_DATABASE
      remoteRef:
        key: "simplytics-staging/clickhouse-database"
    - secretKey: CLICKHOUSE_USERNAME
      remoteRef:
        key: "simplytics-staging/clickhouse-ingest-username"
    - secretKey: CLICKHOUSE_PASSWORD
      remoteRef:
        key: "simplytics-staging/clickhouse-ingest-password"
    - secretKey: ca.crt
      remoteRef:
        key: "simplytics-staging/clickhouse-ca"
