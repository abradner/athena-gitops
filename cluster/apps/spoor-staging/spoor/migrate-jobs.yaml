---
# Migrations before each sync (Simplytics/spoor docs/deploy.md): Postgres
# first (wave 0), then ClickHouse (wave 1), both in the portal image, both
# before the portal rolls. PreSync is safe here because the Secrets they read
# (spoor-portal, spoor-clickhouse-migrator) already exist from earlier syncs;
# on a fresh namespace the first sync would wait on them (see the Temporal
# schema Job in spritz-staging for that trade-off).
#
# Both runners skip versions they have already recorded, so a re-run is a
# no-op. A rollback does not reverse a migration (deploy.md, "Rollback").
apiVersion: batch/v1
kind: Job
metadata:
  name: spoor-db-migrate
  namespace: spoor-staging
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/simplytics/spoor-portal:sha-65065c50cd6cd67017cdc925cedca4fb3b19203d
          imagePullPolicy: IfNotPresent
          command: ["bin/rails", "db:migrate"]
          # The portal's environment: Rails boots it in full, and production
          # refuses to boot without any required setting.
          env:
            - name: SPOOR_PORTAL_HOSTS
              value: "app-staging.spoor.observer"
            - name: SPOOR_WEBAUTHN_ORIGIN
              value: "https://app-staging.spoor.observer"
            - name: SPOOR_WEBAUTHN_RP_ID
              value: "app-staging.spoor.observer"
            # Proxies allowed to name the client in X-Forwarded-For (Simplytics/spoor
            # docs/deploy.md): the pod range, i.e. cloudflared and the Cilium
            # gateway's per-node addresses. Keep it to the pod range; the reason is
            # recorded in the Spoor repo. Images from Spoor #48 on refuse to boot
            # without it; older images ignore it.
            - name: SPOOR_TRUSTED_PROXIES
              value: "10.244.0.0/16"
            - name: SSL_CERT_FILE
              value: /etc/spoor/clickhouse/ca.crt
            - name: CLICKHOUSE_HOST
              valueFrom:
                secretKeyRef:
                  name: spoor-clickhouse-portal
                  key: CLICKHOUSE_HOST
            - name: SPOOR_CLICKHOUSE_URL
              value: "https://$(CLICKHOUSE_HOST):8443"
            - name: SPOOR_CLICKHOUSE_DATABASE
              valueFrom:
                secretKeyRef:
                  name: spoor-clickhouse-portal
                  key: CLICKHOUSE_DATABASE
            - name: SPOOR_CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: spoor-clickhouse-portal
                  key: CLICKHOUSE_USERNAME
            - name: SPOOR_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spoor-clickhouse-portal
                  key: CLICKHOUSE_PASSWORD
          envFrom:
            - secretRef:
                name: spoor-portal
          volumeMounts:
            - name: clickhouse-ca
              mountPath: /etc/spoor/clickhouse
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: clickhouse-ca
          secret:
            secretName: spoor-clickhouse-portal
            items:
              - key: ca.crt
                path: ca.crt
---
# ClickHouse migrations, as the per-environment migrator user (DDL on this
# environment's database only). The runner refuses plain http, the `default`
# user or database, and a blank password.
apiVersion: batch/v1
kind: Job
metadata:
  name: spoor-clickhouse-migrate
  namespace: spoor-staging
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/simplytics/spoor-portal:sha-65065c50cd6cd67017cdc925cedca4fb3b19203d
          imagePullPolicy: IfNotPresent
          command: ["ruby", "/repo/infra/clickhouse/bin/migrate"]
          env:
            - name: SSL_CERT_FILE
              value: /etc/spoor/clickhouse/ca.crt
            - name: CLICKHOUSE_HOST
              valueFrom:
                secretKeyRef:
                  name: spoor-clickhouse-migrator
                  key: CLICKHOUSE_HOST
            - name: CLICKHOUSE_URL
              value: "https://$(CLICKHOUSE_HOST):8443"
            - name: CLICKHOUSE_DATABASE
              valueFrom:
                secretKeyRef:
                  name: spoor-clickhouse-migrator
                  key: CLICKHOUSE_DATABASE
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: spoor-clickhouse-migrator
                  key: CLICKHOUSE_USERNAME
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spoor-clickhouse-migrator
                  key: CLICKHOUSE_PASSWORD
          volumeMounts:
            - name: clickhouse-ca
              mountPath: /etc/spoor/clickhouse
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: clickhouse-ca
          secret:
            secretName: spoor-clickhouse-migrator
            items:
              - key: ca.crt
                path: ca.crt
