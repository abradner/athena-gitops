---
# App secrets from 1Password. `counta-app` item fields:
#   database-url     — postgres://counta:<pw>@postgres.infra.asn.casa:5432/counta_production
#   rails-master-key — contents of config/master.key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: counta-app
  namespace: counta
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: counta-app
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: "counta-app/database-url"
    - secretKey: RAILS_MASTER_KEY
      remoteRef:
        key: "counta-app/rails-master-key"
---
# Pull secret for ghcr.io — shared `ghcr-pull` 1Password item (username +
# token with read:packages), same pattern as the other first-party apps.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: counta
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        ".dockerconfigjson": '{"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}"}}}'
  data:
    - secretKey: username
      remoteRef:
        key: "ghcr-pull/username"
    - secretKey: token
      remoteRef:
        key: "ghcr-pull/token"
