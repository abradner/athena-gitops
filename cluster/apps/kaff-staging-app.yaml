---
# kaff (staging) — staging.kaff.asn.casa. Web + Temporal worker.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kaff-staging
  namespace: argocd
spec:
  project: workloads
  source:
    repoURL: 'https://github.com/abradner/athena-gitops.git'
    targetRevision: main
    path: cluster/apps/asn-staging/kaff
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: asn-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
