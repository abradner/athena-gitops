---
# Portal secrets from the `simplytics-production` 1Password item. database-url points at the
# role and database spoor_production on the shared PostgreSQL server (owner of its
# own database only; no rights on the other environment's).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spoor-portal
  namespace: spoor-production
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: spoor-portal
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: "simplytics-production/database-url"
    - secretKey: SECRET_KEY_BASE
      remoteRef:
        key: "simplytics-production/secret-key-base"
---
# ClickHouse credentials for the portal (reads) and the collector (writes; one
# app user for both until the split below is verified; then this one goes): the `simplytics-production` item's clickhouse-*
# fields. Host, port and the CA come from 1Password, not from this repo: the
# server is outside the cluster and its address is not published here. TLS
# only (the native secure port); clients verify the server against ca.crt.
# The app user has rights on this environment's database only.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spoor-clickhouse-app
  namespace: spoor-production
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: spoor-clickhouse-app
  data:
    - secretKey: CLICKHOUSE_HOST
      remoteRef:
        key: "simplytics-production/clickhouse-host"
    - secretKey: CLICKHOUSE_PORT
      remoteRef:
        key: "simplytics-production/clickhouse-port"
    - secretKey: CLICKHOUSE_DATABASE
      remoteRef:
        key: "simplytics-production/clickhouse-database"
    - secretKey: CLICKHOUSE_USERNAME
      remoteRef:
        key: "simplytics-production/clickhouse-app-username"
    - secretKey: CLICKHOUSE_PASSWORD
      remoteRef:
        key: "simplytics-production/clickhouse-app-password"
    # Mounted as a file by consumers (CLICKHOUSE_CA_FILE).
    - secretKey: ca.crt
      remoteRef:
        key: "simplytics-production/clickhouse-ca"
---
# ClickHouse credentials for the migration Job (DDL): the `simplytics-production` item's clickhouse-*
# fields. Host, port and the CA come from 1Password, not from this repo: the
# server is outside the cluster and its address is not published here. TLS
# only (the native secure port); clients verify the server against ca.crt.
# The migrator user has rights on this environment's database only.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spoor-clickhouse-migrator
  namespace: spoor-production
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: spoor-clickhouse-migrator
  data:
    - secretKey: CLICKHOUSE_HOST
      remoteRef:
        key: "simplytics-production/clickhouse-host"
    - secretKey: CLICKHOUSE_PORT
      remoteRef:
        key: "simplytics-production/clickhouse-port"
    - secretKey: CLICKHOUSE_DATABASE
      remoteRef:
        key: "simplytics-production/clickhouse-database"
    - secretKey: CLICKHOUSE_USERNAME
      remoteRef:
        key: "simplytics-production/clickhouse-migrator-username"
    - secretKey: CLICKHOUSE_PASSWORD
      remoteRef:
        key: "simplytics-production/clickhouse-migrator-password"
    # Mounted as a file by consumers (CLICKHOUSE_CA_FILE).
    - secretKey: ca.crt
      remoteRef:
        key: "simplytics-production/clickhouse-ca"
---
# Sample emitter credentials from the `simplytics-production` item: the registry_publish
# token issued to "sample-emitter" for the spoor-sample project, and the key the
# emitter derives sample subject ids from. Replaces the hand-made Secret of the
# same name (managed-by=manual) created while 1Password was locked.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spoor-sample-emitter
  namespace: spoor-production
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: spoor-sample-emitter
  data:
    - secretKey: SPOOR_TOKEN
      remoteRef:
        key: "simplytics-production/sample-emitter-token"
    - secretKey: SPOOR_SAMPLE_SUBJECT_KEY
      remoteRef:
        key: "simplytics-production/sample-emitter-subject-key"
---
# ClickHouse credentials for the portal (reads): the `simplytics-production` item's
# clickhouse-* fields, with the portal user pair. Host, port and the CA come from
# 1Password, not from this repo (the server is outside the cluster and its
# address is not published here). TLS only; clients verify the server against
# ca.crt. SELECT on this environment's database (spoor_<env>.*) and nothing
# else, under the same caps as the app user (1 GiB memory, 60 s per query); no
# read-only profile yet (narrowing to table grants is a tracked follow-up).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spoor-clickhouse-portal
  namespace: spoor-production
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: spoor-clickhouse-portal
  data:
    - secretKey: CLICKHOUSE_HOST
      remoteRef:
        key: "simplytics-production/clickhouse-host"
    - secretKey: CLICKHOUSE_PORT
      remoteRef:
        key: "simplytics-production/clickhouse-port"
    - secretKey: CLICKHOUSE_DATABASE
      remoteRef:
        key: "simplytics-production/clickhouse-database"
    - secretKey: CLICKHOUSE_USERNAME
      remoteRef:
        key: "simplytics-production/clickhouse-portal-username"
    - secretKey: CLICKHOUSE_PASSWORD
      remoteRef:
        key: "simplytics-production/clickhouse-portal-password"
    # Mounted as a file by consumers (CLICKHOUSE_CA_FILE).
    - secretKey: ca.crt
      remoteRef:
        key: "simplytics-production/clickhouse-ca"
---
# ClickHouse credentials for the OTel collector (writes): the `simplytics-production` item's
# clickhouse-* fields, with the collector user pair. Host, port and the CA come from
# 1Password, not from this repo (the server is outside the cluster and its
# address is not published here). TLS only; clients verify the server against
# ca.crt. INSERT on this environment's database (spoor_<env>.*) and nothing
# else: it can never read events back. The views insert as their definer
# (<env>_migrator), so it needs no SELECT.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spoor-clickhouse-collector
  namespace: spoor-production
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: spoor-clickhouse-collector
  data:
    - secretKey: CLICKHOUSE_HOST
      remoteRef:
        key: "simplytics-production/clickhouse-host"
    - secretKey: CLICKHOUSE_PORT
      remoteRef:
        key: "simplytics-production/clickhouse-port"
    - secretKey: CLICKHOUSE_DATABASE
      remoteRef:
        key: "simplytics-production/clickhouse-database"
    - secretKey: CLICKHOUSE_USERNAME
      remoteRef:
        key: "simplytics-production/clickhouse-collector-username"
    - secretKey: CLICKHOUSE_PASSWORD
      remoteRef:
        key: "simplytics-production/clickhouse-collector-password"
    # Mounted as a file by consumers (CLICKHOUSE_CA_FILE).
    - secretKey: ca.crt
      remoteRef:
        key: "simplytics-production/clickhouse-ca"
