---
# Portal secrets from the `simplytics-production` 1Password item. database-url points at the
# role and database spoor_production on the shared PostgreSQL server (owner of its
# own database only; no rights on the other environment's).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spoor-portal
  namespace: spoor-production
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: spoor-portal
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: "simplytics-production/database-url"
    - secretKey: SECRET_KEY_BASE
      remoteRef:
        key: "simplytics-production/secret-key-base"
---
# ClickHouse credentials for the portal (reads) and the collector (writes; one
# app user for both until the portal-read and collector-insert split lands): the `simplytics-production` item's clickhouse-*
# fields. Host, port and the CA come from 1Password, not from this repo: the
# server is outside the cluster and its address is not published here. TLS
# only (the native secure port); clients verify the server against ca.crt.
# The app user has rights on this environment's database only.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spoor-clickhouse-app
  namespace: spoor-production
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: spoor-clickhouse-app
  data:
    - secretKey: CLICKHOUSE_HOST
      remoteRef:
        key: "simplytics-production/clickhouse-host"
    - secretKey: CLICKHOUSE_PORT
      remoteRef:
        key: "simplytics-production/clickhouse-port"
    - secretKey: CLICKHOUSE_DATABASE
      remoteRef:
        key: "simplytics-production/clickhouse-database"
    - secretKey: CLICKHOUSE_USERNAME
      remoteRef:
        key: "simplytics-production/clickhouse-app-username"
    - secretKey: CLICKHOUSE_PASSWORD
      remoteRef:
        key: "simplytics-production/clickhouse-app-password"
    # Mounted as a file by consumers (CLICKHOUSE_CA_FILE).
    - secretKey: ca.crt
      remoteRef:
        key: "simplytics-production/clickhouse-ca"
---
# ClickHouse credentials for the migration Job (DDL): the `simplytics-production` item's clickhouse-*
# fields. Host, port and the CA come from 1Password, not from this repo: the
# server is outside the cluster and its address is not published here. TLS
# only (the native secure port); clients verify the server against ca.crt.
# The migrator user has rights on this environment's database only.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spoor-clickhouse-migrator
  namespace: spoor-production
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: onepassword-backend
    kind: ClusterSecretStore
  target:
    name: spoor-clickhouse-migrator
  data:
    - secretKey: CLICKHOUSE_HOST
      remoteRef:
        key: "simplytics-production/clickhouse-host"
    - secretKey: CLICKHOUSE_PORT
      remoteRef:
        key: "simplytics-production/clickhouse-port"
    - secretKey: CLICKHOUSE_DATABASE
      remoteRef:
        key: "simplytics-production/clickhouse-database"
    - secretKey: CLICKHOUSE_USERNAME
      remoteRef:
        key: "simplytics-production/clickhouse-migrator-username"
    - secretKey: CLICKHOUSE_PASSWORD
      remoteRef:
        key: "simplytics-production/clickhouse-migrator-password"
    # Mounted as a file by consumers (CLICKHOUSE_CA_FILE).
    - secretKey: ca.crt
      remoteRef:
        key: "simplytics-production/clickhouse-ca"
