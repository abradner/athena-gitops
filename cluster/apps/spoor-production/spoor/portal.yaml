---
# Spoor portal (production). PLACEHOLDER: replicas 0 until the Spoor night shift
# pushes ghcr.io/simplytics/spoor-portal and sets the tag, the env and the
# replica count here. At 0 the Deployment is Healthy with nothing to pull, so
# the app syncs before the first image exists.
#
# Public at app.spoor.observer (HTTPRoute below), through the tunnel only. Until the portal has
# replicas the route has no endpoints, and the Gateway answers 503.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spoor-portal
  namespace: spoor-production
spec:
  replicas: 0
  selector:
    matchLabels:
      app: spoor-portal
  template:
    metadata:
      labels:
        app: spoor-portal
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: portal
          image: ghcr.io/simplytics/spoor-portal:placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HTTP_PORT
              value: "8080"
            # Passkey sign-in (Simplytics/spoor docs/deploy.md). The origin and
            # relying-party id must equal the public host exactly, or every
            # WebAuthn ceremony fails; they change only with the hostname.
            - name: SPOOR_WEBAUTHN_ORIGIN
              value: "https://app.spoor.observer"
            - name: SPOOR_WEBAUTHN_RP_ID
              value: "app.spoor.observer"
            - name: CLICKHOUSE_CA_FILE
              value: /etc/spoor/clickhouse/ca.crt
            # Named keys, not envFrom, for the ClickHouse secret: it also holds
            # ca.crt, which is not a valid variable name (mounted below).
            - name: CLICKHOUSE_HOST
              valueFrom:
                secretKeyRef:
                  name: spoor-clickhouse-app
                  key: CLICKHOUSE_HOST
            - name: CLICKHOUSE_PORT
              valueFrom:
                secretKeyRef:
                  name: spoor-clickhouse-app
                  key: CLICKHOUSE_PORT
            - name: CLICKHOUSE_DATABASE
              valueFrom:
                secretKeyRef:
                  name: spoor-clickhouse-app
                  key: CLICKHOUSE_DATABASE
            - name: CLICKHOUSE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: spoor-clickhouse-app
                  key: CLICKHOUSE_USERNAME
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spoor-clickhouse-app
                  key: CLICKHOUSE_PASSWORD
          envFrom:
            - secretRef:
                name: spoor-portal
          volumeMounts:
            - name: clickhouse-ca
              mountPath: /etc/spoor/clickhouse
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          # Pod Security "restricted". If the image needs a writable root or a
          # specific uid, the Spoor night shift says so here, with the reason.
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: clickhouse-ca
          secret:
            secretName: spoor-clickhouse-app
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: spoor-portal
  namespace: spoor-production
  labels:
    app: spoor-portal
spec:
  selector:
    app: spoor-portal
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: spoor-portal
  namespace: spoor-production
spec:
  # Tunnel only. Cloudflare's edge serves the public certificate (proxied
  # records) and cloudflared reaches this listener with the athena wildcard
  # (cluster/core/networking/gateway.yaml, https-tunnel), so no per-host
  # listener or certificate is needed. HAProxy SNI passthrough for this host is
  # deliberately absent; adding it later means adding back a per-host :443
  # listener and a cert-manager Certificate (two-way door).
  parentRefs:
    - name: homelab-gateway
      namespace: default
      sectionName: https-tunnel
  hostnames:
    - "app.spoor.observer"
  rules:
    - backendRefs:
        - name: spoor-portal
          port: 80
