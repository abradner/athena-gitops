---
# Per-namespace shared resources for spritz-staging (currently just the ghcr pull
# secret — one owner per namespace avoids Applications fighting over it).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shared-spritz-staging
  namespace: argocd
spec:
  project: workloads
  source:
    repoURL: 'https://github.com/abradner/athena-gitops.git'
    targetRevision: main
    path: cluster/apps/spritz-staging/shared
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: spritz-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
