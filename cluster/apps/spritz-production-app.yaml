---
# spritz (production) — rabalex.wedding. Web + Temporal worker, garage S3 storage.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spritz-production
  namespace: argocd
spec:
  project: workloads
  source:
    repoURL: 'https://github.com/abradner/athena-gitops.git'
    targetRevision: main
    path: cluster/apps/spritz-production/spritz
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: spritz-production
  # The HPA owns spritz-web's replica count, so Argo must not reconcile it.
  # Without this, selfHeal resets replicas to the manifest on every sync and
  # the two fight — the classic Argo/HPA flap.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: spritz-web
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
