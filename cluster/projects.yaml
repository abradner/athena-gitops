---
# AppProjects live at the top level (synced by cluster-root, which runs in
# the built-in default project) so they exist before the child Applications
# that reference them — putting them inside cluster/core would deadlock:
# cluster-core couldn't sync into a project it hasn't created yet.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: core
  namespace: argocd
  annotations:
    # Apply before the cluster-core / cluster-apps Applications (wave 0)
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Foundational cluster services managed from athena-gitops
  sourceRepos:
    - 'https://github.com/abradner/athena-gitops.git'
    - 'https://kubernetes-sigs.github.io/metrics-server/'
    - 'https://kubernetes-sigs.github.io/headlamp/'
    - 'https://charts.external-secrets.io'
    - 'https://charts.jetstack.io'
    - 'https://argoproj.github.io/argo-helm'
    - 'https://postfinance.github.io/kubelet-csr-approver'
    - 'https://victoriametrics.github.io/helm-charts/'
    - 'https://prometheus-community.github.io/helm-charts'
  destinations:
    - server: 'https://kubernetes.default.svc'
      namespace: argocd
    - server: 'https://kubernetes.default.svc'
      namespace: kube-system
    - server: 'https://kubernetes.default.svc'
      namespace: external-secrets
    - server: 'https://kubernetes.default.svc'
      namespace: headlamp
    - server: 'https://kubernetes.default.svc'
      namespace: cert-manager
    - server: 'https://kubernetes.default.svc'
      namespace: default
    # Storage provisioner. Without this entry Argo rejects every resource
    # bound for the namespace as invalid — the sync reports "one or more
    # synchronization tasks are not valid", which reads like a manifest
    # problem rather than a project-scope one.
    - server: 'https://kubernetes.default.svc'
      namespace: local-path-storage
    # Observability stack (VictoriaMetrics, VictoriaLogs, Grafana).
    - server: 'https://kubernetes.default.svc'
      namespace: observability
    # Cloudflare Tunnel connectors. Same trap as local-path-storage above: the
    # Namespace object itself is cluster-scoped and passes on the whitelist, so
    # without this entry the namespace appears and everything meant to go in it
    # is rejected — which looks like eight broken manifests rather than one
    # missing line.
    - server: 'https://kubernetes.default.svc'
      namespace: cloudflared
  # Core installs CRDs, webhooks, RBAC, APIServices — cluster scope required.
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pmn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: pmn workload suite (pmn-workloads repo, pmn-* namespaces)
  sourceRepos:
    - 'https://github.com/abradner/pmn-workloads.git'
  destinations:
    - server: 'https://kubernetes.default.svc'
      namespace: 'pmn-*'
  # TODO: tighten to [] once the pmn overlays are confirmed to contain only
  # namespace-scoped resources — kept permissive for now so the project
  # switch can't break syncs. The repo/namespace scoping above is the main
  # containment win either way.
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workloads
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: First-party apps, grouped per environment (asn-*, spritz-*, simplytics-*), each group-env namespace with its own Temporal instance
  sourceRepos:
    - 'https://github.com/abradner/athena-gitops.git'
  # pmn-style namespace globs: one namespace per group per environment
  # (asn-production, asn-staging, spritz-production, ... simplytics reserved).
  destinations:
    - server: 'https://kubernetes.default.svc'
      namespace: 'asn-*'
    - server: 'https://kubernetes.default.svc'
      namespace: 'spritz-*'
    - server: 'https://kubernetes.default.svc'
      namespace: 'simplytics-*'
  # Workloads are namespace-scoped; namespaces come from CreateNamespace=true
  # on each Application, whitelisted here for the dry-run's sake.
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
