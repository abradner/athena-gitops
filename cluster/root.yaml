---
# The app-of-apps root. Applied once by hand during bootstrap
# (kubectl apply -f cluster/root.yaml); after that it manages itself —
# this file lives inside its own sync path, so spec changes here are
# picked up by Argo CD without another manual apply.
#
# It intentionally syncs ONLY the top level of cluster/ (recurse: false):
# the AppProjects and the two child Applications, which in turn own
# cluster/core and cluster/apps. prune is off at this level so a bad
# rename/removal of a top-level file degrades to "orphaned, fix in git"
# rather than cascading deletes through core infrastructure.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-root
  annotations:
    # Argo stamps this on every resource it manages. Normally that is invisible,
    # because the manager and the managed are different objects. cluster-root is
    # the exception: it manages ITSELF, so each sync applies this file over the
    # live object, strips the annotation Argo just wrote, and Argo immediately
    # re-adds it - producing a Synced -> OutOfSync flip roughly once a second,
    # forever, with every sync reported as succeeding.
    #
    # Declaring it here makes the apply a no-op and breaks the cycle. The value
    # is <app-name>:<group>/<kind>:<namespace>/<name> and must match exactly.
    #
    # cluster-apps and cluster-core carry the same annotation without it being
    # in git and do NOT loop, because nothing ever applies their own definition
    # back over them.
    argocd.argoproj.io/tracking-id: "cluster-root:argoproj.io/Application:argocd/cluster-root"
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/abradner/athena-gitops.git'
    targetRevision: main
    path: cluster
    directory:
      recurse: false
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
