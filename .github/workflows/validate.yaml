name: validate

on:
  push:
    branches: [main]
  pull_request:

# Tools come out of their own images, pinned by digest, not GitHub release
# assets (scripts/ci/install_from_image.sh says why). To bump one, change the
# tag and the digest together: `docker buildx imagetools inspect <image:tag>`
# prints the index digest; the image must carry linux/arm64.
env:
  YQ_IMAGE: docker.io/mikefarah/yq:4.44.3@sha256:5b3d851bf28b04ef902fee86305f4dd7e063919c1cafedab2042adb16221c025
  KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.6.7@sha256:0925177fb05b44ce18574076141b5c3d83235e1904d3f952182ac99ddc45762c

jobs:
  yaml-syntax:
    name: YAML syntax (yq)
    # arm64 runners fleet-wide: matches the cluster's architecture. The tool
    # images are multi-arch, so `docker create` picks the runner's.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      # Pin yq rather than relying on the runner's preinstalled copy —
      # validate_yaml.sh needs mikefarah yq 4 (same as mise.toml pins locally).
      - name: Install yq
        run: ./scripts/ci/install_from_image.sh "$YQ_IMAGE" /usr/bin/yq yq
      - run: ./scripts/validate_yaml.sh
      # Shares this job for its yq install. Guards the worker DHCP
      # search-domain override through apply-worker.sh (AGENTS.md Gotcha #7).
      - run: ./scripts/test_apply_worker.sh

  waker-tests:
    name: zagreus waker unit tests
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13" # the waker's image is python:3.13
      # The heartbeat test extracts the shell loop from kmsg-heartbeat.yaml
      # with yq, and skips without it: install it so the skip cannot happen
      # here.
      - name: Install yq
        run: ./scripts/ci/install_from_image.sh "$YQ_IMAGE" /usr/bin/yq yq
      - name: Run
        # An unset shell runs `bash -e` without pipefail: say it, or tee's
        # status would hide a failing run.
        run: |
          set -o pipefail
          python3 -m unittest discover -s cluster/zagreus/waker/tests -v 2>&1 | tee /tmp/waker-tests.log
          ! grep -q "skipped" /tmp/waker-tests.log

  k8s-schema:
    name: Kubernetes schema (kubeconform)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Install kubeconform
        run: ./scripts/ci/install_from_image.sh "$KUBECONFORM_IMAGE" /kubeconform kubeconform
      # bootstrap/ is excluded: talos templates use {{ }} placeholders and
      # aren't valid k8s manifests until hydrated.
      - name: Validate manifests
        run: |
          kubeconform -strict -summary -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            cluster/

  helm-render:
    name: Helm render (what Argo will apply)
    runs-on: ubuntu-24.04-arm
    steps:
      # Full history: the render diff below needs the PR's base commit, and
      # actions/checkout defaults to a shallow clone that does not have it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      # Six of the chart repos (all on github.io) serve their chart tarballs
      # from GitHub release assets, which can be down for hours while GitHub
      # reports green. Keep helm's cache (indexes and fetched charts) and its
      # repo list between runs, so a chart already rendered once does not
      # need them again. Proven offline: with both directories warm, every
      # https-repo chart renders with all network refused (OCI charts still
      # pull from their registry). The key follows cluster/, and restore-keys
      # take the newest older cache.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/helm
            ~/.config/helm
          key: helm-charts-${{ hashFiles('cluster/**/*.yaml') }}
          restore-keys: helm-charts-

      # A restored repo list holds old indexes, and `helm repo add` keeps an
      # existing entry as it is, so a chart bumped since then would not be
      # found. Refresh them first. If the repos cannot be reached, the cached
      # indexes still render every chart they already list.
      - name: Refresh cached Helm repo indexes
        run: helm repo update || echo "::warning::helm repo update failed (or nothing cached yet); rendering from what is cached"

      - name: Install kubeconform
        run: ./scripts/ci/install_from_image.sh "$KUBECONFORM_IMAGE" /kubeconform kubeconform

      # An Application is a few valid lines that expand into hundreds of
      # manifests. yq and kubeconform above both check the repo's own YAML and
      # neither renders a chart, so everything in that expansion was unchecked.
      - name: Render charts
        run: ./scripts/render_helm.sh .render/head

      # kubeconform against the RENDERED output, not the repo. The job above
      # validates what we wrote; this validates what the cluster receives.
      - name: Validate rendered manifests
        run: |
          kubeconform -strict -summary -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            .render/head

      # The diff is the part that earns this job. Rendering successfully proves
      # very little: on 2026-08-25 a one-line change rendered cleanly into a
      # Vector sink with a null body and took log collection down cluster-wide,
      # and its replacement rendered cleanly while silently dropping a
      # toleration and a resources block. Both were valid YAML, valid
      # Kubernetes, and wrong. What would have shown either at review time is
      # seeing what the rendered output does that it did not do before.
      - name: Diff rendered output against base
        if: github.event_name == 'pull_request'
        run: |
          git worktree add /tmp/base "${{ github.event.pull_request.base.sha }}" >/dev/null
          ( cd /tmp/base && ./scripts/render_helm.sh /tmp/base-render >/dev/null 2>&1 ) || {
            echo "::notice::Base commit failed to render — showing head only."; exit 0; }
          if diff -ru /tmp/base-render .render/head > /tmp/render.diff; then
            echo "No change to rendered output."
          else
            # Count real content lines only: grep '^[+-]' also matches the
            # +++/--- file headers, which inflates the number.
            changed=$(grep -cE '^[+-]' /tmp/render.diff)
            headers=$(grep -cE '^(\+\+\+|---)' /tmp/render.diff)
            echo "::group::Rendered output changed ($((changed - headers)) lines)"
            cat /tmp/render.diff
            echo "::endgroup::"
            echo "::notice::Rendered Helm output changed — check the diff for anything you did not intend, especially REMOVED lines."
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rendered-manifests
          path: .render/head
          retention-days: 7
