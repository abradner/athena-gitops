# Image Factory schematic for GPU workers that run as a Proxmox VM with the
# host's Intel iGPU passed through (vfio-pci). POST it to get the id:
#   curl -sS -X POST --data-binary @worker-gpu-vm.schematic.yaml https://factory.talos.dev/schematics
# -> c1088994705061689fa45e19fbb41294f58c89191c3eb9d5c4ce9c8d960a9cf3
# A changed file means a new id: update install.image in
# worker-gpu-vm.patch.yaml.
#
# The bare-metal GPU workers use worker-gpu.schematic.yaml instead. The two
# differ on purpose:
#   - No Secure Boot. The VM's OVMF has no enrolled keys
#     (efidisk pre-enrolled-keys=0), so the boot media and installer are the
#     PLAIN variants (metal-amd64.iso, metal-installer). The -secureboot UKI
#     would also boot, but nothing would be verifying it.
#   - No mei. The VM has no Intel ME; AMT belongs to the Proxmox host.
#   - The ONLY console is ttyS0, the VM's own serial port (serial0: socket,
#     read with `qm terminal <vmid>`), not the AMT UART. `-console` removes
#     Talos's default console=tty0, and the Talos dashboard is disabled.
#     Why (found on the first VM, 2026-10-22): once i915 registers its
#     framebuffer for the passed-through iGPU (no monitor, no CRTC), every
#     write to a framebuffer console takes about a second. With tty0 as a
#     console, each kernel message blocked on it: RCU stalls every ~20 s,
#     97 s to reach maintenance mode, 128 s to start apid. With ttyS0 only:
#     18 s, no stalls. Do not add console=tty0 back. Check the resulting
#     command line before booting anything:
#       curl -sSL https://factory.talos.dev/image/<id>/<talos version>/cmdline-metal-amd64
#
# Extensions: only what the node uses.
#   - i915: the GPU driver and its DMC/GuC/HuC firmware.
#   - intel-ucode: inert inside a VM (the hypervisor owns microcode; the
#     Proxmox host must load it), kept so the GPU classes stay alike. It
#     ships no service, so it cannot block the boot.
#   - qemu-guest-agent: clean shutdown from the host, IP reporting. It ships
#     a SERVICE, which waits for /dev/virtio-ports/org.qemu.guest_agent.0.
#     That device exists only when the VM sets `agent: enabled=1`. The VM
#     MUST set it: without it the service never starts, boot's
#     startAllServices waits for it, and after Talos's BootTimeout (70 min)
#     the node reboots, over and over (the failure worker-gpu.schematic.yaml
#     describes). To drop the agent, drop this extension in the same change.
#
# NEVER add another extension that ships a service unless this class also
# gets its config.
customization:
  extraKernelArgs:
    - -console
    - console=ttyS0,115200n8
    - talos.dashboard.disabled=1
  systemExtensions:
    officialExtensions:
      - siderolabs/i915
      - siderolabs/intel-ucode
      - siderolabs/qemu-guest-agent
