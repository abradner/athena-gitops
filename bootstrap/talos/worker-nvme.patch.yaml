# Config patch for the scratch workers: CM5 Lites identical to the other
# workers except for a 128 GB NVMe where the others have a 14 GB Optane.
# Applied on top of worker.yaml by apply-worker.sh for every NVME_WORKER_IP.
#
# Why a patch and not a separate template: the hardware differs only in
# storage, and storage needs no per-node config. The base template's
# EPHEMERAL VolumeConfig already selects "the NVMe", so /var lands on the
# 128 GB drive here and on the Optane elsewhere. What differs is a label,
# and this patch holds only that.
#
# Contains no secrets, so it is committed as-is and never hydrated.
#
# Scheduling: a label, no taint.
#   - Scratch-heavy workloads (GitHub runners, other disk-hungry ephemeral
#     jobs) can prefer or select these nodes with
#       nodeSelector: {athena.asn.casa/scratch: nvme}
#     and should size their scratch with emptyDir.sizeLimit; diskQuotaSupport
#     enforces it via XFS project quotas.
#   - There used to be a PreferNoSchedule taint as well. It was removed
#     (2026-11) because nothing selected these nodes, so its only effect was
#     to place general workloads on the workers with the fastest disk last;
#     the one workload that cared carried a toleration just to undo it. Talos
#     applies nodeTaints when a node registers, so a stale taint came back on
#     every rebuild.
#
# Talos 1.14 deprecates machine.nodeLabels in favour of a KubeNodeConfig
# document. The field still works on 1.13 and 1.14; move it when the
# workers move.
machine:
    nodeLabels:
        athena.asn.casa/scratch: nvme
