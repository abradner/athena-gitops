# zagreus arm64 image builder (today zag-arm64-02): a CM5 8 GB Lite on a
# dual-NVMe carrier. It boots from SD, because the overlay's U-Boot cannot boot
# a CM5 from NVMe, and /var lives on a 250 GB NVMe SSD. Always on, so arm64
# image builds no longer wait for a Mac to be awake. It runs the docker-arm64
# dind scale set and the light lane (unprivileged, no docker socket), which it
# shares with any arm64 runner nodes.
#
# Why NVMe on the carrier and not USB (21 Nov 2026): on a USB enclosure, a write
# that stalled for 5 s sent UAS into its abort path, the CM5's xHCI controller
# died, and /var went with it (23 and 26 Oct 2026, on a SATA and an NVMe drive).
# The carrier's ASM1182e PCIe switch tops out at 5.0 GT/s (read from sysfs), so
# `pciex1_gen=3` would gain nothing here.
#
# Contains no secrets; committed as-is, never hydrated.
machine:
    nodeLabels:
        zagreus.asn.casa/role: arm-builder
    kubelet:
        extraConfig:
            # Applied when the Node object is created. Talos's own nodeTaints
            # cannot add a taint after registration (NodeRestriction), and
            # that refusal also blocks its labels (athena-gitops
            # docs/runbook-gpu-node-onboarding.md). Only pods that tolerate
            # this run here: the builder and the light lane.
            registerWithTaints:
                - key: zagreus.asn.casa/role
                  value: arm-builder
                  effect: NoSchedule
---
# Replace the base selector. The size guard keeps /var off a small Optane if
# one is ever fitted in the carrier's second slot.
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
    diskSelector:
        match: disk.transport == "nvme" && disk.size > 200u * GB
    minSize: 32GiB
    grow: true
---
# Arm the SoC's hardware watchdog (bcm2835 on the CM5), as athena's workers
# do (athena's bootstrap/talos/watchdog.patch.yaml and
# docs/runbook-node-watchdogs.md: why 2 minutes, what it catches, the
# forced-hang test, rollback). Applies live with no reboot. The Pi's own
# hardware limit is about 15 s; the kernel's watchdog core pings it between
# machined's 40 s feeds.
apiVersion: v1alpha1
kind: WatchdogTimerConfig
device: /dev/watchdog0
timeout: 2m
