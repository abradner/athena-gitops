# zagreus arm64 image builder (today zag-arm64-02): a CM5 8 GB Lite whose /var
# lives on a 256 GB NVMe SSD in a USB 3 (UASP) enclosure (Realtek RTL9210B),
# until an NVMe HAT replaces it. Always on, so
# arm64 image builds no longer wait for a Mac to be awake. It runs the
# docker-arm64 dind scale set and the light lane (unprivileged, no docker
# socket), which it shares with any arm64 runner nodes.
#
# Why a USB SSD and not a USB flash stick: dind and containerd do heavy small
# random writes, and a builder's cache grows to tens of GB (28 GB after two
# weeks on an existing builder). Flash sticks are slow at that and wear
# out. If the enclosure drops off the bus, the node loses /var and goes down;
# what runs here is the builder and the light lane, so that is the whole blast radius.
#
# Why NVMe in the enclosure and not the SATA SSD it started with (23 Oct
# 2026): the SATA drive stalled writes for seconds at a time, which matches it
# flushing its SLC cache under build load. A UAS write timed out, the abort
# path left the CM5's xHCI controller unresponsive ("HC died"), and every USB
# device on it dropped, /var included. It did so twice in an hour, the second
# time about a minute after boot. No under-voltage was logged. Talos then
# cannot finish a reset either, because it waits on the vanished EPHEMERAL
# volume; power-cycle the node instead. If it recurs with this drive,
# disabling UAS for the bridge (usb-storage.quirks=<vid>:<pid>:u) is the next
# step, at some cost in throughput.
#
# Contains no secrets; committed as-is, never hydrated.
machine:
    nodeLabels:
        zagreus.asn.casa/role: arm-builder
    kubelet:
        extraConfig:
            # Applied when the Node object is created. Talos's own nodeTaints
            # cannot add a taint after registration (NodeRestriction), and
            # that refusal also blocks its labels (athena-gitops
            # docs/runbook-gpu-node-onboarding.md). Only pods that tolerate
            # this run here: the builder and the light lane.
            registerWithTaints:
                - key: zagreus.asn.casa/role
                  value: arm-builder
                  effect: NoSchedule
---
# Replace the base selector (the NVMe, which this board has none of).
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
    diskSelector:
        # Transport only: many USB-SATA bridges report an SSD as rotational,
        # so `!disk.rotational` could match nothing and leave /var unprovisioned.
        match: disk.transport == "usb"
    minSize: 32GiB
    grow: true
---
# Arm the SoC's hardware watchdog (bcm2835 on the CM5), as athena's workers
# do (athena's bootstrap/talos/watchdog.patch.yaml and
# docs/runbook-node-watchdogs.md: why 2 minutes, what it catches, the
# forced-hang test, rollback). Applies live with no reboot. The Pi's own
# hardware limit is about 15 s; the kernel's watchdog core pings it between
# machined's 40 s feeds.
apiVersion: v1alpha1
kind: WatchdogTimerConfig
device: /dev/watchdog0
timeout: 2m
