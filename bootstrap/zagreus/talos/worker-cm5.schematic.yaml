# Image Factory schematic for zagreus's CM5 Lite nodes (control plane, arm64
# runners, arm64 builder). POST it to get the id:
#   curl -sS -X POST --data-binary @worker-cm5.schematic.yaml https://factory.talos.dev/schematics
# A changed file means a new id: update install.image in controlplane.template.yaml
# and worker.template.yaml, and the flash image the README names.
#
# The official sbc-raspberrypi rpi_5 overlay and one kernel argument, no
# extensions. sdhci.debug_quirks2=4 (SDHCI_QUIRK2_NO_1_8_V) keeps the SD card at
# 3.3 V High Speed. Without it, on some CM5 carriers, mainline's sdhci voltage
# switch to SDR104 fails and the card never appears: bare Factory 1.14.4
# boot-looped on such a board, while this schematic, on the same board and card,
# survived repeated boots, a power cycle and an upgrade with no SD errors. SD is
# boot-only on these nodes, so the slower bus costs nothing.
#
# No extensions on purpose: nothing here uses iSCSI, and an extension whose
# service is left unconfigured blocks boot and reboots the node on a timer.
#
# The fan: Talos 1.14's mainline kernel has no RP1 PWM driver, so the CM5's
# `cooling_fan` (pwm-fan on RP1 pwm1, GPIO45) never probes and the fan header
# never spins (siderolabs/pkgs#1499, siderolabs/sbc-raspberrypi#90). GPIO45
# drives the CM5's open-collector Fan_PWM line; holding it low through a
# gpio-hog lets the fan's own pull-up run it at full speed. Seen working on
# the arm64 builder's carrier, 2026-10-22. No temperature
# control until the RP1 PWM driver is mainlined; then drop this line for
# `dtparam=cooling_fan=on`. The overlay installer writes config.txt only on
# install and upgrade, so a node takes a change here through `talosctl
# upgrade` to the new installer.
#
# UAS off for the arm builder's USB NVMe enclosure (Realtek RTL9210B,
# 0bda:9210). Over UAS, a write that stalls for 5 s sends the kernel into its
# abort path, the CM5's xHCI controller stops answering ("HC died"), and every
# USB device drops, /var included. That happened on a SATA SSD and on this
# NVMe (23 and 26 Oct 2026, once at idle), so the drive was not the sole cause.
# usb-storage handles the same enclosure without UAS: slower, and so far
# without the controller death. The quirk names one USB ID, so it does nothing
# on CM5s without that enclosure.
#
# Pin the installer by digest ONLY (factory.talos.dev/metal-installer/<id>@sha256:…):
# a Talos 1.14.4 node fails `talosctl upgrade` from a tag@digest ref.
overlay:
  image: siderolabs/sbc-raspberrypi
  name: rpi_5
  options:
    configTxtAppend: |
      dtoverlay=gpio-hog,gpio=45,active_low
customization:
  extraKernelArgs:
    - sdhci.debug_quirks2=4
    - usb-storage.quirks=0bda:9210:u
