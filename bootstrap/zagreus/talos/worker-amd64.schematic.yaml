# Image Factory schematic for zagreus's amd64 nodes (HP ProDesk/EliteDesk
# desktops). POST it to get the id:
#   curl -sS -X POST --data-binary @worker-amd64.schematic.yaml https://factory.talos.dev/schematics
# A changed file means a new id: update install.image in worker-amd64.patch.yaml.
#
# The same schematic as athena's bare-metal GPU workers
# (bootstrap/talos/worker-gpu.schematic.yaml, id 462290b8…): one image for every
# amd64 desktop in either cluster, so a box can move between them, and zagreus
# stays a true canary for athena's metal. Keep the two files identical.
#   - i915: the iGPU driver and its DMC/GuC firmware. Even with nothing on the
#     display it lets the iGPU power-manage (RC6), which deeper package
#     C-states need, and it is what a VA-API job would use.
#   - mei: the Intel ME interface (AMT).
# Neither ships a service, so neither can hold up boot.
#
# Only what these nodes use. A system extension that ships a service (tailscale,
# cloudflared, nut-client, zfs) and is left unconfigured never reaches "up",
# so Talos's boot task startAllServices never finishes and the node reboots
# when the boot sequence times out. A node has been seen rebooting every 71
# minutes from exactly that. Add an extension here only together
# with its configuration.
#
# Secure Boot variant (metal-amd64-secureboot.iso, metal-installer-secureboot):
# ProDesks can ship with Secure Boot on, and the plain installer's
# unsigned bootloader fell through to PXE. Kernel args live here because the
# cmdline is baked into the signed UKI.
#   - console=ttyS4,115200n8 + 8250.nr_uarts=8: the AMT/ISM serial-over-LAN
#     UART on the Q-chipset ProDesks (no KVM on those, so SOL is the only remote
#     console). On a box whose SOL UART sits elsewhere this is harmless.
#   - module_blacklist=mei_wdt: the mei extension also brings mei_wdt, the
#     AMT agent watchdog (iamt_wdt). With it loaded the box has TWO watchdog
#     devices, and which one becomes /dev/watchdog0 is a probe race: on
#     2026-10-23 one zagreus ProDesk had iTCO there and its twin had iamt_wdt,
#     so Talos's WatchdogTimerConfig (device: /dev/watchdog0) armed the AMT
#     watchdog, which resets nothing without an AMT policy, and left iTCO idle.
#     Blacklisting the module leaves iTCO as the only device on these
#     boxes (another model could expose a different extra one: the identity
#     check catches that). AMT's power control and SOL run out of band in the
#     ME, and mei_me (the host driver) is untouched. The kernel's own module
#     loader honours module_blacklist=, whatever userspace asks for.
customization:
  extraKernelArgs:
    - console=tty0
    - console=ttyS4,115200n8
    - 8250.nr_uarts=8
    - module_blacklist=mei_wdt
  systemExtensions:
    officialExtensions:
      - siderolabs/i915
      - siderolabs/intel-ucode
      - siderolabs/mei
