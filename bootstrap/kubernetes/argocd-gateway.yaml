apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab-gateway
  namespace: default
spec:
  gatewayClassName: cilium
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    # This allows routes from any namespace to attach to this gateway
    allowedRoutes:
      namespaces:
        from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-ui
  namespace: argocd
spec:
  parentRefs:
  # Detached from the shared gateway 2026-11-14. Internal hosts move to their own
  # internal-only Gateway (athena-internal); until it exists this route is unattached.
  - name: athena-internal
    namespace: default
    sectionName: https-athena
  hostnames:
  - argo.athena.asn.casa
  rules:
  - backendRefs:
    - name: argocd-server
      port: 80

