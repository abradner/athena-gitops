# Like the Argo CD route in argocd-gateway.yaml: athena-internal comes from
# cluster-core and is HTTPS-only, so during bootstrap this route is unattached.
# Use `kubectl -n kube-system port-forward svc/hubble-ui 8081:80` until then.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: kube-system
spec:
  parentRefs:
  # Detached from the shared gateway 2026-11-14. Internal hosts move to their own
  # internal-only Gateway (athena-internal); until it exists this route is unattached.
  - name: athena-internal
    namespace: default
    sectionName: https-athena
  hostnames:
  - hubble.athena.asn.casa
  rules:
  - backendRefs:
    - name: hubble-ui
      port: 80
